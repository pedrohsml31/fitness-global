  {k:"coxa",l:"Coxa"},{k:"panturrilha",l:"Panturrilha"},{k:"pescoco",l:"Pescoço"}
];
function pad2(n){ return String(n).padStart(2,"0"); }
function fmtTime(ts){ const d=new Date(ts); return pad2(d.getHours())+":"+pad2(d.getMinutes()); }
function nowHM(){ const d=new Date(); return pad2(d.getHours())+":"+pad2(d.getMinutes()); }
function tsFor(date,hm){ const [y,m,dd]=date.split("-").map(Number); const [h,mi]=(hm||"12:00").split(":").map(Number); return new Date(y,m-1,dd,h,mi).getTime(); }
function shiftDay(date,n){ const [y,m,d]=date.split("-").map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return dt.getFullYear()+"-"+pad2(dt.getMonth()+1)+"-"+pad2(dt.getDate()); }
function dayLabel(date){ if(date===todayStr())return "Hoje · "+fmtDate(date); if(date===shiftDay(todayStr(),-1))return "Ontem · "+fmtDate(date); const wd=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"][new Date(date+"T00:00").getDay()]; return wd+" · "+fmtDate(date); }
function plannedForDay(date){ return db.plan.filter(m => m.fixed || m.date === date).sort((a,b)=>(a.time||"").localeCompare(b.time||"")); }
/* estado de um item planejado num dia:
   true = comido · "skip" = você decidiu não comer (riscado) · undefined = ainda em aberto.
   Em aberto só conta como "não consumido" depois que o dia passa. */
function itemState(it, date){ const v = it.done && it.done[date]; return v === true ? "done" : v === "skip" ? "skip" : "open"; }
function dayClosed(date){ return date < todayStr(); }
/* ===================== calorias e macros (modo opcional) =====================
   Fonte: TACO 4ª edição (NEPA/UNICAMP), 597 alimentos, valores por 100 g — é a tabela
   de referência brasileira, vem junto no app e funciona sem internet.
   Não usei a API do FatSecret de propósito: ela exige lista branca de IP e chave secreta,
   e a chave teria que ficar dentro do index.html, que é público. */
let TACO = null, tacoErr = null;
async function loadTaco(){
  if(TACO || tacoErr) return TACO;
  try{
    /* sem force-cache: são 33 KB uma vez por sessão, e com force-cache uma tabela
       corrigida ficaria presa no cache antigo do aparelho */
    const r = await fetch("taco.json?v=" + APP_VERSION);
    if(!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    /* [id, nome, categoria, kcal, proteína, carboidrato, gordura, fibra, sódio] */
    TACO = {cats:j.cats, list:j.alimentos.map(a=>({
      id:a[0], nome:a[1], cat:a[2], kcal:a[3], p:a[4], c:a[5], g:a[6], fib:a[7], na:a[8],
      norm:norm(a[1])}))};
  }catch(e){ tacoErr = (e && e.message) || String(e); }
  return TACO;
}
function tacoById(id){ return TACO ? TACO.list.find(a=>a.id===id) : null; }

/* ---- quanto foi comido: separa a quantidade do nome ----
   "100g de arroz" -> 100 g · "2 ovos" -> 2 unidades · "1/2 mamão" -> 0,5 unidade.
   Sem grama explícita a conta só fecha quando você disser quanto pesa 1 unidade — o app
   pergunta uma vez e guarda, em vez de eu chutar o peso da sua banana. */
const FRAC = {meia:0.5, meio:0.5, "1/2":0.5, "1/4":0.25, "3/4":0.75, um:1, uma:1, dois:2, duas:2, tres:3, quatro:4};
function parseQty(txt){
  const t = String(txt||"").trim();
  let m = t.match(/(\d+(?:[.,]\d+)?)\s*(kg|quilos?)\b/i);
  if(m) return {g:parseFloat(m[1].replace(",","."))*1000, resto:t.replace(m[0],"")};
  m = t.match(/(\d+(?:[.,]\d+)?)\s*(g|gr|gramas?)\b/i);
  if(m) return {g:parseFloat(m[1].replace(",",".")), resto:t.replace(m[0],"")};
  /* ml vira grama: vale para água, leite, sucos — não vale para óleo, e o app avisa */
  m = t.match(/(\d+(?:[.,]\d+)?)\s*(ml|mls)\b/i);
  if(m) return {g:parseFloat(m[1].replace(",",".")), ml:true, resto:t.replace(m[0],"")};
  m = t.match(/(\d+(?:[.,]\d+)?)\s*(l|litros?)\b/i);
  if(m) return {g:parseFloat(m[1].replace(",","."))*1000, ml:true, resto:t.replace(m[0],"")};
  m = t.match(/^\s*(1\/2|1\/4|3\/4|\d+(?:[.,]\d+)?|meia|meio)\s+/i);
  if(m){ const bruto = m[1].toLowerCase();       // "1/2" precisa vir cru: norm() come a barra
    const v = FRAC[bruto] != null ? FRAC[bruto] : parseFloat(bruto.replace(",","."));
    return {un: isFinite(v) ? v : 1, resto:t.slice(m[0].length)}; }
  return {un:1, resto:t};
}
/* nome limpo (sem a quantidade) — é a chave do que o app aprende */
function foodKey(txt){
  return norm(parseQty(txt).resto).replace(/^(de|do|da|dos|das)\s+/,"").trim();
}
/* ---- busca na TACO ---- palavra-chave do começo do nome pesa mais ("Arroz, tipo 1,
   cozido" tem "arroz" como cabeça), e nome mais curto ganha de nome mais específico
   quando a busca é genérica. */
function tacoSearch(q, lim){
  if(!TACO) return [];
  const qt = norm(q).split(/\s+/).filter(w=>w.length>2);
  if(!qt.length) return [];
  const res = [];
  TACO.list.forEach(a=>{
    const at = a.norm.split(/[\s,]+/).filter(Boolean);
    let s = 0, casou = 0;
    qt.forEach(w=>{
      const i = at.findIndex(x => x === w || x.startsWith(w) || w.startsWith(x));
      if(i >= 0){ casou++; s += (i === 0 ? 10 : 4); }
      else if(a.norm.includes(w)){ casou++; s += 2; }
    });
    if(casou < qt.length) s -= (qt.length - casou) * 6;   // termo não encontrado penaliza
    if(s <= 0) return;
    s -= at.length * 0.25;                                 // desempata pelo nome mais curto
    res.push({a, s});
  });
  return res.sort((x,y)=>y.s-x.s).slice(0, lim || 8).map(r=>r.a);
}
/* ---- nutrição de UM alimento registrado ----
   devolve {kcal,p,c,g,gramas} ou {pendente:motivo} */
function foodNutri(f){
  const map = db.foodMap || {};
  const key = foodKey(f.name);
  const m = f.nutri || map[key];                 // f.nutri = ajuste só daquele registro
  if(!m) return {pendente:"sem-tabela", key};
  const q = parseQty(f.name);
  let gramas = q.g;
  if(gramas == null){
    if(!m.g) return {pendente:"sem-peso", key, un:q.un};
    gramas = (q.un || 1) * m.g;
  }
  let base;
  if(m.t){ const a = tacoById(m.t); if(!a) return {pendente:"sem-tabela", key}; base = a; }
  else if(typeof m.kcal === "number") base = {kcal:m.kcal, p:m.p, c:m.c, g:m.g100};
  else return {pendente:"sem-tabela", key};
  const k = gramas / 100;
  return {gramas, key,
    kcal:(base.kcal||0)*k, p:(base.p||0)*k, c:(base.c||0)*k, g:(base.g||0)*k,
    nome: m.t ? (tacoById(m.t)||{}).nome : (m.nome || "valor digitado")};
}
function sumNutri(foods){
  const t = {kcal:0, p:0, c:0, g:0, pend:0, n:0};
  foods.forEach(f=>{ const x = foodNutri(f);
    if(x.pendente){ t.pend++; return; }
    t.kcal += x.kcal; t.p += x.p; t.c += x.c; t.g += x.g; t.n++; });
  return t;
}
const macrosOn = () => db.settings.macros === true;
const kcalTxt = v => Math.round(v).toLocaleString("pt-BR");
/* alimentos do dia que ainda não têm nutrição, agrupados por nome (para resolver em lote) */
function pendingFoods(day){
  const map = {};
  db.food.filter(f=>!day || f.date===day).forEach(f=>{
    const x = foodNutri(f);
    if(!x.pendente) return;
    const k = x.key || norm(f.name);
    (map[k] = map[k] || {key:k, motivo:x.pendente, exemplo:f.name, ids:[]}).ids.push(f.id);
  });
  return Object.values(map).sort((a,b)=>b.ids.length-a.ids.length);
}

/* ===================== IA para estimar nutrição (Gemini) =====================
   Usa a SUA chave do Google AI Studio, que é gratuita. Assinatura do Gemini/ChatGPT/
   Claude NÃO dá acesso de API — o que vale aqui é a chave do AI Studio.
   O app escolhe sozinho um modelo Flash (é o que fica no plano gratuito) consultando a
   lista de modelos da própria chave, para não quebrar quando a Google renomeia modelo.
   Só o NOME do alimento é enviado. */
const GEMINI_BASE = "https://generativelanguage.googleapis.com/v1beta";
function geminiKey(){ return (db.settings.aiKey || "").trim(); }
async function geminiFetch(path, opts){
  const r = await fetch(GEMINI_BASE + path, Object.assign({}, opts, {
    headers: Object.assign({"Content-Type":"application/json", "x-goog-api-key":geminiKey()}, (opts||{}).headers)
  }));
  const j = await r.json().catch(()=>({}));
  if(j && j.error){
    const m = j.error.message || "erro";
    if(j.error.code === 429) throw new Error("Cota do dia esgotada. O plano gratuito tem limite diário — tente amanhã.");
    if(j.error.code === 400 && /api key/i.test(m)) throw new Error("Chave inválida. Confira se copiou inteira do AI Studio.");
    if(j.error.code === 403) throw new Error("A chave não tem acesso. Gere uma nova no AI Studio.");
    throw new Error(m);
  }
  if(!r.ok) throw new Error("HTTP " + r.status);
  return j;
}
/* prefere o Flash-Lite (maior cota diária no gratuito) e evita "preview"/"exp",
   que a Google remove sem aviso */
function pickAiModel(ids){
  const ver = s => { const m = s.match(/(\d+)[.-](\d+)/); return m ? (+m[1])*100 + (+m[2]) : 0; };
  const ok = ids.filter(id => /flash/.test(id) && !/(preview|exp|thinking|image|audio|tts|live|vision)/.test(id));
  const ordena = a => a.slice().sort((x,y) => ver(y) - ver(x));
  return ordena(ok.filter(id=>/lite/.test(id)))[0] || ordena(ok)[0] || null;
}
async function aiConnect(){
  const j = await geminiFetch("/models?pageSize=200", {method:"GET"});
  const ids = (j.models||[])
    .filter(m => (m.supportedGenerationMethods||[]).includes("generateContent"))
    .map(m => String(m.name||"").replace(/^models\//, ""));
  const escolhido = pickAiModel(ids);
  if(!escolhido) throw new Error("Nenhum modelo Flash disponível para esta chave.");
  db.settings.aiModel = escolhido;
  save();
  return {modelo:escolhido, total:ids.length};
}
/* devolve {alimento, kcal, p, c, g, gUn, conf} por 100 g */
async function aiNutri(nome){
  if(!geminiKey()) throw new Error("Sem chave da IA. Configure nos Ajustes.");
  const model = db.settings.aiModel || (await aiConnect()).modelo;
  const j = await geminiFetch("/models/" + encodeURIComponent(model) + ":generateContent", {
    method:"POST",
    body: JSON.stringify({
      contents:[{parts:[{text:
        `Estime a composição nutricional do alimento: "${nome}".\n` +
        `Responda os valores POR 100 GRAMAS do alimento pronto para consumo.\n` +
        `Prefira a tabela TACO (NEPA/UNICAMP) como referência quando for comida brasileira.\n` +
        `Em "gramas_por_unidade", diga quanto pesa 1 unidade típica se o alimento for contável ` +
        `(1 ovo, 1 banana, 1 fatia); se não fizer sentido, responda 0.\n` +
        `Se não reconhecer o alimento, use confianca "nenhuma" e zeros.`}]}],
      generationConfig:{
        temperature: 0,
        responseMimeType: "application/json",
        responseSchema: { type:"OBJECT", properties:{
          alimento:{type:"STRING"}, kcal:{type:"NUMBER"}, proteina:{type:"NUMBER"},
          carboidrato:{type:"NUMBER"}, gordura:{type:"NUMBER"},
          gramas_por_unidade:{type:"NUMBER"},
          confianca:{type:"STRING", enum:["alta","media","baixa","nenhuma"]}
        }, required:["alimento","kcal","proteina","carboidrato","gordura","confianca"] }
      }
    })
  });
  const txt = (((j.candidates||[])[0]||{}).content||{}).parts;
  const raw = txt && txt[0] && txt[0].text;
  if(!raw) throw new Error("A IA não respondeu nada. Tente de novo.");
  let d; try{ d = JSON.parse(raw); }catch(e){ throw new Error("Resposta da IA veio ilegível."); }
  if(d.confianca === "nenhuma") throw new Error(`A IA não reconheceu "${nome}". Digite os valores do rótulo.`);
  const n = v => { const x = Number(v); return isFinite(x) && x >= 0 ? Math.round(x*10)/10 : 0; };
  return {alimento:d.alimento || nome, kcal:n(d.kcal), p:n(d.proteina), c:n(d.carboidrato),
    g:n(d.gordura), gUn:n(d.gramas_por_unidade), conf:d.confianca || "baixa", model};
}

/* ---------- refeição livre ----------
   Marcar como livre TIRA o item da conta da dieta (não conta como acerto nem como erro),
   em vez de contar como falha. O preço é o limite semanal: qualquer marca de livre numa
   refeição gasta UMA livre da semana, seja a refeição toda ou um alimento só. */
function freeKey(day, name){ return day + "|" + name; }
function mealFree(day, name){ return !!(db.free||{})[freeKey(day, name)]; }
function itemFree(it, day){ return !!(it.free && it.free[day]); }
function isFree(m, it, day){ return mealFree(day, m.name) || itemFree(it, day); }
/* nomes de refeição que têm alguma marca de livre no dia (refeição toda, item do plano
   ou alimento registrado) — cada nome vale uma livre */
function freeMealsOfDay(day){
  const s = new Set(), f = db.free || {};
  Object.keys(f).forEach(k=>{ const i = k.indexOf("|");
    if(f[k] && k.slice(0, i) === day) s.add(k.slice(i+1)); });
  plannedForDay(day).forEach(m=>{ if(m.items.some(it=>itemFree(it, day))) s.add(m.name); });
  db.food.forEach(x=>{ if(x.date === day && x.free) s.add(x.meal); });
  return s;
}
function freeWeek(day){
  const wk = weekKeyOf(day), det = [];
  for(let i=0;i<7;i++){ const d = shiftDay(wk, i);
    freeMealsOfDay(d).forEach(name=>det.push({d, name})); }
  return {n:det.length, det, limite:Number(db.settings.freeWeek) || 0, semana:wk};
}
function freeWeekHtml(day){
  const w = freeWeek(day);
  if(!w.limite && !w.n) return "";
  const sobra = w.limite - w.n;
  const cor = !w.limite ? "var(--muted)" : sobra < 0 ? "var(--bad)" : sobra === 0 ? "var(--gold)" : "var(--good)";
  return `<div class="sub" style="margin:2px 0 8px">🎉 Refeições livres nesta semana:
    <b style="color:${cor}">${w.n}${w.limite?` de ${w.limite}`:""}</b>${w.limite?(sobra>0?` · ainda pode ${sobra}`:sobra===0?" · acabou a cota":` · ${-sobra} além do combinado`):" · sem limite definido"}
    ${w.det.length?`<br><span style="font-size:.74rem">${w.det.map(x=>esc(x.name)+" ("+fmtDate(x.d).slice(0,5)+")").join(" · ")}</span>`:""}</div>`;
}
function adherence(date){
  let t=0, d=0, open=0, free=0;
  plannedForDay(date).forEach(m=>m.items.forEach(it=>{
    if(isFree(m, it, date)){ free++; return; }   // livre: fora da conta, nem acerto nem erro
    const st = itemState(it, date);
    if(st === "done"){ t++; d++; }
    else if(st === "skip"){ t++; }
    else if(dayClosed(date)) t++;      // passou o dia sem marcar: conta como não ingerido
    else open++;
  }));
  return {t, d, open, free, pct: t?Math.round(d/t*100):null};
}
/* itens que ainda estão em aberto num dia (o que o botão "não consumi o resto" risca) */
function openItemsOf(date){
  let n = 0;
  plannedForDay(date).forEach(m=>m.items.forEach(it=>{
    if(!isFree(m, it, date) && itemState(it, date) === "open") n++; }));
  return n;
}

/* dias já encerrados com itens do plano sem marcar (nem ✓ nem riscado) — para o app
   avisar "preencha o que você comeu ontem". Refeições criadas depois do dia não contam. */
function unfilledPlanDays(){
  const out=[], dis=db.settings.dietDismiss||{};
  for(let i=1;i<=3;i++){
    const d=shiftDay(todayStr(),-i);
    if(dis[d]) continue;
    let n=0;
    plannedForDay(d).forEach(m=>{
      if(m.created && m.created > d) return;
      m.items.forEach(it=>{ if(!isFree(m, it, d) && itemState(it,d)==="open") n++; });
    });
    if(n) out.push({d,n});
  }
  return out;
}
/* um aviso só, do dia mais recente que ficou em aberto */
function dietWarnHtml(){
  const list = unfilledPlanDays();
  if(!list.length) return "";
  const x = list[0], outros = list.length - 1;
  return `<div class="updbanner" style="margin-bottom:10px">
    <span style="font-size:1.2rem">📋</span>
    <div class="grow"><b>${dayLabel(x.d)}</b> — ${x.n} ite${x.n===1?"m":"ns"} da dieta sem marcar
      <div class="sub">Preencha o que comeu (ou risque o que não comeu)${outros?` · mais ${outros} dia${outros>1?"s":""} em aberto`:""}</div></div>
    <button class="btn sm" style="width:auto" data-action="food-fill" data-d="${x.d}">Preencher</button>

/* ---------- Alimentação: relatório ---------- */
function periodFoodStats(days, endDay){
  endDay = endDay || todayStr();
  const from = shiftDay(endDay,-(days-1));
  const inRange = d => d>=from && d<=endDay;
  const foods = db.food.filter(f=>inRange(f.date));
  const urges = db.urges.filter(u=>inRange(u.date));
  let totPlan=0, donePlan=0, skipPlan=0, freeItems=0, freeMeals=0;
  for(let i=0;i<days;i++){ const d=shiftDay(endDay,-i); const ad=adherence(d);
    totPlan+=ad.t; donePlan+=ad.d; freeItems+=ad.free; freeMeals+=freeMealsOfDay(d).size;
    plannedForDay(d).forEach(m=>m.items.forEach(it=>{
      if(!isFree(m,it,d) && itemState(it,d)==="skip") skipPlan++; })); }
  const intens = urges.map(u=>u.intensity);
  return {
    urges: urges.length,
    binges: urges.filter(u=>u.gaveIn).length,
    avgInt: intens.length ? (intens.reduce((a,b)=>a+b,0)/intens.length) : null,
    maxInt: intens.length ? Math.max(...intens) : null,
    outside: foods.filter(f=>!f.planned && !f.free).length,
    freeItems, freeMeals,
    /* média por DIA COM REGISTRO — dividir por 7 puxaria a média para baixo nos dias vazios */
    nutri: (()=>{ const dias = [...new Set(foods.map(f=>f.date))];
      const t = sumNutri(foods);
      return {dias:dias.length, pend:t.pend,
        kcal: dias.length ? t.kcal/dias.length : null,
        p: dias.length ? t.p/dias.length : null,
        c: dias.length ? t.c/dias.length : null,
        g: dias.length ? t.g/dias.length : null}; })(),
    bingeFoods: foods.filter(f=>f.binge).length,
    refeicoes: foods.filter(f=>f.kind==="refeicao").length,
    lanches: foods.filter(f=>f.kind==="lanche").length,
    adherence: totPlan?Math.round(donePlan/totPlan*100):null,
    planTot: totPlan, planDone: donePlan, notEaten: totPlan-donePlan, planSkip: skipPlan
  };
}

const MES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
function monthLabel(k){ const [y,m]=k.split("-"); return MES[+m-1] + "/" + y.slice(2); }
/* agrupa os dias registrados por semana (segunda a domingo) ou por mês */
function actGroups(keyOf){
  const map = {};
  db.body.forEach(b=>{
    if(!actFromOk(b.date)) return;                 // antes da data de corte: não conta
    const k = keyOf(b.date);
    const r = map[k] = map[k] || {musc:0, cardio:0, cmin:0, steps:0, sdays:0, dias:{}};
    if(b.musc) r.musc++;
    if(b.cardio){ r.cardio++; if(typeof b.cardioMin === "number") r.cmin += b.cardioMin; }
    if(typeof b.steps === "number" && b.steps > 0){ r.steps += b.steps; r.sdays++; r.dias[dowIndex(b.date)] = b.steps; }
  });
  return map;
}

function bodySorted(){ return db.body.filter(b=>typeof b.kg==="number").sort((a,b)=>a.date<b.date?-1:1); }
/* último peso corporal registrado — usado nos exercícios marcados como "peso do corpo" */
function lastBodyWeight(){ const s = bodySorted(); return s.length ? s[s.length-1] : null; }
function weekKeyOf(date){ const d=new Date(date+"T00:00"); const off=(d.getDay()+6)%7; d.setDate(d.getDate()-off); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function weeklyWeight(){
  const map={}; bodySorted().forEach(b=>{ const k=weekKeyOf(b.date); (map[k]=map[k]||[]).push(b.kg); });
  return Object.keys(map).sort().map(k=>({week:k, avg:map[k].reduce((a,b)=>a+b,0)/map[k].length, n:map[k].length}));
}
/* tabela tipo planilha: uma linha por semana, um peso por dia e a média no fim */
const DOW = ["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
function dowIndex(date){ const d=new Date(date+"T00:00").getDay(); return (d+6)%7; }   // 0 = segunda
function weightTable(nWeeks){
  const rows = {};
  bodySorted().forEach(b=>{ const k=weekKeyOf(b.date); (rows[k]=rows[k]||{})[dowIndex(b.date)] = b.kg; });
  const keys = Object.keys(rows).sort().slice(-nWeeks).reverse();
  if(!keys.length) return `<div class="empty">Registre seu peso para ver a tabela da semana.</div>`;
  const avgOf = k => { const v=Object.values(rows[k]); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; };
  const body = keys.map((k,i)=>{
    const avg = avgOf(k);
    const prevK = keys[i+1];                       // semana anterior (a lista está do mais novo p/ o mais antigo)
    const diff = prevK ? avg - avgOf(prevK) : null;
    const cells = DOW.map((_,j)=>{ const v=rows[k][j];
      return `<td>${typeof v==="number"?fmtW(v):"<span class='nil'>–</span>"}</td>`; }).join("");
    return `<tr><th>${fmtDate(k)}</th>${cells}<td class="avg">${fmtW(avg)}</td>
      <td class="dl ${diff==null?"":diff<-0.005?"down":diff>0.005?"up":""}">${diff==null?"–":(diff>0?"+":"")+fmtW(diff)}</td></tr>`;
  }).join("");
  return `<div class="tblwrap"><table class="xls">
    <thead><tr><th>Semana de</th>${DOW.map(d=>`<th>${d}</th>`).join("")}<th class="avg">Média</th><th>Δ</th></tr></thead>
    <tbody>${body}</tbody></table></div>
    <div class="sub" style="margin-top:8px">Δ = diferença da média desta semana em relação à semana anterior.</div>`;
}

function drawWeightChart(series){

  let min=Math.min(...pts.map(p=>p.v)), max=Math.max(...pts.map(p=>p.v));
  if(min===max){min-=1;max+=1;} const pad=(max-min)*0.15; min-=pad; max+=pad;
  const X=i=>L+(W-L-R)*(i/(pts.length-1)), Y=v=>T+(H-T-B)*(1-(v-min)/(max-min));

  let dots=""; pts.forEach((p,i)=>{ const last=i===pts.length-1; dots+=`<circle class="dot${last?" last":""}" cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${last?4:2.5}"/>`; if(last) dots+=`<text class="lastlbl" x="${Math.min(X(i),W-R-14)}" y="${Math.max(Y(p.v)-9,11)}" text-anchor="middle">${fmtW(p.v)}</text>`; });
  wrap.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução do peso">

    ${grid}<text class="axislbl" x="${L}" y="${H-7}">${fmtDate(pts[0].d)}</text><text class="axislbl" x="${W-R}" y="${H-7}" text-anchor="end">${fmtDate(pts[pts.length-1].d)}</text>
    <path d="${area}" fill="url(#wg)"/><path class="serie" d="${line}"/>${dots}</svg>`;
}

function localDateOf(iso){ const d=new Date(iso); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }

/* tipos de atividade que o Health Connect entrega -> nome em português + como contar */
const ACT_TYPES = {

  SWIMMING_POOL:{l:"Natação",e:"🏊",k:"cardio"}, SWIMMING_OPEN_WATER:{l:"Natação (mar)",e:"🏊",k:"cardio"},
  HIGH_INTENSITY_INTERVAL_TRAINING:{l:"HIIT",e:"🔥",k:"cardio"}, BOOT_CAMP:{l:"Funcional",e:"🔥",k:"cardio"},
  BOXING:{l:"Boxe",e:"🥊",k:"cardio"}, MARTIAL_ARTS:{l:"Artes marciais",e:"🥋",k:"cardio"},
  SOCCER:{l:"Futebol",e:"⚽",k:"cardio"}, BASKETBALL:{l:"Basquete",e:"🏀",k:"cardio"},
  TENNIS:{l:"Tênis",e:"🎾",k:"cardio"}, VOLLEYBALL:{l:"Vôlei",e:"🏐",k:"cardio"},
  DANCING:{l:"Dança",e:"💃",k:"cardio"}, EXERCISE_CLASS:{l:"Aula",e:"🏫",k:"cardio"},
  GYMNASTICS:{l:"Ginástica",e:"🤸",k:"cardio"}, ROCK_CLIMBING:{l:"Escalada",e:"🧗",k:"cardio"},
  YOGA:{l:"Yoga",e:"🧘",k:"skip"}, PILATES:{l:"Pilates",e:"🧘",k:"skip"}, STRETCHING:{l:"Alongamento",e:"🤸",k:"skip"},
  GOLF:{l:"Golfe",e:"⛳",k:"skip"}, OTHER:{l:"Outro treino",e:"❓",k:"ask"}
};
function actInfo(t){ return ACT_TYPES[t] || {l:String(t||"Treino").replace(/_/g," ").toLowerCase(), e:"❓", k:"ask"}; }
/* recordingMethod do Health Connect: 2 = o relógio detectou sozinho (automático) */
function isAuto(a){ return !!a && a.rec === 2; }
/* data de corte da atividade: dias anteriores a ela não são importados nem entram nas
   contas (tabelas, faixa de 14 dias, resumo de 7 dias). Nada é apagado — é só deixar a
   data em branco de novo que tudo volta. */
function actFromOk(d){ const f = db.settings.actFrom; return !f || String(d) >= f; }
/* a escolha do usuário é guardada por tipo; atividades automáticas têm chave própria,
   assim "caminhada automática" pode não contar sem afetar uma caminhada que você iniciou */
function actKey(a){ return isAuto(a) ? a.t + "#auto" : a.t; }
/* "ask" = o app não sabe se é musculação ou cardio; você decide tocando na etiqueta */
/* quando o Samsung manda o tipo genérico ("Outro exercício"), tenta adivinhar pelo nome do treino */
function guessByName(nome){
  const n = norm(nome);
  if(!n) return null;
  if(/muscula|aparelho|weight|strength|forca|halter|academia/.test(n)) return "musc";
  if(/bicicl|bike|cycl|spinning|corrida|running|caminhad|walk|eliptic|remo|rowing|nata|swim|escada|stair|hiit|funcional|esteira/.test(n)) return "cardio";
  return null;
}
/* A caminhada é onde o relógio mais erra: ele detecta sozinho e o tipo chega como
   WALKING, que é "cardio" por natureza. Só que nem sempre vem marcada como automática —
   o Samsung manda várias com recordingMethod 0 ("origem não informada"), e aí a
   caminhada do dia a dia entrava como sessão de cardio. Como os PASSOS já medem a
   caminhada, ela só conta como cardio se VOCÊ tiver iniciado (recordingMethod 1).
   Tocando na etiqueta você troca e o app lembra (o actMap tem prioridade). */
function isPasseio(a){
  return typeof a === "object" && /^(WALKING|HIKING)$/.test(String(a.t||"").toUpperCase()) && a.rec !== 1;
}
function actKind(a){
  const m = db.settings.actMap || {};
  const key = typeof a === "string" ? a : actKey(a);
  if(m[key]) return m[key];
  if(typeof a === "object" && isAuto(a) && db.settings.ignoreAuto !== false) return "skip";
  if(isPasseio(a) && db.settings.ignoreAuto !== false) return "skip";
  const base = actInfo(typeof a === "string" ? a : a.t).k;
  if(base === "ask" && typeof a === "object"){
    const g = guessByName(a.nome); if(g) return g;
    /* O Samsung manda "Aparelhos musculação" como tipo genérico e muitas vezes SEM nome.
       Se foi VOCÊ que iniciou, conta como musculação — bike/corrida chegam com o tipo
       certo, então o genérico manual é a sua musculação. Toque na etiqueta p/ mudar. */
    if(!isAuto(a)) return "musc";
  }
  return base;
}
function deriveActs(e){
  if(!e) return;
  const acts = e.acts || [];
  if(!acts.length && !e.muscM && !e.cardioM && typeof e.cardioMinM !== "number") return;  // nada importado: preserva o registro manual
  let musc = !!e.muscM, cardio = !!e.cardioM, cmin = 0;
  acts.forEach(a => { const k = actKind(a);
    if(k === "musc") musc = true;
    else if(k === "cardio"){ cardio = true; cmin += a.min || 0; } });
  e.musc = musc; e.cardio = cardio;
  e.cardioMin = (typeof e.cardioMinM === "number") ? e.cardioMinM : (cmin || undefined);
}
function deriveAllActs(){ db.body.forEach(deriveActs); }
/* migração v11: o que já estava marcado à mão passa a ser "manual" e não é mais
   sobrescrito pela importação do Samsung Health */
function migrateManualActs(){
  if(db.settings.migAct11) return;
  db.body.forEach(b => {
    if(!b.acts || !b.acts.length){
      if(b.musc) b.muscM = true;
      if(b.cardio) b.cardioM = true;
      if(typeof b.cardioMin === "number") b.cardioMinM = b.cardioMin;
    }
    if(typeof b.kg === "number" && !b.kgSrc) b.kgSrc = "manual";   // peso digitado nunca é sobrescrito
  });
  db.settings.migAct11 = true;
  save(false);
}
/* migração v12: refeições do plano ganham data de criação — o aviso de "dia sem preencher"
   só olha dias a partir daí (não reclama de dias antes de o plano existir) */
/* migração v19: a regra nova da caminhada muda dias que JÁ foram importados —
   recalcula musc/cardio de todos eles uma vez */
function migrateWalk19(){
  if(db.settings.migWalk19) return;
  deriveAllActs();
  db.settings.migWalk19 = true;
  save(false);
}
function migratePlan12(){

  db.settings.migPlan12 = true;

/* O Health Connect só libera 30 dias para trás, contados de quando a permissão foi
   concedida — e, se você pedir uma janela maior, ele REJEITA a leitura inteira em vez de
   devolver o que pode. Era isso que zerava a importação: eu pedia 60 dias.
   Com READ_HISTORY concedida o limite some. Sem ela, a leitura larga falha e aqui a
   gente tenta de novo com 27 dias, para pelo menos os dados recentes entrarem. */
let janelaCurta = false;
async function readWindow(fn, start, end){
  try{ return {r: await fn(start, end)}; }
  catch(e){
    const s2 = new Date(); s2.setDate(s2.getDate()-27); s2.setHours(0,0,0,0);
    if(s2 <= start) throw e;                       // já era janela curta: o erro é outro
    const r = await fn(s2, end);                   // se esta também falhar, o erro sobe
    janelaCurta = true;
    return {r, cortou:true, erroLargo:(e && e.message) || String(e)};
  }
}
async function importHealth(silent){
  const H = native.plugin("HealthPlugin");
  if(!native.isNative || !H){ if(!silent) toast("Disponível só no app do celular 📱"); return; }
  try{
    const av = await H.isHealthAvailable();
    if(!av || !av.available){ if(!silent && confirm("O Health Connect não está instalado/ativo. Abrir na Play Store?")) { try{ H.showHealthConnectInPlayStore(); }catch(e){} } return; }
    await H.requestHealthPermissions({permissions:["READ_STEPS","READ_WORKOUTS","READ_WEIGHT","READ_BODY_FAT"]});
    /* pedida à parte e engolindo erro: se o Health Connect do aparelho for antigo e não
       conhecer essa permissão, isso não pode derrubar o pedido das outras */
    try{ await H.requestHealthPermissions({permissions:["READ_HISTORY"]}); }catch(e){ console.warn("history", e); }
    try{ db.settings.hist = permMap(await H.checkHealthPermissions({permissions:["READ_HISTORY"]})).READ_HISTORY; }catch(e){ db.settings.hist = null; }
    db.settings.lastErr = null;                       // erro antigo não fica pendurado no 🔎
    /* se a permissão de PESO ficou de fora, avisa na lata — era o que estava travando */
    let wperm = null;
    try{ wperm = permMap(await H.checkHealthPermissions({permissions:["READ_WEIGHT"]})).READ_WEIGHT; }catch(e){}
    /* fica visível na tela de Evolução até ser resolvido — toast some rápido demais */
    db.settings.wDenied = (wperm === false && !!H.queryWeight);
    const start = new Date(); start.setDate(start.getDate()-59); start.setHours(0,0,0,0);   // 60 dias
    const end = new Date();
    let days=0, kgs=0;
    janelaCurta = false;
    try{
      const sr = (await readWindow((s,e)=>H.queryAggregated({startDate:s.toISOString(), endDate:e.toISOString(), dataType:"steps", bucket:"day"}), start, end)).r;
      (sr.aggregatedData||[]).forEach(s=>{ const d=localDateOf(s.startDate);
        if(s.value>0 && actFromOk(d)){ const e=bodyEntry(d); e.steps=Math.round(s.value); days++; } });
    }catch(e){ console.warn("steps", e); }
    try{
      const wr = (await readWindow((s,e)=>H.queryWorkouts({startDate:s.toISOString(), endDate:e.toISOString(), includeHeartRate:false, includeRoute:false, includeSteps:false}), start, end)).r;
      const byDay = {};   // idempotente: cada importação REESCREVE as atividades do dia
      (wr.workouts||[]).forEach(w=>{
        const d = localDateOf(w.startDate);
        if(!actFromOk(d)) return;                  // antes da data de corte: nem entra
        const t = String(w.workoutType || "OTHER").toUpperCase();
        let min = Math.round((Number(w.duration)||0)/60);
        if(!min && w.startDate && w.endDate) min = Math.round((new Date(w.endDate)-new Date(w.startDate))/60000);
        (byDay[d] = byDay[d] || []).push({t, min, src:(w.sourceName||w.deviceModel||""),
          rec:(typeof w.recordingMethod==="number"?w.recordingMethod:0),
          raw:(typeof w.exerciseTypeRaw==="number"?w.exerciseTypeRaw:null),
          nome:String(w.title||"")});
      });

        const e = bodyEntry(d);
        e.acts = byDay[d];
        deriveActs(e);
      });
      const all = (wr.workouts || []);
      db.settings.lastImport = { when: Date.now(), workouts: all.length,
        types: [...new Set(all.map(w => String(w.workoutType || "OTHER")))].slice(0, 8),
        dias: Object.keys(byDay).length,
        det: all.slice(-16).map(w => ({d:localDateOf(w.startDate), t:String(w.workoutType||"OTHER"),
          min:Math.round((Number(w.duration)||0)/60), src:String(w.sourceName||w.deviceModel||""),
          rec:(typeof w.recordingMethod==="number"?w.recordingMethod:0),
          raw:(typeof w.exerciseTypeRaw==="number"?w.exerciseTypeRaw:null),
          nome:String(w.title||"")})) };
    }catch(e){ console.warn("workouts", e); db.settings.lastErr = "treinos: " + ((e&&e.message)||e); }
    kgs = await importWeights(H, start, end);
    const bfs = await importBodyFat(H, start, end);
    save();
    /* não redesenha por cima de um campo que você está preenchendo (a sync roda sozinha) */
    const busy = document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if(!silent || (!busy && !modal.classList.contains("on"))) render();
    if(!silent){
      const lwx = db.settings.lastWeights || {};
      if(!H.queryWeight) toast("Passos e treinos ok — mas este APK ainda não lê peso. Instale a versão nova pelo botão Atualizar.");
      else if(wperm === false) toast("Falta permitir PESO no Health Connect — toque em 🔎 → Abrir Health Connect.");
      else if(!lwx.n) toast("Passos e treinos ok — mas o Health Connect não tem nenhuma pesagem. Toque em 🔎 → 🧪 Testar leitura de peso.");
      else toast(days||kgs||bfs ? `Importado do Health Connect ✓ (${days} dia(s)${kgs?`, ${kgs} peso(s)`:""}${bfs?`, ${bfs} BF`:""})` : "Sincronizado — nada novo por enquanto.");
    }
  }catch(err){ console.warn("health", err); db.settings.lastErr = "geral: " + ((err&&err.message)||err); save(false);
    if(!silent) toast("Não deu para importar. Verifique as permissões no Health Connect."); }
}
/* peso da balança (Yunmai -> Samsung Health -> Health Connect).
   Fica com a última pesagem de cada dia e guarda o que fez com CADA uma (res[]), para o
   🔎 conseguir dizer por que um peso que está no Health Connect não apareceu no app. */
async function importWeights(H, start, end){
  if(!H) return 0;
  /* o APK antigo não tem esse método nativo — sem isso não há como ler a balança */
  if(!H.queryWeight){ db.settings.lastWeights = {when:Date.now(), n:0, noMethod:true, det:[], res:[]}; return 0; }
  try{
    const out = await readWindow((s,e)=>H.queryWeight({startDate:s.toISOString(), endDate:e.toISOString()}), start, end);
    const list = out.r.weights || [];
    const from = db.settings.weightFrom || null;
    /* Descarta valor impossível ANTES de escolher a pesagem do dia. O openScale sync já
       gravou registros com 0 kg aqui; se num dia existir uma boa e uma zerada, a boa tem
       que ganhar — antes eu pegava a mais recente e só depois olhava o valor. */
    const valido = w => { const k = Number(w.kg); return isFinite(k) && k >= 20 && k <= 400; };
    const zerados = list.filter(w => !valido(w));
    const byDay = {};
    list.filter(valido).forEach(w=>{ const d = localDateOf(w.time); if(!byDay[d] || byDay[d].time < w.time) byDay[d] = w; });
    /* dia que só teve registro inválido continua aparecendo no diagnóstico, para o
       problema não sumir de vista */
    zerados.forEach(w=>{ const d = localDateOf(w.time); if(!byDay[d]) byDay[d] = w; });
    const res = []; let n = 0;
    Object.keys(byDay).sort().forEach(d=>{
      const kg = Math.round(Number(byDay[d].kg)*100)/100;
      const src = String(byDay[d].deviceModel || byDay[d].sourceBundleId || "");
      const put = (act, antes) => res.push({d, kg, src, act, antes});
      if(from && d < from){ put("antes-da-data"); return; }         // só a partir da data escolhida
      if(!kg || kg < 20 || kg > 400){ put("fora-da-faixa"); return; }
      const e = bodyEntry(d);
      const manual = typeof e.kg === "number" && e.kgSrc !== "health";
      /* "a balança manda" ligado: o valor da balança substitui o digitado (o antigo fica
         registrado aqui no diagnóstico). Desligado: o que você digitou é preservado. */
      if(manual && db.settings.scaleWins === false){ put("bloqueado", e.kg); return; }
      if(e.kg === kg){ put("ja-estava"); return; }
      const antes = typeof e.kg === "number" ? e.kg : null;
      e.kg = kg; e.kgSrc = "health"; n++;
      put(manual ? "substituiu" : antes != null ? "atualizou" : "novo", antes);
    });
    db.settings.lastWeights = { when:Date.now(), n:list.length, aplicados:n,
      cortou:out.cortou, erroLargo:out.erroLargo, zerados:zerados.length,
      zeradosDe:zerados.length ? localDateOf(zerados.map(w=>w.time).sort()[0]) : null,
      fonte:[...new Set(list.map(w=>String(w.sourceBundleId||w.deviceModel||"?")))].join(", "),
      dias:Object.keys(byDay).length, res:res.slice(-14),
      det:list.slice(-10).map(w=>({d:localDateOf(w.time), kg:Math.round(Number(w.kg)*100)/100, src:String(w.deviceModel||w.sourceBundleId||"")})) };
    return n;
  }catch(e){ console.warn("weight", e); db.settings.lastErr = "peso: " + ((e&&e.message)||e);
    db.settings.lastWeights = {when:Date.now(), n:0, erro:((e&&e.message)||String(e)), det:[], res:[]}; return 0; }
}
/* gordura corporal (Yunmai -> openScale -> openScale sync -> Health Connect).
   Mesmas regras do peso: fica com a última medição de cada dia, respeita a data de corte
   e o "a balança manda", e registra o que fez com cada uma. */
async function importBodyFat(H, start, end){
  if(!H) return 0;
  if(!H.queryBodyFat){ db.settings.lastBF = {when:Date.now(), n:0, noMethod:true, res:[]}; return 0; }
  try{
    const out = await readWindow((s,e)=>H.queryBodyFat({startDate:s.toISOString(), endDate:e.toISOString()}), start, end);
    const list = out.r.bodyFat || [];
    const from = db.settings.weightFrom || null;
    const valido = w => { const p = Number(w.pct); return isFinite(p) && p >= 2 && p <= 75; };
    const zerados = list.filter(w => !valido(w));
    const byDay = {};
    list.filter(valido).forEach(w=>{ const d = localDateOf(w.time); if(!byDay[d] || byDay[d].time < w.time) byDay[d] = w; });
    zerados.forEach(w=>{ const d = localDateOf(w.time); if(!byDay[d]) byDay[d] = w; });
    const res = []; let n = 0;
    Object.keys(byDay).sort().forEach(d=>{
      const pct = Math.round(Number(byDay[d].pct)*100)/100;
      const src = String(byDay[d].deviceModel || byDay[d].sourceBundleId || "");
      const put = (act, antes) => res.push({d, v:pct, src, act, antes});
      if(from && d < from){ put("antes-da-data"); return; }
      if(!pct || pct < 2 || pct > 75){ put("fora-da-faixa"); return; }
      const e = bodyEntry(d);
      const manual = typeof e.bf === "number" && e.bfSrc !== "health";
      if(manual && db.settings.scaleWins === false){ put("bloqueado", e.bf); return; }
      if(e.bf === pct){ put("ja-estava"); return; }
      const antes = typeof e.bf === "number" ? e.bf : null;
      e.bf = pct; e.bfSrc = "health"; n++;
      put(manual ? "substituiu" : antes != null ? "atualizou" : "novo", antes);
    });
    db.settings.lastBF = { when:Date.now(), n:list.length, aplicados:n, zerados:zerados.length,
      dias:Object.keys(byDay).length, res:res.slice(-14) };
    return n;
  }catch(e){ console.warn("bodyfat", e); db.settings.lastErr = "gordura: " + ((e&&e.message)||e);
    db.settings.lastBF = {when:Date.now(), n:0, erro:((e&&e.message)||String(e)), res:[]}; return 0; }
}
/* teste ao vivo, sem filtro nenhum: lê 365 dias e mostra tudo que o Health Connect entrega.
   Serve para separar "não tem pesagem lá" de "tem, mas o app descartou". */
async function weightProbe(){
  const H = native.plugin("HealthPlugin");
  if(!native.isNative || !H) return {ok:false, msg:"Só no app do celular."};
  if(!H.queryWeight) return {ok:false, msg:"Este APK não tem a leitura de peso — instale a versão nova."};
  const s = new Date(); s.setDate(s.getDate()-364); s.setHours(0,0,0,0);
  try{
    /* 365 dias quase sempre estoura o limite do Health Connect — o readWindow cai para
       27 dias sozinho, e o "cortou" avisa que foi isso que aconteceu */
    const out = await readWindow((a,b)=>H.queryWeight({startDate:a.toISOString(), endDate:b.toISOString()}), s, new Date());
    const list = (out.r.weights||[]).slice().sort((a,b)=>String(a.time)<String(b.time)?1:-1);
    return {ok:true, n:list.length, cortou:out.cortou, erroLargo:out.erroLargo, list:list.slice(0,12).map(w=>({
      d:localDateOf(w.time), hm:fmtTime(new Date(w.time).getTime()),
      kg:Math.round(Number(w.kg)*100)/100, src:String(w.deviceModel||w.sourceBundleId||"")}))};
  }catch(e){ return {ok:false, msg:"Erro ao ler: " + ((e&&e.message)||e)}; }
}
/* a resposta de permissões vem em formatos diferentes conforme a versão do plugin —
   normaliza tudo para {READ_STEPS:true/false, READ_WORKOUTS:true/false} */
function permMap(res){
  const out = {};
  const put = o => { if(o && typeof o === "object") Object.keys(o).forEach(k => {
    if(typeof o[k] === "boolean") out[k] = (out[k] === true) ? true : o[k]; }); };
  if(!res) return out;
  if(Array.isArray(res.permissions)) res.permissions.forEach(put);
  else put(res.permissions);
  put(res);
  return out;
}

const WACT = {
  novo:"✅ entrou no app", atualizou:"✅ atualizou", substituiu:"✅ substituiu o digitado",
  "ja-estava":"· já estava igual", bloqueado:"⛔ você digitou à mão (a balança não manda)",
  "antes-da-data":"⛔ antes da data escolhida", "fora-da-faixa":"⛔ valor estranho, ignorado",

async function healthStatus(){
  const H = native.plugin("HealthPlugin");
  if(!native.isNative || !H) return {native:false, available:false, perms:{}};
  try{
    const av = await H.isHealthAvailable();
    /* as básicas numa chamada e o histórico em OUTRA, com catch próprio: se o Health
       Connect do aparelho não conhecer READ_HISTORY, isso não pode zerar a lista toda e
       fazer o app achar que não tem permissão de nada (era o risco que eu criei na 2.1) */
    const c = await H.checkHealthPermissions({permissions:["READ_STEPS","READ_WORKOUTS","READ_WEIGHT","READ_BODY_FAT"]});
    const perms = permMap(c);
    try{
      const h = await H.checkHealthPermissions({permissions:["READ_HISTORY"]});
      Object.assign(perms, permMap(h));
    }catch(e){ perms.READ_HISTORY = null; }
    return {native:true, available:!!(av && av.available), perms};
  }catch(e){ return {native:true, available:false, perms:{}, err:(e&&e.message)||String(e)}; }
}

let _lastAutoSync = 0;
async function autoHealthSync(force){
  if(!native.isNative) return;
  const H = native.plugin("HealthPlugin"); if(!H) return;
  if(!force && Date.now() - _lastAutoSync < 60000) return;    // no máximo 1x por minuto
  try{
    const st = await healthStatus();
    if(!st.available) return;
    // se qualquer permissão já está concedida, importa ao abrir o app
    if(Object.values(st.perms).some(v => v === true)){ _lastAutoSync = Date.now(); importHealth(true); }
  }catch(e){}
}
/* enquanto o app está aberto, confere o Health Connect a cada 3 min (passos do dia) */
setInterval(() => { if(!document.hidden) autoHealthSync(); }, 180000);

/* ===================== ações (alimentação/evolução) ===================== */
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-action], [data-seg]");
  if(!el) return;
  if(el.dataset.seg){ // segmentos (tipo refeição/lanche) dentro de modais
    const grp=el.dataset.seg;
    sheet.querySelectorAll(`[data-seg="${grp}"]`).forEach(b=>b.classList.toggle("on", b===el));
    const hid = grp==="kind"?"ff-kind":grp==="pkind"?"pf-kind":null;
    if(hid) document.getElementById(hid).value = el.dataset.v;
    return;
  }
  const a = el.dataset.action;

  if(a === "tab"){ const t=el.dataset.t; location.hash = t==="treino"?"#/":t==="food"?"#/food":"#/progress"; }

  else if(a === "food-day"){ foodDay = shiftDay(foodDay, +el.dataset.d); render(); }
  else if(a === "add-food"){ foodForm(null); }
  else if(a === "edit-food"){ foodForm(db.food.find(f=>f.id===el.dataset.id)); }
  else if(a === "save-food"){
    const bruto=document.getElementById("ff-name").value;
    const meal=document.getElementById("ff-meal").value.trim()||"Refeição";
    const time=document.getElementById("ff-time").value||nowHM();
    const kind=document.getElementById("ff-kind").value;
    const binge=document.getElementById("ff-binge").checked;
    const planned=!document.getElementById("ff-outside").checked;
    const note=(document.getElementById("ff-note").value||"").trim()||undefined;
    const ts=tsFor(foodDay,time);
    if(el.dataset.id){
      const name=bruto.trim();
      if(!name){ toast("Escreva o alimento."); return; }
      const f=db.food.find(x=>x.id===el.dataset.id); Object.assign(f,{name,meal,ts,kind,binge,planned,note});
      save(); closeModal(); render(); return;
    }
    /* uma linha = um alimento; o resto do formulário vale para todos */
    const nomes=bruto.split("\n").map(s=>s.trim()).filter(Boolean);
    if(!nomes.length){ toast("Escreva ao menos um alimento."); return; }
    /* 1s entre eles só para manter a ordem em que você digitou (o minuto exibido é o mesmo) */
    nomes.forEach((name,i)=>db.food.push({id:uid(), date:foodDay, ts:ts+i*1000, name, meal, kind, binge, planned, note}));
    save(); closeModal(); render();
    toast(nomes.length===1 ? "Alimento adicionado ✓" : `${nomes.length} alimentos adicionados em ${meal} ✓`);
  }
  else if(a === "del-food"){ db.food=db.food.filter(f=>f.id!==el.dataset.id); save(); render(); }
  else if(a === "nutri-pick"){
    nutriBusca = "";
    loadTaco().then(()=>{ if(tacoErr){ toast("Tabela de alimentos indisponível: " + tacoErr); return; } nutriForm(el.dataset.id); });
  }
  else if(a === "nutri-search"){
    nutriBusca = document.getElementById("nu-q").value;
    const id = document.querySelector('[data-action="nutri-manual"]').dataset.id;
    const g = document.getElementById("nu-g");
    const pesoDigitado = g ? g.value : null;      // redesenhar a lista não pode perder o peso
    nutriForm(id);
    const g2 = document.getElementById("nu-g");
    if(g2 && pesoDigitado) g2.value = pesoDigitado;
  }
  else if(a === "nutri-set" || a === "nutri-manual"){
    const f = db.food.find(x=>x.id===el.dataset.id); if(!f) return;
    const key = foodKey(f.name), q = parseQty(f.name);
    const gEl = document.getElementById("nu-g");
    const gramas = gEl ? parseFloat(gEl.value) : null;
    if(q.g == null && !(gramas > 0)){ toast("Diga quanto pesa 1 unidade (em gramas)."); if(gEl) gEl.focus(); return; }
    let entrada;
    if(a === "nutri-set"){ entrada = {t: Number(el.dataset.t)}; }
    else {
      const nv = id => { const v = parseFloat((document.getElementById(id)||{}).value); return isFinite(v) ? v : null; };
      const kcal = nv("nu-kcal");
      if(kcal == null){ toast("Escreva ao menos as kcal por 100 g."); return; }
      entrada = {kcal, p:nv("nu-p")||0, c:nv("nu-c")||0, g100:nv("nu-f")||0,
        nome: aiUltimo ? "🤖 " + aiUltimo + " (estimativa)" : "valor digitado", ia: !!aiUltimo};
    }
    if(q.g == null) entrada.g = gramas;
    db.foodMap = Object.assign({}, db.foodMap, {[key]: entrada});
    save(); closeModal(); render();
    const quantos = db.food.filter(x=>foodKey(x.name)===key).length;
    toast(quantos>1 ? `Aprendido — vale para os ${quantos} registros de "${key}" ✓` : "Nutrição definida ✓");
  }
  else if(a === "save-aikey"){
    const v = (document.getElementById("aikey").value || "").trim();
    if(!v){ toast("Cole a chave do AI Studio."); return; }
    db.settings.aiKey = v; db.settings.aiModel = null; save();
    toast("Testando a chave…");
    aiConnect().then(r => { render(); toast(`Chave ok ✓ usando ${r.modelo}`); })
      .catch(e => { toast(e.message || "Não deu para validar a chave."); render(); });
  }
  else if(a === "clear-aikey"){
    db.settings.aiKey = null; db.settings.aiModel = null; save(); render(); toast("Chave removida");
  }
  else if(a === "ai-nutri"){
    const f = db.food.find(x=>x.id===el.dataset.id); if(!f) return;
    const box = document.getElementById("ai-out");
    const alvo = parseQty(f.name).resto.trim() || f.name;
    if(box) box.innerHTML = `<div class="empty">🤖 Perguntando à IA sobre "${esc(alvo)}"…</div>`;
    aiNutri(alvo).then(d=>{
      /* preenche os campos para VOCÊ conferir antes de salvar — estimativa não entra sozinha */
      aiUltimo = d.alimento;
      const set = (id,v) => { const el2 = document.getElementById(id); if(el2) el2.value = v; };
      set("nu-kcal", d.kcal); set("nu-p", d.p); set("nu-c", d.c); set("nu-f", d.g);
      if(d.gUn > 0){ const g = document.getElementById("nu-g"); if(g && !g.value) g.value = d.gUn; }
      const cor = d.conf === "alta" ? "var(--good)" : d.conf === "media" ? "var(--gold)" : "var(--bad)";
      if(box) box.innerHTML = `<div class="card" style="margin-bottom:10px; border-color:${cor}">
        <div class="t" style="font-weight:800">🤖 ${esc(d.alimento)}</div>
        <div class="sub" style="margin-top:4px">${d.kcal} kcal · P ${fmtNum(d.p)} · C ${fmtNum(d.c)} · G ${fmtNum(d.g)} <span class="sub">(por 100 g)</span></div>
        <div class="sub" style="margin-top:6px; color:${cor}">Confiança <b>${esc(d.conf)}</b> — é <b>estimativa</b>, não medição. Confira e toque em <b>Salvar valores digitados</b>.</div>
        ${d.gUn>0?`<div class="sub" style="margin-top:4px">1 unidade ≈ ${fmtNum(d.gUn)} g</div>`:""}
      </div>`;
    }).catch(e=>{
      if(box) box.innerHTML = `<div class="empty" style="color:var(--bad)">${esc(e.message||"Falhou")}</div>`;
    });
  }
  else if(a === "nutri-clear"){
    const f = db.food.find(x=>x.id===el.dataset.id); if(!f) return;
    const key = foodKey(f.name);
    const m = Object.assign({}, db.foodMap); delete m[key]; db.foodMap = m;
    save(); closeModal(); render(); toast(`Esqueci "${key}"`);
  }
  else if(a === "plan-tick"){
    const m=db.plan.find(x=>x.id===el.dataset.m); if(!m) return;
    const it=m.items.find(x=>x.id===el.dataset.i); if(!it) return;
    it.done=it.done||{};
    const st=itemState(it,foodDay);
    if(st==="open"){ it.done[foodDay]=true; }                              // 1º toque: comi
    else if(st==="done"){ it.done[foodDay]="skip"; toast("Riscado — não vou comer"); }  // 2º toque: risca
    else { delete it.done[foodDay]; }                                       // 3º toque: volta pro aberto
    save(); render();
  }
  else if(a === "plan-all"){
    const m=db.plan.find(x=>x.id===el.dataset.m); if(!m) return;
    const v = el.dataset.v;   // "1" = comi tudo · "skip" = não comi nada · "0" = desfaz
    m.items.forEach(it=>{ it.done=it.done||{};
      if(v === "1") it.done[foodDay]=true;
      else if(v === "skip") it.done[foodDay]="skip";
      else delete it.done[foodDay]; });
    save(); render();
    toast(v === "1" ? `${m.name}: refeição inteira marcada ✓`
      : v === "skip" ? `${m.name}: marcada como não comida ✕`
      : `${m.name}: desmarcada`);
  }
  else if(a === "plan-note"){
    const m=db.plan.find(x=>x.id===el.dataset.m); if(!m) return;
    const v=prompt(`Comentário para a refeição "${m.name}":`, m.note||"");
    if(v===null) return;
    m.note=v.trim()||undefined; save(); render();
  }
  else if(a === "meal-note"){
    const k=mealNoteKey(foodDay, el.dataset.n);
    db.mealNotes = db.mealNotes || {};
    const v=prompt(`Comentário para "${el.dataset.n}" em ${fmtDate(foodDay)}:`, db.mealNotes[k]||"");
    if(v===null) return;
    if(v.trim()) db.mealNotes[k]=v.trim(); else delete db.mealNotes[k];
    save(); render();
  }
  else if(a === "plan-item-note"){
    const m=db.plan.find(x=>x.id===el.dataset.m); if(!m) return;
    const it=m.items.find(x=>x.id===el.dataset.i); if(!it) return;
    const v=prompt(`Comentário para "${it.name}":`, it.note||"");
    if(v===null) return;
    it.note=v.trim()||undefined; save(); render();
  }
  /* risca de uma vez tudo o que ficou em aberto no dia — é o caminho vindo da
     notificação de "preencha o que comeu ontem" */
  else if(a === "skip-rest"){
    const d = el.dataset.d, n = openItemsOf(d);
    if(!n){ toast("Nada em aberto nesse dia."); return; }
    if(!confirm(`Marcar ${n} ite${n===1?"m":"ns"} de ${fmtDate(d)} como NÃO consumido?`)) return;
    plannedForDay(d).forEach(m=>m.items.forEach(it=>{
      if(isFree(m, it, d)) return;
      it.done = it.done || {};
      if(itemState(it, d) === "open") it.done[d] = "skip";
    }));
    save(); render();
    toast(`${n} ite${n===1?"m":"ns"} riscado${n===1?"":"s"} — dia fechado ✓`);
  }
  else if(a === "meal-free"){
    const name = el.dataset.n, k = freeKey(foodDay, name);
    db.free = db.free || {};
    if(db.free[k]){ delete db.free[k]; save(); render(); toast(`${name}: não é mais livre`); return; }
    const w = freeWeek(foodDay);
    if(w.limite && w.n >= w.limite && !confirm(`Você já usou ${w.n} de ${w.limite} refeições livres nesta semana. Marcar assim mesmo?`)) return;
    db.free[k] = true; save(); render();
    toast(`🎉 ${name} marcada como livre`);
  }
  else if(a === "item-free"){
    const m = db.plan.find(x=>x.id===el.dataset.m); if(!m) return;
    const it = m.items.find(x=>x.id===el.dataset.i); if(!it) return;
    if(itemFree(it, foodDay)){ delete it.free[foodDay]; save(); render(); toast("Não é mais livre"); return; }
    const w = freeWeek(foodDay);
    /* só avisa se essa marca vai gastar uma livre NOVA (a refeição ainda não tem nenhuma) */
    const gastaNova = !freeMealsOfDay(foodDay).has(m.name);
    if(gastaNova && w.limite && w.n >= w.limite && !confirm(`Você já usou ${w.n} de ${w.limite} refeições livres nesta semana. Marcar assim mesmo?`)) return;
    it.free = it.free || {}; it.free[foodDay] = true; save(); render();
    toast(`🎉 ${it.name}: livre`);
  }
  else if(a === "food-free"){
    const f = db.food.find(x=>x.id===el.dataset.id); if(!f) return;
    if(f.free){ delete f.free; save(); render(); toast("Não é mais livre"); return; }
    const w = freeWeek(f.date);
    const gastaNova = !freeMealsOfDay(f.date).has(f.meal);
    if(gastaNova && w.limite && w.n >= w.limite && !confirm(`Você já usou ${w.n} de ${w.limite} refeições livres nesta semana. Marcar assim mesmo?`)) return;
    f.free = true; save(); render(); toast(`🎉 ${f.name}: livre`);
  }
  else if(a === "save-freeweek"){
    const v = parseInt(document.getElementById("freeweek").value, 10);
    db.settings.freeWeek = isNaN(v) || v < 0 ? 0 : v; save(); render();
    toast(db.settings.freeWeek ? `${db.settings.freeWeek} refeição(ões) livre(s) por semana` : "Sem limite de refeições livres");
  }
  else if(a === "food-fill"){ foodDay = el.dataset.d; location.hash = "#/food"; render(); }
  else if(a === "diet-dismiss"){
    db.settings.dietDismiss = Object.assign({}, db.settings.dietDismiss, {[el.dataset.d]:true});
    save(false); render();
  }
  else if(a === "add-urge"){ urgeForm(); }
  else if(a === "save-urge"){
    const intensity=+document.getElementById("u-int").value;
    const time=document.getElementById("u-time").value||nowHM();
    const gaveIn=document.getElementById("u-gave").checked;
    db.urges.push({id:uid(), date:foodDay, ts:tsFor(foodDay,time), intensity, gaveIn});
    save(); closeModal(); render();
    if(gaveIn) toast("Registrado. Amanhã é um novo dia 💪"); else toast("Boa — urge registrado, você resistiu! 💪");
  }
  else if(a === "del-urge"){ db.urges=db.urges.filter(u=>u.id!==el.dataset.id); save(); render(); }

  else if(a === "add-plan"){ planForm(null); }
  else if(a === "edit-plan"){ planForm(db.plan.find(m=>m.id===el.dataset.id)); }
  else if(a === "save-plan"){
    const name=document.getElementById("pf-name").value.trim();
    const time=document.getElementById("pf-time").value||"";
    const kind=document.getElementById("pf-kind").value;
    const fixed=document.getElementById("pf-fixed").checked;
    const note=(document.getElementById("pf-note").value||"").trim()||undefined;
    const items=document.getElementById("pf-items").value.split("\n").map(s=>s.trim()).filter(Boolean);
    if(!name){ toast("Dê um nome à refeição."); return; }
    if(el.dataset.id){
      const m=db.plan.find(x=>x.id===el.dataset.id);
      const old={}, oldNote={}; m.items.forEach(it=>{ old[it.name]=it.done||{}; oldNote[it.name]=it.note; });
      m.name=name; m.time=time; m.kind=kind; m.fixed=fixed; m.date=fixed?null:foodDay; m.note=note;
      m.items=items.map(n=>({id:uid(), name:n, done:old[n]||{}, note:oldNote[n]}));
    } else {
      db.plan.push({id:uid(), name, time, kind, fixed, note, created:todayStr(), date:fixed?null:foodDay, items:items.map(n=>({id:uid(), name:n, done:{}}))});
    }
    save(); closeModal(); render();
  }
  else if(a === "del-plan"){ if(!confirm("Excluir esta refeição do plano?")) return; db.plan=db.plan.filter(m=>m.id!==el.dataset.id); save(); render(); }
  else if(a === "copy-plan"){
    const prev=shiftDay(foodDay,-1);
    const src=db.plan.filter(m=>!m.fixed && m.date===prev);
    if(!src.length){ toast("Nada para copiar de ontem."); return; }
    src.forEach(m=>db.plan.push({id:uid(), name:m.name, time:m.time, kind:m.kind, fixed:false, date:foodDay, items:m.items.map(i=>({id:uid(), name:i.name, done:{}}))}));
    save(); render(); toast(`${src.length} refeição(ões) copiada(s) de ontem ✓`);
  }

  else if(a === "health-sync"){ closeModal(); toast("Conectando ao Health Connect…"); importHealth(false); }
  else if(a === "health-diag"){ healthDiagForm(); }
  else if(a === "open-hc"){ const H = native.plugin("HealthPlugin"); if(H){ try{ H.openHealthConnectSettings(); }catch(e){ toast("Não deu para abrir."); } } }
  else if(a === "w-ask"){
    const H = native.plugin("HealthPlugin"); if(!H) return;
    /* pede só o que vem da balança: se o Health Connect não mostrar a tela, é porque a
       permissão foi negada de vez e só dá para religar nas configurações dele */
    const balanca = ["READ_WEIGHT","READ_BODY_FAT","READ_HISTORY"];
    H.requestHealthPermissions({permissions:balanca}).then(async () => {
      const ok = permMap(await H.checkHealthPermissions({permissions:balanca})).READ_WEIGHT;
      db.settings.wDenied = (ok === false); save(false);
      if(ok){ toast("Permissão de peso concedida ✓ importando…"); importHealth(false); }
      else toast("Continua negada — abra o Health Connect e ligue Peso para o Fitness Global.");
    }).catch(e => toast("Não deu para pedir: " + ((e&&e.message)||e)));
  }
  else if(a === "hist-ask"){
    const H = native.plugin("HealthPlugin"); if(!H) return;
    toast("Abrindo o Health Connect…");
    H.requestHealthPermissions({permissions:["READ_HISTORY"]}).then(async () => {
      let ok = null;
      try{ ok = permMap(await H.checkHealthPermissions({permissions:["READ_HISTORY"]})).READ_HISTORY; }catch(e){}
      if(ok === true){ toast("Permissão de histórico concedida ✓ importando…"); importHealth(false); healthDiagForm(); }
      else toast("Não foi concedida. Abra o Health Connect → Fitness Global e procure a opção de dados anteriores.");
    }).catch(e => toast("Este Health Connect não aceitou o pedido: " + ((e&&e.message)||e)));
  }
  /* junta TUDO num texto para ele colar numa mensagem — é o caminho mais rápido para eu
     entender um problema que só acontece no aparelho dele */
  else if(a === "diag-copy"){
    const st = window._diagSt || {perms:{}};
    const lw = db.settings.lastWeights || {}, lbf = db.settings.lastBF || {}, li = db.settings.lastImport || {};
    const L = [];
    L.push(`Fitness Global v${APP_NAME_VERSION} (build ${APP_VERSION})`);
    L.push(`nativo=${st.native} healthConnect=${st.available}${st.err?" erro="+st.err:""}`);
    L.push(`permissoes: passos=${st.perms.READ_STEPS} treinos=${st.perms.READ_WORKOUTS} peso=${st.perms.READ_WEIGHT} gordura=${st.perms.READ_BODY_FAT} historico=${st.perms.READ_HISTORY}`);
    L.push(`metodos: queryWeight=${!!(native.plugin("HealthPlugin")||{}).queryWeight} queryBodyFat=${!!(native.plugin("HealthPlugin")||{}).queryBodyFat}`);
    L.push(`weightFrom=${db.settings.weightFrom} actFrom=${db.settings.actFrom} scaleWins=${db.settings.scaleWins}`);
    L.push(`ultimoErro=${db.settings.lastErr || "-"}`);
    L.push(`PESO: quando=${lw.when?new Date(lw.when).toLocaleString("pt-BR"):"nunca"} lidas=${lw.n} aplicadas=${lw.aplicados} dias=${lw.dias} zerados=${lw.zerados} desde=${lw.zeradosDe} cortou=${lw.cortou} noMethod=${lw.noMethod}`);
    if(lw.fonte) L.push(`PESO fonte=${lw.fonte}`);
    if(lw.erro) L.push(`PESO erro=${lw.erro}`);
    if(lw.erroLargo) L.push(`PESO recusa da janela larga=${lw.erroLargo}`);
    (lw.res||[]).forEach(w=>L.push(`  ${w.d} ${w.kg}kg [${w.src||"-"}] -> ${w.act}${w.antes!=null?" (antes "+w.antes+")":""}`));
    if(!(lw.res||[]).length) L.push("  (nenhuma pesagem registrada no diagnostico)");
    L.push(`GORDURA: lidas=${lbf.n} aplicadas=${lbf.aplicados} zerados=${lbf.zerados} erro=${lbf.erro||"-"} noMethod=${lbf.noMethod}`);
    L.push(`TREINOS: ${li.workouts||0} em ${li.dias||0} dia(s) tipos=${(li.types||[]).join("/")}`);
    L.push(`passos hoje no app=${(()=>{const b=bodyByDate(todayStr())||{}; return typeof b.steps==="number"?b.steps:"-";})()}`);
    L.push(`ultimo peso no app=${(()=>{const s=bodySorted(); return s.length?s[s.length-1].date+" "+s[s.length-1].kg+"kg src="+(s[s.length-1].kgSrc||"-"):"-";})()}`);
    const txt = L.join("\n");
    copyText(txt).then(ok=>{
      if(ok) toast("Diagnóstico copiado — cole na mensagem 📋");
      else { openModal(`<h2>Diagnóstico</h2><textarea rows="16" style="width:100%; font-size:.72rem">${esc(txt)}</textarea>
        <div class="sub" style="margin-top:6px">Não deu para copiar sozinho: selecione o texto acima e copie à mão.</div>`); }
    });
  }
  else if(a === "w-probe"){
    const box = document.getElementById("wprobe"); if(!box) return;
    box.innerHTML = `<div class="empty">Lendo o Health Connect…</div>`;
    weightProbe().then(p=>{
      if(!p.ok){ box.innerHTML = `<div class="empty" style="color:var(--bad)">${esc(p.msg)}</div>`; return; }
      box.innerHTML = (p.cortou ? `<div class="sub" style="margin:8px 0 0; color:var(--gold)">O Health Connect recusou ler 365 dias, então li só os últimos 27. Conceda "Ler histórico além de 30 dias" para ver o resto.</div>` : "")
        + (p.n
        ? `<div class="sub" style="margin:8px 0 4px"><b>${p.n}</b> pesagem(ns) encontradas${p.cortou?" nos últimos 27 dias":" nos últimos 365 dias"}:</div>`
          + p.list.map(w=>`<div class="wkrow"><span class="wd">${fmtDate(w.d)} ${w.hm}</span>
             <span class="wv">${fmtW(w.kg)} kg</span><span class="wdelta" style="color:var(--muted); font-size:.72rem">${esc(w.src||"—")}</span></div>`).join("")
        : `<div class="empty" style="color:var(--bad)">O Health Connect não tem <b>nenhuma</b> pesagem. Então o problema não é o app: nada está gravando peso lá.<br><br>
           Confira em <b>Health Connect → Dados e acesso → Peso → Ver todas as entradas</b>. Se estiver vazio, abra o <b>openScale sync</b>, ligue o Health Connect e faça uma pesagem nova.</div>`);
    });
  }
  else if(a === "cycle-act"){
    const key = el.dataset.k;
    const order = ["musc","cardio","skip"];
    /* o estado ATUAL vem da própria etiqueta (data-cur): calcular de novo a partir da
       chave erra nos casos em que a regra depende do registro (caminhada não iniciada
       por você, por exemplo), e o primeiro toque não fazia nada */
    let curK = el.dataset.cur || (db.settings.actMap||{})[key];
    if(!curK || curK === "ask"){
      curK = actInfo(key.replace(/#auto$/,"")).k;
      if(curK === "ask") curK = key.endsWith("#auto") ? "skip" : "musc";
    }
    const next = order[(order.indexOf(curK) + 1) % order.length] || "musc";
    db.settings.actMap = Object.assign({}, db.settings.actMap, {[key]: next});
    deriveAllActs(); save(); render();
    toast(next === "musc" ? "Passa a contar como musculação 🏋️" : next === "cardio" ? "Passa a contar como cardio 🏃" : "Não vai mais contar");
  }
  else if(a === "act-day"){ const n=+el.dataset.d; const d=shiftDay(actDay,n); if(d<=todayStr()) actDay=d; render(); }
  else if(a === "act-day-set"){ actDay = el.dataset.d; render(); }
  else if(a === "quick-train"){
    const e=bodyEntry(actDay); const k=el.dataset.t;
    e[k+"M"] = !e[k];            // marca manual: a importação do Samsung não apaga mais
    e[k] = !!e[k+"M"];
    deriveActs(e); save(); render();
  }
  else if(a === "save-activity"){
    const e=bodyEntry(actDay);
    const v=parseInt(document.getElementById("steps-today").value,10); e.steps=isNaN(v)?undefined:v;
    const cm=document.getElementById("cardiomin-today");
    if(cm){ const c=parseInt(cm.value,10); e.cardioMinM=isNaN(c)?undefined:c; e.cardioMin=e.cardioMinM; }
    deriveActs(e); save(); render(); toast("Salvo ✓");
  }
  else if(a === "body-entry"){ bodyForm(el.dataset.d || todayStr()); }
  else if(a === "save-body"){
    const date=document.getElementById("bf-date").value || el.dataset.orig;
    const kg=parseFloat(String(document.getElementById("bf-kg").value).replace(",","."));
    const bf=parseFloat(String(document.getElementById("bf-bf").value).replace(",","."));
    const note=document.getElementById("bf-note").value.trim();
    const m={}; MEAS.forEach(x=>{ const v=parseFloat(String(document.getElementById("bf-"+x.k).value).replace(",",".")); if(!isNaN(v)) m[x.k]=v; });
    const musc=document.getElementById("bf-musc").checked, cardio=document.getElementById("bf-cardio").checked;
    const steps=parseInt(document.getElementById("bf-steps").value,10);
    const cardioMin=parseInt(document.getElementById("bf-cardiomin").value,10);
    if(isNaN(kg) && isNaN(bf) && !Object.keys(m).length && !musc && !cardio && isNaN(steps)){ toast("Preencha ao menos o peso."); return; }
    let e=db.body.find(b=>b.date===date);
    if(!e){ e={id:uid(), date}; db.body.push(e); }
    e.kg = isNaN(kg)?undefined:kg; e.bf = isNaN(bf)?undefined:bf; e.m = m; e.note = note;
    if(!isNaN(kg)) e.kgSrc = "manual";          // peso digitado: a importação não sobrescreve
    e.muscM = musc; e.cardioM = cardio; e.cardioMinM = isNaN(cardioMin)?undefined:cardioMin;
    e.musc = musc; e.cardio = cardio; e.steps = isNaN(steps)?undefined:steps; e.cardioMin = isNaN(cardioMin)?undefined:cardioMin;
    deriveActs(e);
    // se mudou a data de um registro existente, remove o antigo
    if(el.dataset.orig && el.dataset.orig!==date){ db.body=db.body.filter(b=>!(b.date===el.dataset.orig && b.id!==e.id)); }
    save(); closeModal(); render();
  }
  else if(a === "del-body"){ if(!confirm("Excluir o registro deste dia?")) return; db.body=db.body.filter(b=>b.date!==el.dataset.d); save(); closeModal(); render(); }

  else if(a === "do-update"){   // só no navegador: recarregar já traz a versão nova
    toast("Atualizando…"); setTimeout(()=>location.reload(), 400);
  }
  /* o link já está baixando (não dá preventDefault aqui) — isto só explica o que fazer */
  else if(a === "upd-tip"){
    setTimeout(()=>toast("Abra a notificação de download e toque no arquivo para instalar por cima — não perde dados."), 600);
  }
  else if(a === "upd-copy"){
    copyText(APK_URL).then(ok => toast(ok ? "Link copiado — cole no Chrome 📋" : APK_URL));
  }
  else if(a === "dismiss-update"){ const s=document.getElementById("updslot"); if(s) s.innerHTML=""; }
});

native.init();
normalizeOrders();
migrateManualActs();
migratePlan12();
migrateWalk19();
if(macrosOn()) loadTaco().then(render);
deriveAllActs();
applyWake();
render();
Sync.start();
checkUpdate();
dndCheck();
autoHealthSync();
document.addEventListener("visibilitychange", () => {
  if(!document.hidden){ checkUpdate(); autoHealthSync(); Sync.check(); dndCheck(); }   // ao voltar pro app, confere a nuvem
});

/* ===================== botão voltar do Android =====================
   Sem isso o botão/gesto de voltar do Samsung fecha o app direto. A ordem é a que a
   pessoa espera: fecha o que estiver por cima primeiro, depois volta uma tela, e só
   sai do app quando já está na tela inicial (perguntando antes). */
(function backButton(){
  const App = native.plugin("App");
  if(!native.isNative || !App || !App.addListener) return;
  App.addListener("backButton", () => {
    if(prBox.classList.contains("on")){ prBox.classList.remove("on"); return; }   // celebração de recorde
    if(modal.classList.contains("on")){ closeModal(); return; }
    const h = location.hash.replace(/^#\/?/, "");
    if(h && h !== "/"){                       // dentro de exercício/academia/aba: sobe um nível
      const p = h.split("/");
      if(p[0] === "ex" && p[1]) location.hash = "#/gym/" + p[1];
      else location.hash = "#/";
      return;
    }
    if(confirm("Sair do Fitness Global?")) App.exitApp();
  });
})();

/* ===================== Não Perturbe =====================
   No Não Perturbe o Android silencia a notificação do descanso: a vibração ainda vai,
   mas o som não toca. Melhor avisar do que ele achar que o app quebrou. */
let dndState = null;
async function dndCheck(){
  const RC = native.plugin("RestChannel");
  if(!native.isNative || !RC || !RC.dnd) return null;
  try{
    const r = await RC.dnd();
    const antes = dndState && dndState.on;
    dndState = r;
    if(r.known && r.on !== antes) render();
    return r;
  }catch(e){ return null; }
}
function dndWarnHtml(){
  if(!dndState || !dndState.known || !dndState.on || !db.settings.sound) return "";
  return `<div class="updbanner" style="margin-bottom:10px">
    <span style="font-size:1.2rem">🔕</span>
    <div class="grow"><b>Celular no Não Perturbe</b>
      <div class="sub">${dndState.silent ? "Nada passa: o aviso de descanso não vai tocar nem notificar." : "O som do aviso de descanso não vai tocar — a vibração continua."}</div></div>
    <button class="btn ghost sm" style="width:auto" data-action="dnd-recheck">Já desliguei</button></div>`;
}
</script>
