/* ===================== busca inteligente de exercícios =====================
   Camada 1 (local, instantânea, sem internet): ignora acento e maiúscula, tolera erro de
   digitação, entende português e inglês (peck deck = voador, row = remada...) e grupos
   ("perna", "braço"). Camada 2 (IA, só se você pedir e houver chave): o Gemini recebe SÓ o
   que você digitou e os nomes dos exercícios, nunca cargas nem datas. */
const SIN_BUSCA = [
  ["peck deck","pec deck","voador","crucifixo maquina","butterfly","fly maquina"],
  ["remada","row","rowing","serrote"],["rosca","curl"],
  ["supino","bench press","chest press","press peito"],
  ["desenvolvimento","shoulder press","overhead press","militar"],
  ["agachamento","squat","leg press","hack"],["puxada","pulldown","pull down","lat pulldown","barra fixa","pull up"],
  ["flexora","leg curl","hamstring curl","stiff","romeno"],["extensora","leg extension"],
  ["panturrilha","calf","gemeos"],["triceps","tricep","pushdown","frances","testa"],["biceps","bicep"],
  ["elevacao lateral","lateral raise"],["abdominal","abdomen","crunch","prancha","plank"],
  ["gluteo","glute","hip thrust","pelvica","coice","kickback"],
  ["halter","dumbbell","halteres"],["barra","barbell"],["polia","cabo","cable","crossover","pulley"],["maquina","machine"],
  ["costas","dorsal","lats","dorsais"],["peito","peitoral","chest"],["ombro","ombros","deltoide","shoulder","delt"],
  ["antebraco","forearm","punho","wrist"],
  /* grupos grandes: uma palavra que vira vários grupos */
  ["perna","pernas","legs","inferior","coxa","coxas"],["braco","bracos","arms"],
  ["empurrar","push"],["puxar","pull"],["superior","upper"]
];
const GRUPO_AMPLO = {
  perna:["quadriceps","posterior","gluteo","panturrilha"], pernas:["quadriceps","posterior","gluteo","panturrilha"],
  legs:["quadriceps","posterior","gluteo","panturrilha"], inferior:["quadriceps","posterior","gluteo","panturrilha"],
  coxa:["quadriceps","posterior"], coxas:["quadriceps","posterior"],
  braco:["biceps","triceps","antebraco"], bracos:["biceps","triceps","antebraco"], arms:["biceps","triceps","antebraco"],
  empurrar:["peito","ombro","triceps"], push:["peito","ombro","triceps"],
  puxar:["costas","biceps","antebraco"], pull:["costas","biceps","antebraco"],
  superior:["peito","costas","ombro","biceps","triceps"], upper:["peito","costas","ombro","biceps","triceps"]
};
function levBusca(a, b){
  if(Math.abs(a.length - b.length) > 2) return 9;
  const d = []; for(let i = 0; i <= a.length; i++){ d[i] = [i]; }
  for(let j = 1; j <= b.length; j++) d[0][j] = j;
  for(let i = 1; i <= a.length; i++) for(let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
function alternativasBusca(t){
  const alt = new Set([t]);
  SIN_BUSCA.forEach(g => { if(g.some(x => x === t || (t.length >= 3 && x.startsWith(t)))) g.forEach(x => alt.add(x)); });
  (GRUPO_AMPLO[t] || []).forEach(x => alt.add(x));
  return [...alt];
}
function textoBusca(e){ return norm([exName(e), e.name, e.namePt, e.nameEn, grpOf(e)].filter(Boolean).join(" ")); }
function casaBusca(e, qn){
  if(!qn) return true;
  const hay = textoBusca(e), palavras = hay.split(" ").filter(Boolean);
  return qn.split(" ").filter(Boolean).every(t => alternativasBusca(t).some(a => {
    if(hay.includes(a)) return true;
    if(a.length < 4) return false;
    const tol = a.length >= 7 ? 2 : 1;
    return palavras.some(w => levBusca(w, a) <= tol || (w.length > a.length && levBusca(w.slice(0, a.length), a) <= 1));
  }));
}

async function buscaIa(q){
  const lista = db.exercises.slice(0, 500).map(e => `${e.id}|${exName(e)}|${grpOf(e) || "?"}`).join("\n");
  const model = db.settings.aiModel || (await aiConnect()).modelo;

    method:"POST",

      generationConfig:{temperature:0, responseMimeType:"application/json",
        responseSchema:{type:"OBJECT", properties:{ids:{type:"ARRAY", items:{type:"STRING"}}}, required:["ids"]}}
    })
  });
  const parts = (((j.candidates||[])[0]||{}).content||{}).parts;

/* quem aparece: casa localmente OU foi apontado pela IA para esta mesma busca */
function visivelBusca(e, q){
  const qn = norm(q);
  if(!qn) return true;
  if(casaBusca(e, qn)) return true;
  const ia = buscaIaCache()[qn];
  return !!(ia && ia.includes(e.id));
}
/* caixinha abaixo da busca: oferece a IA quando o local não achou nada */
function buscaCaixa(q, quantos){
  const box = document.getElementById("ai-busca"); if(!box) return;
  const qn = norm(q);
  if(!qn || qn.length < 3){ box.innerHTML = ""; return; }
  const ia = buscaIaCache()[qn];
  if(ia && ia.length && quantos){ box.innerHTML = `<div class="sub" style="margin:-4px 0 10px">✨ Resultado com IA para “${esc(q)}”</div>`; return; }
  if(quantos){ box.innerHTML = ""; return; }
  if(buscaIaBusy){ box.innerHTML = `<div class="sub" style="margin:4px 0 10px">Pensando…</div>`; return; }
  if(buscaIaErro){ box.innerHTML = `<div class="sub" style="margin:4px 0 10px">${esc(buscaIaErro)}</div>`; return; }

    ? `<button class="btn ghost sm" data-action="busca-ia" style="margin:4px 0 10px">✨ Nada achado. Buscar com IA</button>`
    : `<div class="sub" style="margin:4px 0 10px">Nada achado. Para a busca com IA, ponha a chave do Gemini em Ajustes.</div>`;
}

      <button class="pill${gymRoutine?"":" on"}" data-action="rt-sel" data-v="" style="cursor:pointer">Todos (${gymExercises(g.id).length})</button>
      ${rts.map(r=>`<button class="pill${gymRoutine===r.id?" on":""}" data-action="rt-sel" data-v="${r.id}" style="cursor:pointer">${esc(r.name)} (${routineExercises(r,g.id).length})</button>`).join("")}
    </div>`}
    ${reorderMode ? "" : `<div class="sbox" style="margin-bottom:10px"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg><input id="gq" type="search" inputmode="search" placeholder="Buscar: nome, grupo, “perna”, “peck deck”…" value="${esc(gymQuery)}" autocomplete="off" aria-label="Buscar exercício"></div><div id="ai-busca"></div>`}
    ${reorderMode ? "" : focusBarHtml(g, rid)}
    ${(() => { if(reorderMode) return "";
      /* quantos ainda estão em aberto: é o que o botão de encerrar vai riscar de uma vez */
      const falta = exs.filter(e => { const st2 = exStateToday(e, rid); return st2 === "todo" || st2 === "doing"; }).length;
      const feitos = exs.filter(e => exStateToday(e, rid) === "done").length;
      if(!falta || !feitos) return "";
      return `<button class="btn ghost sm" data-action="skip-rest-ex" data-gym="${g.id}" data-rt="${rid}" style="margin-bottom:10px">
        🏁 Encerrar o treino — não vou fazer os ${falta} que faltam</button>`;
    })()}
    ${(!reorderMode && exs.some(e=>e.photo && e.photo.slice(0,5) !== "data:")) ? `<button class="btn ghost sm" data-action="dl-photos" data-gym="${g.id}" data-rt="${rid}" style="margin-bottom:10px">📥 Salvar as fotos no app (funcionar sem internet)</button>` : ""}
    <div class="section"><h2>${rAtiva ? esc(rAtiva.name) : "Exercícios"}${rAtiva&&rAtiva.src?` <span class="pill">por ${esc(rAtiva.src)}</span>`:""}${rAtiva?` <button class="xbtn" data-action="rt-menu" data-id="${rAtiva.id}" aria-label="Opções do treino" style="vertical-align:middle"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>`:""}</h2>
      <div id="gq-vazio" class="empty" style="display:none">Nenhum exercício com esse nome.</div>
      ${itemsHtml || `<div class="empty">${rAtiva
        ? "Este treino ainda não tem exercício.<br>Toque em <b>Escolher exercícios</b> abaixo."
        : "Nenhum exercício nesta academia ainda."}</div>`}
      ${reorderMode
        ? `<p class="sub" style="margin-top:8px">Use ↑ ↓ para mudar a ordem${rAtiva?" dentro deste treino":""}. Toque em ✓ quando terminar.</p>`
        : rAtiva
          ? `<button class="btn" data-action="rt-pick" data-id="${rAtiva.id}" data-gym="${g.id}">☑ Escolher exercícios do ${esc(rAtiva.name)}</button>
             ${canReorder ? `<button class="btn ghost sm" data-action="reorder-on" style="margin-top:8px">⇅ Reordenar neste treino</button>` : ""}`
          : `<button class="btn" data-action="add-ex" data-gym="${g.id}">＋ Adicionar exercício</button>
             ${canReorder ? `<button class="btn ghost sm" data-action="reorder-on" style="margin-top:8px">⇅ Reordenar exercícios</button>` : ""}`}
    </div>`;
}

/* ---- tela do exercício ---- */
let exUI = {metric:"forca"};

function exGoalHtml(e, tlog){
  const t = nextTarget(e);
  const meta = e.reps ? `${e.targetSets} × ${esc(e.reps)}` : "";
  if(t.falta === "reps") return `<div class="goalx"><div class="gk">Meta de hoje</div>
    <div class="gh">Defina a faixa de reps (ex.: 8–12) para o app sugerir a progressão.</div>
    <button class="pill" data-action="edit-ex" data-gym="${esc(route().gymId)}" data-id="${e.id}" style="cursor:pointer; color:var(--accent); border-color:var(--accent)">Definir a faixa</button></div>`;
  if(t.falta === "historico") return `<div class="goalx"><div class="gk">Meta de hoje${meta ? " · " + meta : ""}</div>
    <div class="gh">Primeira vez: escolha um peso que você feche <b>${t.range.min} reps</b> com folga e vá subindo até <b>${t.range.max}</b>.</div></div>`;
  const serie = n => n+"ª";
  let big, sub, hint;
  if(t.tipo === "subir"){
    big = t.peso != null ? `${fmtW(t.peso)}<small>kg</small>` : `Subir<small>a carga</small>`;
    sub = `fechou ${t.ultima.join(" · ")} com ${fmtW(t.de)} kg`;
    hint = t.peso != null ? `Recomeça no piso: ${Array(t.sets).fill(t.metaReps).join(" · ")} reps com a carga nova.`
                          : `Use o próximo pino/anilha. Da próxima vez o app sugere o valor.`;
  } else {
    big = `${fmtW(t.peso)}<small>kg</small>`;
    sub = `última vez ${t.ultima.length ? t.ultima.join(" · ") : "—"}`;
    const f = t.faltas || [];
    hint = f.length ? `Para subir a carga: ${listaPt(f.map(x => `<b>${x.falta}</b> rep${x.falta>1?"s":""} na ${serie(x.serie)}`))}.`
                    : `Feche ${t.sets} séries de ${t.range.max} para subir a carga.`;
  }
  const dpH = tlog ? dpState(e, tlog) : null;
  const hoje = dpH ? `<div class="gh" style="margin-top:6px">Hoje: ${dpH.reps.join(" · ")} — ${dpH.fechou ? "fechou a faixa ✓" : dpH.seriesFaltando ? `faltam ${dpH.seriesFaltando} série${dpH.seriesFaltando>1?"s":""} e ${dpH.faltam} rep${dpH.faltam===1?"":"s"}` : `faltam ${dpH.faltam} rep${dpH.faltam===1?"":"s"}`}</div>` : "";
  return `<div class="goalx"><div class="gk">Meta de hoje${meta ? " · " + meta : ""}</div>
    <div class="gn">${big}</div><div class="gs2">${sub}</div><div class="gh">${hint}</div>${hoje}</div>`;
}
function renderEx(g, e){
  const tlog = todayLog(e.id);
  const done = tlog ? tlog.sets : [];
  const prev = exLogs(e.id).filter(l => l.date !== todayStr()).pop();
  const puladas = skipSetsN(e.id);
  const totalRows = Math.max(e.targetSets, done.length + puladas) + pendingExtra;
  const alvoHoje = nextTarget(e);
  const gAtual = e.gymId || g.id;
  const prim = primeiraNaUnidade(e, gAtual);

  let rows = "";
  for(let i = 0; i < totalRows; i++){
    if(i < done.length){
      const s = done[i];
      rows += `<div class="setrow done">
        <div class="num feito" title="Série ${i+1} registrada" aria-label="Série ${i+1} registrada"><svg class="ico" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></div>
        <input class="val" type="number" inputmode="decimal" step="any" min="0" value="${s.weight}" data-edit="w" data-ex="${e.id}" data-i="${i}" aria-label="Editar peso da série ${i+1}">
        <input class="val" type="number" inputmode="numeric" step="1" min="1" value="${s.reps}" data-edit="r" data-ex="${e.id}" data-i="${i}" aria-label="Editar repetições da série ${i+1}">
        <button class="ok del" data-action="del-set" data-ex="${e.id}" data-i="${i}" aria-label="Apagar série ${i+1}" title="Apagar esta série"><svg class="ico" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg></button>
      </div>`;
    } else if(i < done.length + puladas){
      rows += `<div class="setrow skipd">
        <div class="num">${i+1}</div>
        <div class="skiptxt">Série pulada</div>
        <button class="ok" data-action="unskip-set" data-ex="${e.id}" aria-label="Voltar a fazer esta série" title="Voltar a fazer esta série"><svg class="ico" viewBox="0 0 24 24"><path d="M9 7L4 12l5 5M4 12h11a5 5 0 010 10h-3"/></svg></button>
      </div>`;
    } else {
      /* A série pendente vem com o que você FEZ da última vez NESTA MESMA POSIÇÃO — é a
         marca a bater. Antes vinha a meta já preenchida, então bastava tocar em ✓ para
         registrar um número que você não fez.
         Exceção: quando fechou a faixa toda, a carga sobe e o ciclo recomeça no piso
         (8 nas três), que é a sua regra de progressão dupla. */
      const refPos = (prev && prev.sets[i]) || null;                 // mesma posição de série
      const ref = refPos || (prev && prev.sets[prev.sets.length-1]) || done[done.length-1] || null;
      let pw = ref ? String(ref.weight) : "", pr = ref ? String(ref.reps) : "";
      let dica = "";
      if(alvoHoje && alvoHoje.tipo === "subir"){
        /* fechou a faixa: recomeça no piso com a carga maior. Quando o app ainda não
           sabe o degrau da máquina, o peso fica o antigo para você trocar na mão — mas
           as reps já vão para o piso, que é o que muda no ciclo. */
        pr = String(alvoHoje.metaReps);
        pw = alvoHoje.peso != null ? String(alvoHoje.peso) : pw;
        dica = alvoHoje.peso != null
          ? `fechou ${fmtW(alvoHoje.de)} × ${refPos ? refPos.reps : alvoHoje.range.max} → <span class="meta">carga nova ${fmtW(alvoHoje.peso)} kg, meta ${alvoHoje.metaReps}</span>`
          : `fechou ${fmtW(alvoHoje.de)} × ${refPos ? refPos.reps : alvoHoje.range.max} → <span class="meta">suba o pino e faça ${alvoHoje.metaReps}</span>`;
      } else if(alvoHoje && alvoHoje.tipo === "manter"){
        pw = String(alvoHoje.peso);
        if(refPos){
          pr = String(refPos.reps);
          const falta = Math.max(0, alvoHoje.range.max - refPos.reps);
          dica = `última: <b>${fmtW(refPos.weight)} × ${refPos.reps}</b> → <span class="meta">meta ${alvoHoje.range.max}${falta ? ` (falta ${falta})` : " ✓"}</span>`;
        } else {
          pr = String(alvoHoje.range.min);
          dica = `série nova → <span class="meta">meta ${alvoHoje.range.max}</span>`;
        }
      } else if(refPos){
        dica = `última: <b>${fmtW(refPos.weight)} × ${refPos.reps}</b>`;
      }
      if(done.length) pw = String(done[done.length-1].weight);       // já começou: segue o peso do dia
      /* peso do corpo: o kg vem do seu último peso registrado (dá para escrever por cima) */
      if(e.bw && !done.length){ const b = lastBodyWeight(); if(b) pw = String(b.kg); }
      else if(e.bw && done.length) pw = String(done[done.length-1].weight);
      const eAtual = i === done.length + puladas;
      rows += `<div class="setrow${eAtual ? " cur" : ""}">
        <div class="num">${i+1}</div>
        <input type="number" inputmode="decimal" step="any" min="0" id="w${i}" value="${pw}" placeholder="kg" aria-label="Peso da série ${i+1}">
        <input type="number" inputmode="numeric" step="1" min="1" id="r${i}" value="${pr}" placeholder="reps" aria-label="Repetições da série ${i+1}">
        <button class="ok" data-action="log-set" data-ex="${e.id}" data-i="${i}" aria-label="Confirmar série ${i+1}"><svg class="ico" viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></button>
      </div>${(dica || eAtual) ? `<div class="setlast">${dica}${eAtual ? `${dica ? " · " : ""}<button type="button" class="linkbtn" data-action="skip-set" data-ex="${e.id}">pular esta série</button>` : ""}</div>` : ""}`;
    }
  }

  const logs = exLogs(e.id);
  const rec = records(e.id);
  const prDates = new Set();
  /* mesma margem de 1% do detectPR, senão o histórico fica coalhado de "recorde" */
  if(logs.length){ let m = 0; logs.forEach(l => { const v = bestE1rmOfSets(l.sets); if(v > m * 1.01){ m = Math.max(m, v); prDates.add(l.date); } else if(v > m) m = v; }); }

  const temUnidades = gymUnits(e.gymId || g.id).length > 1;
  const histLinha = (l, pill) => `
    <div class="hist" data-action="hist-edit" data-id="${l.id}" style="cursor:pointer" title="Toque para corrigir ou apagar"><div class="d">${fmtDate(l.date)}${pill || ""}${
      prDates.has(l.date) ? ' <span class="pill pr">🏆 recorde</span>' : ""}</div>
    <div class="s">${l.sets.map(s => `${fmtW(s.weight)} kg × ${s.reps}`).join("&ensp;·&ensp;")}</div></div>`;
  let hist;
  if(temUnidades && exPerUnit(e)){
    /* a unidade onde você está vem primeiro e aberta; as outras ficam recolhidas e com o nome */
    const uAt = unitNow(gAtual);
    const dessa = logs.filter(l => l.u === uAt), semU = logs.filter(l => !l.u);
    const blocoUn = (titulo, lista, aberto) => lista.length ? `<details class="evo hunit"${aberto ? " open" : ""}><summary>${titulo} · ${lista.length} sessão${lista.length>1?"ões":""}</summary>${lista.slice(-40).reverse().map(histLinha).join("")}</details>` : "";
    const outras = gymUnits(gAtual).filter(u => u.id !== uAt).map(u => blocoUn("📍 " + esc(u.name), logs.filter(l => l.u === u.id), false)).join("");
    hist = (dessa.length ? blocoUn("📍 " + esc(unitName(gAtual, uAt)) + " (aqui)", dessa, true) : `<div class="empty">Nenhuma sessão em ${esc(unitName(gAtual, uAt))} ainda.</div>`)
      + outras + blocoUn("Sem unidade registrada", semU, false);
  } else {
    hist = logs.slice(-40).reverse().map(l => histLinha(l, temUnidades && l.u ? ` <span class="pill" style="font-weight:600">📍 ${esc(unitName(gAtual, l.u))}</span>` : "")).join("");
  }

  view.innerHTML = `
    <div class="topbar">
      <button class="iconbtn" data-action="go" data-h="#/gym/${g.id}" aria-label="Voltar"><svg class="ico" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
      <h1>${esc(exName(e))}</h1>
      <button class="iconbtn" data-action="ex-menu" data-gym="${g.id}" data-id="${e.id}" aria-label="Editar / opções"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
    </div>
    ${temUnidades ? unitBarHtml(gymById(e.gymId || g.id) || g) : ""}
    ${temUnidades ? unitStripHtml(gAtual) : ""}
    ${prim ? `<div class="firstun" role="status"><b>Primeira vez em ${esc(unitName(gAtual, prim.u))}.</b>
      ${prim.ult.u ? `Em ${esc(unitName(gAtual, prim.ult.u))} você` : "Antes você"} fez ${prim.ult.sets.map(x => fmtW(x.weight) + " kg × " + x.reps).join(" · ")}.
      Confira se a unidade está certa antes de registrar.</div>` : ""}
    <div class="exline">
      <b style="${done.length>=e.targetSets?"color:var(--good)":done.length?"color:var(--gold)":""}">${done.length}/${e.targetSets} séries</b>${puladas ? `<span>· ${puladas} pulada${puladas>1?"s":""}</span>` : ""}
      ${e.reps ? `<span>· meta ${esc(e.reps)} reps</span>` : ""}<span>· descanso ${e.restSec}s</span>
      ${typeof e.step === "number" && e.step>0 ? `<span>· +${fmtW(e.step)} kg</span>` : ""}
      ${e.bw ? `<span>· 🧍 peso do corpo</span>` : ""}${e.gymId === null ? `<span>· 🌐 todas as academias</span>` : ""}
      ${e.reps ? "" : `<button class="pill" data-action="edit-ex" data-gym="${g.id}" data-id="${e.id}" style="cursor:pointer; color:var(--gold); border-color:var(--gold)" title="Sem faixa de reps o app não consegue sugerir a progressão">⚠️ defina a faixa de reps</button>`}
    </div>

    ${simBannerHtml()}
    ${e.photo ? `<img class="exphoto" src="${esc(e.photo)}" alt="Foto do exercício ${esc(exName(e))}" loading="lazy" onerror="this.style.display='none'">` : ""}
    ${e.notes ? `<div class="card notecard">📝 ${esc(e.notes)}</div>` : ""}

    <div class="section"><h2>Treino de hoje · ${fmtDate(todayStr())}</h2>
      ${exGoalHtml(e, tlog)}
      <div class="card">
        <div class="sethead"><span>#</span><span>kg</span><span>reps</span><span></span></div>
        ${rows}
        <div class="btnrow" style="margin-top:10px">
          <button class="btn ghost sm" data-action="extra-set">＋ Série extra</button>
          <button class="btn ghost sm" data-action="start-rest" data-ex="${e.id}" data-sec="${e.restSec}" data-name="${esc(exName(e))} — ${done.length >= e.targetSets ? "série extra" : `agora a série ${done.length+1}/${e.targetSets}`}"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"/><path d="M12 9v4l2.5 1.5M9 3h6"/></svg> Descanso</button>
        </div>
      </div>
    </div>

    <details class="evo">
      <summary>📊 Evolução e histórico</summary>
      <div class="section"><h2>Estou evoluindo?</h2>
        <div class="card" id="progcard"></div>
      </div>
      <div class="section"><h2>Histórico</h2>
        <div class="card">${hist || '<div class="empty">Nenhuma sessão registrada ainda.</div>'}</div>
      </div>
    </details>`;

  renderProg(e, rec);
}

const pctCls = v => v > 0.5 ? "up" : v < -0.5 ? "down" : "";
const pctTxt = v => (v > 0 ? "+" : "") + fmtNum(v) + "%";
function renderProg(e, rec){
  const card = document.getElementById("progcard");
  const t = loadTrend(e.id);
  if(!t){
    card.innerHTML = `<div class="empty">Registre pelo menos <b>2 dias de treino</b> deste exercício para ver se você está evoluindo.</div>`;
    return;
  }
  const sbs = setBySet(e.id);
  const metricHints = {
    forca: "Carga da sessão = média do 1RM estimado de TODAS as séries de trabalho do dia (as do peso mais alto). Aquecimento leve fica de fora; a série do fim conta igual às outras — é ela que trava a subida de carga. 1RM estimado pela fórmula de Epley: peso × (1 + reps/30).",
    peso: "Maior peso que você já colocou no exercício, sessão a sessão.",
    volume: "Volume = soma de (peso × reps) da sessão. Mede o total de trabalho do dia."
  };
  /* comparação série a série: só faz sentido se as duas sessões tiverem séries alinhadas */
  const sbsHtml = (sbs && sbs.rows.length) ? `
    <div class="sub" style="margin-top:14px">Série a série, contra a última vez (${fmtDate(sbs.prev.date)}${sbs.dias>=1?` · ${Math.round(sbs.dias)} dia${sbs.dias>=2?"s":""} atrás`:""}):</div>
    <div class="tblwrap" style="margin-top:6px"><table class="xls">
      <thead><tr><th>Série</th><th>${fmtDate(sbs.prev.date)}</th><th>${fmtDate(sbs.cur.date)}</th><th class="avg">Δ</th></tr></thead>
      <tbody>${sbs.rows.map(r => `<tr><th>${r.i}ª</th>
        <td>${fmtW(r.a.weight)}×${r.a.reps}</td>
        <td>${fmtW(r.b.weight)}×${r.b.reps}</td>
        <td class="dl ${r.pct==null?"":pctCls(r.pct)}">${r.pct==null?"–":pctTxt(r.pct)}</td></tr>`).join("")}
        ${sbs.media!=null?`<tr><th class="tot">Média</th><td class="tot"></td><td class="tot"></td>
          <td class="dl tot ${pctCls(sbs.media)}">${pctTxt(sbs.media)}</td></tr>`:""}
      </tbody></table></div>
    ${sbs.maisCur||sbs.maisPrev ? `<div class="sub" style="margin-top:6px; font-size:.74rem">${sbs.maisCur?`Você fez ${sbs.maisCur} série(s) a mais agora`:`Você fez ${sbs.maisPrev} série(s) a menos agora`} — essas ficam de fora da comparação, porque não têm par.</div>` : ""}`
    : "";
  card.innerHTML = `
    <div class="statushead">
      <span class="em">${TREND[t.dir].em}</span>
      <div><div class="t ${t.dir}">${TREND[t.dir].t}</div>
      <div class="sub">${(t.kgSem>0?"+":"")+fmtNum(t.kgSem)} kg por semana · ${pctTxt(t.pctMes)} por mês
        <br>reta traçada em ${t.n} sessões${t.span>=1?` de ${Math.round(t.span)} dias`:""} · ${t.poucas?"ainda são poucas sessões para cravar":t.firme?`evolução firme (consistência ${Math.round(t.r2*100)}%)`:`bem irregular (consistência ${Math.round(t.r2*100)}%)`}</div></div>
    </div>
    <div class="row" style="margin-top:10px; gap:16px; flex-wrap:wrap">
      <div><div class="sub">Carga da sessão</div><div class="bignum">${fmtNum(t.atual)} <small>kg</small></div></div>
      ${(() => { const bs = bestSession(e.id, null);
        return bs.v ? `<div><div class="sub">🏆 Melhor sessão</div><div class="bignum">${fmtNum(bs.v)} <small>kg · ${fmtDate(bs.d)}</small></div></div>` : ""; })()}
      ${rec ? `<div><div class="sub">Melhor série</div><div class="bignum" style="font-size:1.1rem">${fmtNum(rec.rm.v)} <small>kg · ${fmtDate(rec.rm.d)}</small></div></div>` : ""}
    </div>
    ${sbsHtml}
    <div class="seg" role="tablist" style="margin-top:14px">
      <button data-action="metric" data-m="forca" class="${exUI.metric==="forca"?"on":""}">Carga</button>
      <button data-action="metric" data-m="peso" class="${exUI.metric==="peso"?"on":""}">Peso máx</button>
      <button data-action="metric" data-m="volume" class="${exUI.metric==="volume"?"on":""}">Volume</button>
    </div>
    <div class="chartwrap" id="chartwrap"></div>
    <p class="metrichint">${metricHints[exUI.metric]}</p>`;
  drawChart(e);
}

/* ---- gráfico ---- */
function metricPoints(e){
  const pts = [];
  logsOf(e.id).forEach(l => {
    let v;
    if(exUI.metric === "forca") v = sessionLoad(l.sets);
    else if(exUI.metric === "peso") v = Math.max(...l.sets.map(s => s.weight));
    else v = l.sets.reduce((a,s) => a + s.weight*s.reps, 0);
    pts.push({d:l.date, v});
  });
  return pts;
}
function drawChart(e){
  const wrap = document.getElementById("chartwrap");
  if(!wrap) return;
  const pts = metricPoints(e);
  if(pts.length < 2){ wrap.innerHTML = ""; return; }
  // marcar recordes (novo máximo até então) para a métrica atual
  const prIdx = new Set(); let mx = -Infinity;
  pts.forEach((p,i) => { if(p.v > mx + 0.01){ mx = p.v; if(i>0) prIdx.add(i); } });

  const W = 360, H = 200, L = 42, R = 16, T = 16, B = 26;
  let min = Math.min(...pts.map(p => p.v)), max = Math.max(...pts.map(p => p.v));
  if(min === max){ min -= 1; max += 1; }
  const pad = (max - min) * 0.14; min -= pad; max += pad; if(min < 0) min = 0;
  const X = i => L + (W - L - R) * (i/(pts.length-1));
  const Y = v => T + (H - T - B) * (1 - (v - min)/(max - min));
  let grid = "";
  for(let k = 0; k <= 3; k++){
    const v = min + (max - min) * k/3, y = Y(v);
    grid += `<line class="gridline" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/>
      <text class="axislbl" x="${L-6}" y="${y+3}" text-anchor="end">${fmtNum(v)}</text>`;
  }
  const line = pts.map((p,i) => (i?"L":"M") + X(i).toFixed(1) + " " + Y(p.v).toFixed(1)).join(" ");
  const areaD = `M${X(0).toFixed(1)} ${(H-B).toFixed(1)} ` + pts.map((p,i) => "L"+X(i).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ") + ` L${X(pts.length-1).toFixed(1)} ${(H-B).toFixed(1)} Z`;
  let dots = "";
  pts.forEach((p,i) => {
    const last = i === pts.length-1;
    if(prIdx.has(i) && !last){
      dots += star(X(i), Y(p.v));
    } else {
      dots += `<circle class="dot${last?" last":""}" cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${last?4.5:3}"/>`;
    }
    if(last){
      const lx = Math.min(Math.max(X(i), L+16), W - R - 16);
      dots += `<text class="lastlbl" x="${lx}" y="${Math.max(Y(p.v)-9, 11)}" text-anchor="middle">${fmtNum(p.v)}</text>`;
    }
  });
  wrap.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução do exercício">
      <defs><linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--line)" stop-opacity="0.22"/>
        <stop offset="1" stop-color="var(--line)" stop-opacity="0"/></linearGradient></defs>
      ${grid}
      <text class="axislbl" x="${L}" y="${H-8}">${fmtDate(pts[0].d)}</text>
      <text class="axislbl" x="${W-R}" y="${H-8}" text-anchor="end">${fmtDate(pts[pts.length-1].d)}</text>
      <path class="area" d="${areaD}"/><path class="serie" d="${line}"/>${dots}
    </svg><div id="tip"></div>`;
  const svg = wrap.querySelector("svg"), tip = wrap.querySelector("#tip");
  svg.addEventListener("pointermove", ev => {
    const rect = svg.getBoundingClientRect();
    const x = (ev.clientX - rect.left) / rect.width * W;
    let bi = 0, bd = Infinity;
    pts.forEach((p,i) => { const d = Math.abs(X(i) - x); if(d < bd){ bd = d; bi = i; } });
    const p = pts[bi];
    tip.textContent = fmtDate(p.d) + " · " + fmtNum(p.v) + " kg" + (prIdx.has(bi) ? " 🏆" : "");
    tip.style.display = "block";
    const px = X(bi)/W * rect.width;
    tip.style.left = Math.min(Math.max(px - 46, 0), rect.width - 120) + "px";
    tip.style.top = (Y(p.v)/H * rect.height - 38) + "px";
  });
  svg.addEventListener("pointerleave", () => { tip.style.display = "none"; });
}
function star(cx, cy){
  const pts = []; const R = 5, r = 2.1;
  for(let i = 0; i < 10; i++){
    const ang = -Math.PI/2 + i*Math.PI/5, rad = i%2 ? r : R;
    pts.push((cx + rad*Math.cos(ang)).toFixed(1) + "," + (cy + rad*Math.sin(ang)).toFixed(1));
  }
  return `<polygon class="star" points="${pts.join(" ")}"/>`;
}

/* Ajustes: cada seção vira uma linha que abre e fecha. O que estava aberto continua aberto
   quando a tela se redesenha (ligar um interruptor, por exemplo). */
let setOpen = {};
function collapseSettings(){
  [...document.querySelectorAll("#view > .section")].forEach(sec => {
    const h = sec.querySelector(":scope > h2"); if(!h) return;
    const titulo = h.textContent.trim();
    const d = document.createElement("details");
    d.className = "evo setsec"; d.open = !!setOpen[titulo];
    const sm = document.createElement("summary"); sm.textContent = titulo;
    h.remove();
    d.appendChild(sm);
    while(sec.firstChild) d.appendChild(sec.firstChild);
    d.addEventListener("toggle", () => { setOpen[titulo] = d.open; });
    sec.appendChild(d);
  });
}

/* ===================== CONQUISTAS =====================
   Medalhas de bronze, prata e ouro, calculadas do histórico que você JÁ TEM — as que
   você já merecia aparecem desbloqueadas na primeira vez, sem festa para cada uma.
   Desbloqueou, fica: perder peso de volta ou ficar uma semana parado não tira medalha.
   As de corpo usam a SUA meta (peso e % de gordura). O app não inventa meta de corpo:
   sem ela, essas duas ficam esperando você preencher. */
const TIERS = [{k:"bronze", em:"🥉", nome:"Bronze"}, {k:"prata", em:"🥈", nome:"Prata"}, {k:"ouro", em:"🥇", nome:"Ouro"}];
function trainDays(){
  const s = new Set();
  db.logs.forEach(l => { if(l.sets && l.sets.length) s.add(l.date); });
  return [...s].sort();
}
function bestWeekStreak(minDias){
  const porSemana = {};
  trainDays().forEach(d => { const k = weekKeyOf(d); porSemana[k] = (porSemana[k] || 0) + 1; });
  const boas = Object.keys(porSemana).filter(k => porSemana[k] >= minDias).sort();
  let best = 0, cur = 0, ant = null;
  boas.forEach(k => { cur = (ant && shiftDay(ant, 7) === k) ? cur + 1 : 1; best = Math.max(best, cur); ant = k; });
  return best;
}
/* sessões agrupadas por exercício — e por unidade, quando a carga muda de filial */
function exSessionGroups(){
  const g = {};
  db.logs.forEach(l => {
    if(!l.sets || !l.sets.length) return;
    const e = exById(l.exerciseId); if(!e) return;
    const k = l.exerciseId + "|" + (e.perUnit ? (l.u || "") : "");
    (g[k] = g[k] || {e, logs:[]}).logs.push(l);
  });
  return Object.values(g).map(x => { x.logs.sort((a,b) => a.date < b.date ? -1 : 1); return x; });
}
function progressCounts(){
  let subidas = 0, ciclos = 0, recordes = 0;
  exSessionGroups().forEach(({e, logs}) => {
    let wAnt = null, melhor = 0;
    logs.forEach((l, i) => {
      const w = workSets(l).w;
      if(wAnt !== null && w > wAnt + 0.001) subidas++;
      wAnt = w;
      const dp = dpState(e, l);
      if(dp && dp.fechou) ciclos++;
      const v = sessionLoad(l.sets);
      if(i > 0 && v > melhor * 1.01) recordes++;
      melhor = Math.max(melhor, v);
    });
  });
  return {subidas, ciclos, recordes};
}
function dietCounts(){
  const datas = [];
  db.plan.forEach(m => { if(m.created) datas.push(m.created); if(m.date) datas.push(m.date); });
  db.food.forEach(f => datas.push(f.date));
  const hoje = todayStr();
  let dias100 = 0, melhorSemBinge = 0, seq = 0;
  if(!datas.length) return {dias100, semBinge:0};
  let d = datas.sort()[0];
  if(daysBetween(d, hoje) > 800) d = shiftDay(hoje, -800);
  const comComida = new Set(db.food.map(f => f.date));
  const binge = new Set(db.food.filter(f => f.binge).map(f => f.date).concat(db.urges.filter(u => u.gaveIn).map(u => u.date)));
  for(; d <= hoje; d = shiftDay(d, 1)){
    const ad = adherence(d);
    if(ad.t > 0 && ad.d === ad.t && !ad.open) dias100++;
    if(comComida.has(d) && !binge.has(d)){ seq++; melhorSemBinge = Math.max(melhorSemBinge, seq); }
    else seq = 0;
  }
  return {dias100, semBinge: melhorSemBinge};
}
/* meta de corpo ABSOLUTA: quanto do caminho até ela já foi feito (0 a 1) */
function goalProgress(serie, alvo){
  if(typeof alvo !== "number" || !isFinite(alvo) || serie.length < 2) return null;
  const ini = serie[0], fim = serie[serie.length - 1];
  if(ini === alvo) return 1;
  const p = alvo < ini ? (ini - fim) / (ini - alvo) : (fim - ini) / (alvo - ini);
  return Math.max(0, Math.min(1, p));
}
function medalDefs(){
  const dias = trainDays().length;
  let series = 0, volume = 0;
  db.logs.forEach(l => (l.sets || []).forEach(x => { series++; volume += x.weight * x.reps; }));
  const pc = progressCounts(), dc = dietCounts();
  const gl = db.settings.goals || {};
  const pesos = bodySorted().map(b => b.kg);
  const bfs = db.body.filter(b => typeof b.bf === "number").sort((a,b) => a.date < b.date ? -1 : 1).map(b => b.bf);
  const gp = goalProgress(pesos, gl.kg), gb = goalProgress(bfs, gl.bf);
  return [
    {id:"freq",   em:"🏋️", nome:"Frequência",       desc:"Dias de treino registrados",                            v:dias,       metas:[10, 50, 150]},
    {id:"streak", em:"🔥", nome:"Sequência",        desc:"Semanas seguidas com 3 treinos ou mais",                 v:bestWeekStreak(3), metas:[4, 12, 26], un:"sem."},
    {id:"series", em:"📦", nome:"Séries",           desc:"Séries feitas no total",                                 v:series,     metas:[500, 2500, 10000]},
    {id:"volume", em:"🏗️", nome:"Toneladas",        desc:"Peso × reps somado em toda a sua vida de treino",        v:Math.round(volume/1000), metas:[50, 250, 1000], un:"t"},
    {id:"subida", em:"📈", nome:"Carga subindo",    desc:"Vezes que a carga de trabalho subiu de uma sessão para a seguinte", v:pc.subidas, metas:[5, 25, 75]},
    {id:"ciclo",  em:"🎯", nome:"Faixa fechada",    desc:"Sessões em que TODAS as séries bateram o topo da faixa de reps", v:pc.ciclos, metas:[5, 25, 75]},
    {id:"record", em:"🏆", nome:"Sessão recorde",   desc:"Sessões mais fortes que todas as anteriores do exercício", v:pc.recordes, metas:[5, 25, 75]},
    {id:"peso",   em:"⚖️", nome:"Meta de peso",     desc: typeof gl.kg === "number" ? `Caminho até ${fmtW(gl.kg)} kg` : "Defina a sua meta de peso abaixo",
      v: gp === null ? 0 : Math.round(gp * 100), metas:[33, 66, 100], un:"%", semMeta: typeof gl.kg !== "number"},
    {id:"bf",     em:"🔻", nome:"Meta de gordura",  desc: typeof gl.bf === "number" ? `Caminho até ${fmtW(gl.bf)}% de gordura` : "Defina a sua meta de % de gordura abaixo",
      v: gb === null ? 0 : Math.round(gb * 100), metas:[33, 66, 100], un:"%", semMeta: typeof gl.bf !== "number"},
    {id:"dieta",  em:"🍽️", nome:"Dieta em dia",     desc:"Dias com o plano alimentar 100% cumprido",              v:dc.dias100, metas:[7, 30, 100]},
    {id:"binge",  em:"🛡️", nome:"Sem compulsão",    desc:"Maior sequência de dias registrados sem binge",          v:dc.semBinge, metas:[7, 30, 90]}
  ];
}
function checkAch(){
  db.ach = db.ach || {};
  const novos = [];
  medalDefs().forEach(m => m.metas.forEach((alvo, i) => {
    const k = m.id + ":" + TIERS[i].k;
    if(!db.ach[k] && m.v >= alvo && !m.semMeta){ db.ach[k] = todayStr(); novos.push({m, i}); }
  }));
  if(!novos.length) return;
  /* primeira vez: as medalhas que você já tinha entram caladas, sem uma festa para cada */
  if(!db.settings.achInit){
    db.settings.achInit = true;
    localStorage.setItem(LS, JSON.stringify(db));
    Sync.push();
    toast(`🏆 Você já tinha ${novos.length} medalha${novos.length===1?"":"s"} — veja em Evolução → Conquistas`);
    return;
  }
  localStorage.setItem(LS, JSON.stringify(db));
  Sync.push();
  const top = novos.sort((a, b) => b.i - a.i)[0];        // festeja a de nível mais alto
  celebrateMedal(top.m, top.i, novos.length);
  if(route().name === "progress") render();
}
function celebrateMedal(m, i, total){
  const t = TIERS[i];
  prCard.innerHTML = `<div class="big">${t.em}${m.em}</div>
    <h2>Medalha de ${t.nome.toLowerCase()}!</h2>
    <p><b>${esc(m.nome)}</b> — ${esc(m.desc)}</p>
    <div class="val">${fmtNum(m.metas[i])}${m.un ? " " + m.un : ""}</div>
    ${total > 1 ? `<p class="sub">e mais ${total - 1} medalha${total-1===1?"":"s"} agora — veja em Evolução → Conquistas</p>` : ""}
    <button data-action="close-pr">Boraa! 💪</button>`;
  prBox.classList.add("on");
  doVibrate([60,40,60,40,60,40,300]);
}
function achSection(){
  const defs = medalDefs(), ach = db.ach || {};
  const total = defs.length * 3, tem = Object.keys(ach).length;
  const gl = db.settings.goals || {};
  const cards = defs.map(m => {
    const prox = m.metas.findIndex((alvo, i) => !ach[m.id + ":" + TIERS[i].k]);
    const alvo = prox >= 0 ? m.metas[prox] : m.metas[2];
    const base = prox > 0 ? m.metas[prox - 1] : 0;
    const pct = prox < 0 ? 100 : Math.max(0, Math.min(100, (m.v - base) / (alvo - base) * 100));
    return `<div class="card" style="margin-bottom:10px">
      <div class="row" style="gap:10px; align-items:flex-start">
        <span style="font-size:1.6rem">${m.em}</span>
        <div class="grow"><b>${esc(m.nome)}</b><div class="sub">${esc(m.desc)}</div>
          <div class="row" style="gap:6px; margin-top:8px; flex-wrap:wrap">
            ${TIERS.map((t, i) => { const d = ach[m.id + ":" + t.k];
              return `<span class="pill" style="${d ? "" : "opacity:.35"}" title="${d ? "Desbloqueada em " + fmtDate(d) : "Falta"}">${t.em} ${fmtNum(m.metas[i])}${m.un ? " " + m.un : ""}</span>`; }).join("")}
          </div>
          ${m.semMeta ? "" : `<div class="dpbar" style="margin-top:8px"><div class="dpfill${prox < 0 ? " full" : ""}" style="width:${pct.toFixed(1)}%"></div>
            <span class="dptxt">${prox < 0 ? "todas as medalhas ✓" : `${fmtNum(m.v)}${m.un ? " " + m.un : ""} de ${fmtNum(alvo)} para ${TIERS[prox].nome.toLowerCase()}`}</span></div>`}
        </div></div></div>`;
  }).join("");
  return `<div class="section"><h2>🏆 ${tem} de ${total} medalhas</h2>${cards}</div>
    <div class="section"><h2>Suas metas de corpo</h2><div class="card">
      <p class="sub" style="margin-bottom:10px">As medalhas de corpo medem o caminho do seu primeiro registro até a meta: bronze a 1/3, prata a 2/3, ouro ao chegar. O peso respeita o "contar a partir de" da tela de peso.</p>
      <div class="btnrow">
        <div class="field" style="flex:1"><label for="goal-kg">Meta de peso (kg)</label>
          <input id="goal-kg" type="number" inputmode="decimal" step="any" min="20" max="400" value="${typeof gl.kg === "number" ? gl.kg : ""}" placeholder="—"></div>
        <div class="field" style="flex:1"><label for="goal-bf">Meta de gordura (%)</label>
          <input id="goal-bf" type="number" inputmode="decimal" step="any" min="2" max="60" value="${typeof gl.bf === "number" ? gl.bf : ""}" placeholder="—"></div>
      </div>
      <button class="btn" data-action="save-goals">Salvar metas</button>
    </div></div>`;
}

/* ---------- força do código de sincronização ----------
   Conferi as regras do Firestore de fora: LISTAR os cofres está bloqueado (ninguém
   baixa a coleção inteira), mas LER um cofre é liberado para quem souber o código.
   Ou seja, o código É a senha dos seus dados. Curto ou óbvio = adivinhável. */
const SYNC_MIN = 16;
function syncCodeStrength(code){
  code = String(code || "");
  if(code.length >= 20) return {ok:true, txt:`forte (${code.length} caracteres)`};
  if(code.length >= SYNC_MIN) return {ok:true, txt:`bom (${code.length} caracteres)`};
  return {ok:false, txt:`FRACO (${code.length} caracteres) — quem adivinhar lê e muda seus dados`};
}
/* 24 caracteres aleatórios do gerador criptográfico, sem os que confundem (0/O, 1/l/I) */
function newSyncCode(){
  const abc = "abcdefghjkmnpqrstuvwxyz23456789";
  const v = new Uint32Array(24); crypto.getRandomValues(v);
  const c = [...v].map(x => abc[x % abc.length]).join("");
  return c.slice(0,6) + "-" + c.slice(6,12) + "-" + c.slice(12,18) + "-" + c.slice(18);
}
function syncSecureForm(){
  const atual = Sync.activeCode();
  const novo = newSyncCode();
  openModal(`<h2>🔐 Trocar por um código seguro</h2>
    <p class="sub" style="margin-bottom:10px">O app cria um código longo e aleatório, copia <b>todos os seus dados</b> para ele na nuvem e passa a usar o novo.</p>

    <p class="sub" style="margin:10px 0">Depois você digita esse <b>mesmo código</b> no PC e nos outros aparelhos (Ajustes → Sincronização → Editar). Até fazer isso, eles continuam no código antigo e <b>não recebem</b> o que você fizer aqui.</p>
    <button class="btn" data-action="sync-secure-go" data-code="${esc(novo)}">Usar este código</button>
    <button class="btn ghost" data-action="close-modal" style="margin-top:8px">Cancelar</button>`);
}
async function syncSecureGo(novo){
  const cfg = db.settings.sync; if(!cfg) return;
  const antigo = cfg.code;
  try{
    cfg.code = novo;
    db.updatedAt = Date.now();
    await Sync.putRemote();                       // copia tudo para o cofre novo
    const conf = await Sync.getRemote();          // e confere que chegou mesmo
    if(!conf || Sync.dataCount(conf) < Sync.dataCount(db)) throw new Error("a cópia não conferiu");
    cfg.oldCode = antigo;                         // para poder apagar o antigo depois
    save();
    openModal(`<h2>✅ Código trocado</h2>
      <p class="sub" style="margin-bottom:10px">Seus dados já estão no cofre novo. Agora digite este código no PC e nos outros aparelhos:</p>

}
async function syncDeleteOld(){

/* ===================== lembrete de refeicao =====================
   Notificacao no horario de cada refeicao planejada. As FIXAS repetem todo dia
   ({on:{hour,minute}}); as de um dia so entram com data e hora exatas.
   Os ids 7100+ sao so daqui: a cada mudanca do plano tudo e cancelado e reagendado,
   senao sobrariam lembretes de refeicoes que voce ja apagou. */
const MEALN_BASE = 7100, MEALN_MAX = 30, MEALN_CH = "meals-v1";
async function scheduleMealNotifs(){
  if(!native.isNative) return;
  const LN = native.plugin("LocalNotifications"); if(!LN) return;
  const todos = [];
  for(let i=0;i<MEALN_MAX;i++) todos.push({id:MEALN_BASE+i});
  try{ await LN.cancel({notifications:todos}); }catch(e){}
  if(!db.settings.mealNotif) return;
  try{ await LN.requestPermissions(); }catch(e){}
  try{
    const ch = {id:MEALN_CH, name:"Refeições", description:"Lembrete de registrar a refeição",
                importance:5, vibration:true, visibility:1};
    ch.sound = "default";
    await LN.createChannel(ch);
  }catch(e){}
  const lista = [];
  db.plan.filter(m => m.fixed && m.time)
    .sort((a,b)=>a.time.localeCompare(b.time))
    .forEach(m => lista.push({m, at:null}));
  const hoje = todayStr(), amanha = shiftDay(hoje, 1);
  db.plan.filter(m => !m.fixed && m.time && (m.date === hoje || m.date === amanha)).forEach(m => {
    const t = tsFor(m.date, m.time);
    if(t > Date.now() + 60000) lista.push({m, at:new Date(t)});
  });
  if(!lista.length) return;
  const notifs = lista.slice(0, MEALN_MAX).map((x, i) => {
    const [h, mi] = x.m.time.split(":").map(Number);
    return {
      id: MEALN_BASE + i, channelId: MEALN_CH,
      title: (x.m.kind === "lanche" ? "🍎 " : "🍽️ ") + x.m.name + " · " + x.m.time,
      body: "Hora de registrar o que você comeu.",
      smallIcon: "ic_stat_icon", autoCancel: true,
      schedule: x.at ? {at: x.at, allowWhileIdle: true}
                     : {on: {hour: h, minute: mi}, allowWhileIdle: true}
    };
  });
  try{ await LN.schedule({notifications: notifs}); }catch(e){}
}

let rest = {end:0, total:0, iv:null};
let audioCtx = null;
const bar = document.getElementById("restbar"), tEl = document.getElementById("resttime"),
      lEl = document.getElementById("restlabel"), pEl = document.getElementById("restprog");

function startRest(sec, label, exId, gymId){
  rest.end = Date.now() + sec*1000;
  rest.total = sec*1000;
  rest.exId = exId || null; rest.gymId = gymId || null;   // toque no rótulo volta ao exercício
  lEl.textContent = "Descanso · " + label;
  bar.classList.add("on");
  native.restOngoing(rest.end, label);
  if(db.settings.restOverlay) native.overlayStart(rest.end);
  if(!rest.iv) rest.iv = setInterval(tickRest, 250);
  if(db.settings.sound && !audioCtx){ try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){} }
  /* guarda se a notificação do fim vai sair com som: é o que decide se o app ainda
     precisa tocar alguma coisa por conta própria quando chegar a hora */
  rest.somNativo = false;
  native.scheduleRestEnd(rest.end, label).then(ok => { rest.somNativo = !!ok; });
  keepAlive.on();                                // mantém o timer vivo no navegador
  if(!native.isNative && "Notification" in window && Notification.permission === "default") Notification.requestPermission();
  tickRest();
}
function tickRest(){
  if(!rest.end) return;
  const left = rest.end - Date.now();
  if(left <= 0){ finishRest(); return; }
  const s = Math.ceil(left/1000);
  tEl.textContent = Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
  pEl.style.width = Math.max(0, Math.min(100, left/rest.total*100)) + "%";
}
function stopRest(skipCancel){
  rest.end = 0; rest.exId = null; rest.gymId = null;
  native.restOngoingCancel();
  native.overlayStop();
  if(rest.iv){ clearInterval(rest.iv); rest.iv = null; }
  bar.classList.remove("on");
  keepAlive.off();
  if(!skipCancel) native.cancelRest();
}
function finishRest(){
  const wasRunning = !!rest.end;
  const nome = (lEl.textContent || "").replace(/^Descanso · /, "");
  /* não cancela aqui: quem reposta a notificação é o notifyNow, com o MESMO id.
     Se cancelássemos em paralelo, o cancel podia chegar depois e matar a nova. */
  stopRest(native.isNative);
  if(!wasRunning) return;
  doVibrate(vibePattern());
  if(native.isNative){
    /* A notificação agendada já tocou e vibrou na hora certa, mesmo com a tela apagada.
       Só repostamos aqui se ela ia sair MUDA — assim a barra fica com o aviso e o som,
       quando existe, vem de uma fonte só (nada de bipe dobrado). */
    if(!rest.somNativo) native.notifyNow(nome, false);
    if(!rest.somNativo) maybeBeep();                 // fallback do app aberto
  } else {
    if("Notification" in window && Notification.permission === "granted"){
      try{ new Notification("Descanso concluído 💪", {body:nome || "Hora da próxima série!", silent:true, tag:"fitglobal-rest", requireInteraction:true}); }catch(e){}
    }
    maybeBeep();                                     // no navegador não existe canal: o som é do JS
  }
  toast("Descanso concluído — próxima série! 💪");
}
async function maybeBeep(){
  if(!db.settings.sound || !audioCtx) return;
  if(native.isNative && !(await native.shouldSound())) return;
  playBeep();
}
/* tom pronto em WAV: o WebAudio às vezes está suspenso (tela apagada, app em segundo
   plano, política de autoplay) e não sai som nenhum. Este <audio> toca mesmo assim. */
let beepEl = null;
function beepWavUrl(dur){
  const sr = 8000, n = Math.max(1, Math.round(sr*dur)), bytes = 44 + n*2;
  const b = new ArrayBuffer(bytes), v = new DataView(b);
  const str = (o,t) => { for(let i=0;i<t.length;i++) v.setUint8(o+i, t.charCodeAt(i)); };
  str(0,"RIFF"); v.setUint32(4, bytes-8, true); str(8,"WAVEfmt ");
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  str(36,"data"); v.setUint32(40, n*2, true);
  for(let i=0;i<n;i++){
    const t = i/sr;
    const env = Math.min(1, t/0.01) * Math.min(1, (dur-t)/0.05);   // sobe rápido, cai só no fim
    v.setInt16(44+i*2, Math.round(Math.sin(2*Math.PI*880*t) * 26000 * Math.max(0,env)), true);
  }
  let bin = ""; const u = new Uint8Array(b);
  for(let i=0;i<u.length;i++) bin += String.fromCharCode(u[i]);
  return "data:audio/wav;base64," + btoa(bin);
}
function beepFallback(dur){
  try{
    if(!beepEl){ beepEl = new Audio(); beepEl.preload = "auto"; }
    beepEl.src = beepWavUrl(dur);
    beepEl.currentTime = 0;
    const p = beepEl.play();
    if(p && p.catch) p.catch(()=>{});
  }catch(e){}
}
async function playBeep(){
  const dur = SOUNDLEN[db.settings.soundLen] || SOUNDLEN.medio;
  try{
    if(!audioCtx || audioCtx.state === "closed"){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    /* resume() é assíncrono: sem esperar, o tom era agendado num contexto parado e
       simplesmente não saía som — era esse o "às vezes não toca" */
    if(audioCtx.state === "suspended"){ try{ await audioCtx.resume(); }catch(e){} }
    if(audioCtx.state !== "running"){ beepFallback(dur); return; }
    const t0 = audioCtx.currentTime + 0.02;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = 880; o.type = "sine";     // mesmo som sempre, só a duração muda
    g.gain.setValueAtTime(0.001, t0);
    g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02);
    g.gain.setValueAtTime(0.25, t0 + dur * 0.75);  // sustenta e só decai no fim
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }catch(e){ beepFallback(dur); }
}

/* keep-alive: áudio silencioso evita o navegador congelar o cronômetro com a tela apagada */
const keepAlive = {
  el:null,
  on(){
    if(native.isNative) return;
    try{
      if(!this.el){
        this.el = document.createElement("audio");

      }
      this.el.play().catch(() => {});
    }catch(e){}
  },
  off(){ try{ if(this.el) this.el.pause(); }catch(e){} }
};

/* ===================== ponte nativa (Capacitor) ===================== */
const native = {
  get cap(){ return window.Capacitor; },
  get isNative(){ return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); },
  plugin(n){ return window.Capacitor && window.Capacitor.Plugins ? window.Capacitor.Plugins[n] : null; },
  /* O Android NÃO deixa alterar um canal já criado: mexer no ajuste e recriar com o
     mesmo id não muda nada, em silêncio. Por isso o id carrega o som e a vibração.
     São dois canais, um com som e um mudo, porque a decisão de tocar depende do fone —
     e ela é tomada na hora de agendar, não aqui. */
  channelId(comSom){

    return "rest-v4-" + s + "-" + (db.settings.vibe || "media");

  async testDelayed(secs){

      await LN.schedule({ notifications:[{

        body: comSom ? "Vibrou e tocou com a tela apagada? Então está funcionando."
                     : "Vibrou com a tela apagada? Então está funcionando. (sem som: fone desconectado ou som desligado)",
        schedule:{ at:new Date(Date.now()+secs*1000), allowWhileIdle:true },

      }]});

  },
  /* ESTA é a notificação que toca o som do fim do descanso. Ela é agendada no
     AlarmManager do Android, então dispara com a tela apagada, com o app em segundo
     plano e até com o app fechado — ao contrário do timer da WebView, que o Android
     congela. Devolve se vai sair com som, para o app não tocar nada por cima. */
  /* o APK a partir do build 41 toca o bipe ele mesmo (RestSoundReceiver), por alarme */
  hasNativeSound(){ const RC = this.plugin("RestChannel"); return !!(RC && RC.scheduleSound); },
  async scheduleRestEnd(atMs, label){
    if(!this.isNative) return false;
    const LN = this.plugin("LocalNotifications"); if(!LN) return false;
    /* APK novo: a notificação vai SEMPRE pelo canal mudo (só vibra) e o bipe é agendado à
       parte, no AlarmManager. É ele que decide na hora de tocar: com fone, pela mídia,
       mesmo no silencioso; sem fone, só com o alto-falante liberado e o celular no normal.
       O som da notificação não serve para isso: o Android cala notificação no silencioso
       e no vibrar, com ou sem fone. */
    if(this.hasNativeSound()){
      const RC = this.plugin("RestChannel");
      try{
        await LN.cancel({ notifications:[{id:7001}] });
        await this.makeChannel(false);
        await LN.schedule({ notifications:[{
          id:7001, channelId:this.channelId(false), title:"Descanso concluído 💪",
          body:label || "Hora da próxima série!",
          schedule:{ at:new Date(atMs), allowWhileIdle:true },
          smallIcon:"ic_stat_icon", autoCancel:false, ongoing:false
        }]});
      }catch(e){}
      if(!db.settings.sound){ try{ await RC.cancelSound(); }catch(e){} return false; }
      try{
        const r = await RC.scheduleSound({at: Math.round(atMs), sound: this.soundFile(), spk: !!db.settings.soundSpk});
        return !!(r && r.ok);
      }catch(e){ return false; }
    }
    const comSom = await this.shouldSound();
    try{
      /* cancel(7001) já tira da barra o aviso da série anterior (a Capacitor chama
         dismissVisibleNotification). Aqui havia um removeAllDeliveredNotifications(),
         que no Android é cancelAll(): apagava TODAS as notificações do app — inclusive a
         contagem regressiva que tinha acabado de ser posta. Era por isso que o
         cronômetro da barra sumiu. */
      await LN.cancel({ notifications:[{id:7001}] });
      await this.makeChannel(comSom);            // garante o canal antes de usar
      await LN.schedule({ notifications:[{
        id:7001, channelId:this.channelId(comSom), title:"Descanso concluído 💪",
        body:label || "Hora da próxima série!",
        schedule:{ at:new Date(atMs), allowWhileIdle:true },
        /* o som vai TAMBÉM aqui: no Android 8+ quem manda é o canal, mas assim a
           Capacitor resolve o arquivo e libera a URI para a interface do sistema */
        sound: comSom ? this.soundFile() : undefined,
        smallIcon:"ic_stat_icon", autoCancel:false, ongoing:false
      }]});
      return comSom;
    }catch(e){ return false; }
  },

    if(!this.isNative) return;
    const LN = this.plugin("LocalNotifications"); if(!LN) return;
    try{ await LN.cancel({ notifications:[{id:7001}] }); }catch(e){}
    /* pulou o descanso: o bipe agendado também sai. No fim natural isto não é chamado —
       o alarme do bipe dispara na mesma hora e não pode ser cancelado por engano */

/* vibração com padrão escolhido (funciona no navegador e na WebView do app) */
function doVibrate(pattern){
  pattern = pattern || vibePattern();
  let ok = false;
  try{ if(navigator.vibrate){ ok = navigator.vibrate(pattern); } }catch(e){}

  return ok;
}

/* ===================== sincronização (Firebase) ===================== */
/* decodifica os campos "tipados" do Firestore (formato antigo, do SDK) */
function fsVal(v){
  if(v == null) return null;
  if("stringValue" in v) return v.stringValue;
  if("integerValue" in v) return Number(v.integerValue);
  if("doubleValue" in v) return Number(v.doubleValue);
  if("booleanValue" in v) return v.booleanValue;
  if("nullValue" in v) return null;
  if("timestampValue" in v) return v.timestampValue;
  if("arrayValue" in v) return (v.arrayValue.values || []).map(fsVal);
  if("mapValue" in v){ const o = {}; Object.entries(v.mapValue.fields || {}).forEach(([k,x]) => o[k] = fsVal(x)); return o; }
  return null;
}
/* Sincronização pela API REST do Firestore — funciona no WebView do app
   (o SDK usa WebChannel/streaming, que costuma falhar dentro de apps). */
const Sync = {
  state:"off", last:0, applying:false, remoteCount:0, lastError:"", pollT:null,
  cfg(){ return db.settings.sync; },
  activeConfig(){ return (this.cfg() && this.cfg().config) || FIREBASE_CONFIG; },
  activeCode(){ return this.cfg() && this.cfg().code; },
  enabled(){ const c = this.activeConfig(); return !!(c && c.apiKey && c.projectId && this.activeCode()); },
  /* quantos registros existem — usado para NUNCA sobrescrever a nuvem com um app vazio */
  /* Esta conta decide "aparelho vazio -> adoto a nuvem por cima" e "nunca apagar a
     nuvem com um app vazio". Antes eram 7 nomes escritos a mão, e ficavam de fora as
     rotinas, o histórico de treinos e as ideias: um aparelho que só tivesse isso era
     tratado como VAZIO e sobrescrito. A lista sai do seed(), como no _adopt — campo
     novo entra sozinho. Lista conta itens; objeto (comentários, mapa de nutrição) conta
     chaves. */
  dataCount(o){
    o = o || db;
    const base = seed();
    return Object.keys(base).reduce((n, k) => {
      if(k === "settings" || k === "updatedAt") return n;
      const v = o[k];
      if(Array.isArray(v)) return n + v.length;
      if(v && typeof v === "object") return n + Object.keys(v).length;
      return n;
    }, 0);
  },
  url(){
    const c = this.activeConfig();
    return "https://firestore.googleapis.com/v1/projects/" + c.projectId +
      "/databases/(default)/documents/vaults/" + encodeURIComponent(this.activeCode()) + "?key=" + c.apiKey;
  },
  badge(){
    if(!this.enabled()) return "";
    const map = {ok:'<span class="cloud" style="color:var(--good)">☁︎ sincronizado</span>',
      connecting:'<span class="cloud">☁︎ sincronizando…</span>',
      error:'<span class="cloud" style="color:var(--bad)">☁︎ erro</span>', off:""};
    return map[this.state] || "";
  },
  stateText(){
    if(!this.enabled()) return "Desativada — cada aparelho guarda seus próprios dados";
    if(this.state === "ok") return "Sincronizado" + (this.last ? " às " + new Date(this.last).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}) : "") +
      (this.remoteCount ? " · " + this.remoteCount + " registros na nuvem" : "");
    if(this.state === "connecting") return "Sincronizando…";
    if(this.state === "error") return "Erro: " + (this.lastError || "sem conexão") + " — toque em Sincronizar para tentar de novo";
    return "Ativando…";
  },
  /* lista campo a campo de propósito (o `sync` não pode subir). Campo novo no db TEM
     que entrar aqui — o mealNotes ficou de fora na v13 e os comentários de refeição
     nunca chegavam nos outros aparelhos. */
  data(){ return {gyms:db.gyms, exercises:db.exercises, routines:db.routines, logs:db.logs, food:db.food, urges:db.urges,
    plan:db.plan, body:db.body, sessions:db.sessions, ideas:db.ideas, ach:db.ach, mealNotes:db.mealNotes, free:db.free, foodMap:db.foodMap,
    settings:Object.assign({}, db.settings, {sync:null}), updatedAt:db.updatedAt}; },
  async getRemote(){
    const r = await fetch(this.url(), {cache:"no-store"});
    if(r.status === 404) return null;                       // ainda não existe esse código
    if(!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    const f = j.fields || {};
    if(f.json && f.json.stringValue){                       // formato novo: um JSON só
      const o = JSON.parse(f.json.stringValue);
      o.updatedAt = Number((f.updatedAt && f.updatedAt.integerValue) || o.updatedAt || 0);
      return o;
    }
    const o = {};                                           // formato antigo: campos separados
    Object.keys(f).forEach(k => o[k] = fsVal(f[k]));
    o.updatedAt = Number(o.updatedAt || 0);
    return o;
  },
  async putRemote(){
    const body = {fields:{ json:{stringValue: JSON.stringify(this.data())},
      updatedAt:{integerValue: String(db.updatedAt || Date.now())} }};
    const u = this.url() + "&updateMask.fieldPaths=json&updateMask.fieldPaths=updatedAt";
    const r = await fetch(u, {method:"PATCH", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
    if(!r.ok) throw new Error("HTTP " + r.status);
  },
  async start(){
    if(!this.enabled()){ this.state = "off"; this._reflect(); return; }
    this.state = "connecting"; this.lastError = ""; this._reflect();
    try{
      const remote = await this.getRemote();
      const lc = this.dataCount(db);
      this.remoteCount = remote ? this.dataCount(remote) : 0;
      if(!remote) await this.putRemote();
      else if(lc === 0 && this.remoteCount > 0) this._adopt(remote);            // aparelho vazio: recupera
      else if(this.remoteCount === 0 && lc > 0) await this.putRemote();         // nuvem vazia: envia
      else if(this.remoteCount < lc * 0.5){                                     // nuvem com muito menos: protege
        toast("Este aparelho tem mais dados que a nuvem — nada foi apagado.");
        await this.putRemote();
      }
      else if((remote.updatedAt || 0) > (db.updatedAt || 0)) this._adopt(remote);
      else if((db.updatedAt || 0) > (remote.updatedAt || 0)) await this.putRemote();
      this.state = "ok"; this.last = Date.now(); this._reflect();
    }catch(e){ this.lastError = (e && e.message) || String(e); this.state = "error"; this._reflect(); }
    this._poll();
  },
  _poll(){
    clearTimeout(this.pollT);
    this.pollT = setTimeout(() => { if(document.hidden) this._poll(); else this.check(); }, 25000);
  },
  async check(){                        // vê se o outro aparelho mudou algo
    if(!this.enabled()) return;
    try{
      const remote = await this.getRemote();
      if(remote){
        this.remoteCount = this.dataCount(remote);
        const lc = this.dataCount(db);
        if(lc === 0 && this.remoteCount > 0) this._adopt(remote);
        else if(this.remoteCount >= lc * 0.5 && (remote.updatedAt || 0) > (db.updatedAt || 0)) this._adopt(remote);
      }
      this.state = "ok"; this.last = Date.now(); this.lastError = ""; this._reflect();
    }catch(e){ this.lastError = (e && e.message) || String(e); this.state = "error"; this._reflect(); }
    this._poll();
  },
  _adopt(remote){
    this.applying = true;
    const keepSync = db.settings.sync;
    /* A lista de campos sai do seed() de proposito. Antes eram sete nomes escritos a mao
       aqui, e os que faltavam voltavam VAZIOS no aparelho que adotava a nuvem: as
       rotinas (treino A/B/C), os comentarios de refeicao, as refeicoes livres e tudo o
       que o app tinha aprendido de nutricao sumiam. Do seed(), campo novo entra sozinho. */
    const base = seed();
    Object.keys(base).forEach(k => {
      if(k === "settings" || k === "updatedAt") return;
      db[k] = remote[k] != null ? remote[k] : base[k];
    });
    db.settings = Object.assign(seed().settings, remote.settings || {}, {sync:keepSync});
    db.updatedAt = remote.updatedAt || Date.now();
    localStorage.setItem(LS, JSON.stringify(db));
    this.last = Date.now(); this.remoteCount = this.dataCount(db);
    try{ deriveAllActs(); }catch(e){}
    render(); toast("Dados atualizados da nuvem ☁︎");
    setTimeout(() => this.applying = false, 300);
  },
  /* baixa da nuvem por vontade sua (recuperação) */
  async pull(){
    if(!this.enabled()){ toast("Sincronização não está ativa."); return; }
    try{
      const remote = await this.getRemote();
      if(!remote){ toast("Nada salvo na nuvem com esse código."); return; }
      const rc = this.dataCount(remote);
      if(!rc){ toast("O baú da nuvem está vazio."); return; }
      if(!confirm("Baixar da nuvem " + rc + " registros e SUBSTITUIR os dados deste aparelho?")) return;
      this._adopt(remote);
    }catch(e){ toast("Não deu para baixar: " + ((e && e.message) || "erro")); }
  },
  async push(){
    if(!this.enabled() || this.applying) return;
    if(this.dataCount(db) === 0 && (this.remoteCount || 0) > 0) return;      // nunca apaga a nuvem
    try{
      await this.putRemote();
      this.remoteCount = this.dataCount(db); this.state = "ok"; this.last = Date.now(); this.lastError = "";
    }catch(e){ this.lastError = (e && e.message) || String(e); this.state = "error"; }
    this._reflect();
  },
  async restart(){ clearTimeout(this.pollT); await this.start(); },
  _reflect(){
    const el = document.getElementById("syncstate"); if(el) el.textContent = this.stateText();
    document.querySelectorAll(".cloud").forEach(x => { const b = this.badge(); if(b) x.outerHTML = b; else x.remove(); });
  }
};

/* ===================== toast ===================== */
let toastT = null;
/* aviso com botão Desfazer: apagar não pede mais confirmação, só dá 7 s para voltar atrás */
function toastUndo(msg, undo, ms){
  const t = document.getElementById("toast");
  t.innerHTML = `<span></span> <button type="button" style="margin-left:10px; font-weight:800; color:var(--accent); text-decoration:underline">Desfazer</button>`;
  t.firstChild.textContent = msg;
  t.style.pointerEvents = "auto";
  t.querySelector("button").onclick = () => { clearTimeout(toastT); t.classList.remove("on"); t.style.pointerEvents = ""; undo(); };
  t.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.classList.remove("on"); t.style.pointerEvents = ""; }, ms || 7000);
}
function toast(msg){
  const t = document.getElementById("toast");
  t.style.pointerEvents = "";
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove("on"), 2600);
}

/* detecta recorde ANTES de inserir a nova série */
function detectPR(exId, w, r){
  const rec = records(exId);
  if(!rec) return null; // primeira sessão não conta como recorde
  const newRm = e1rm(w, r);
  /* margem de 1%: antes qualquer 0,01 kg virava "recorde" e a festa aparecia toda hora */
  if(newRm > rec.rm.v * 1.01) return {kind:"forca", value:fmtNum(newRm), unit:"kg (1RM est.)"};
  if(w > rec.wt.v + 0.01) return {kind:"peso", value:fmtW(w), unit:"kg"};
  // recorde de reps no mesmo peso
  let bestRepsAtW = 0;
  exLogs(exId).forEach(l => l.sets.forEach(s => { if(Math.abs(s.weight - w) < 0.01 && s.reps > bestRepsAtW) bestRepsAtW = s.reps; }));
  if(bestRepsAtW && r > bestRepsAtW) return {kind:"reps", value:r + " reps", unit:"com " + fmtW(w) + " kg"};
  return null;
}

  ["lying","deitado"],["one arm","unilateral"],["single-arm","unilateral"],["alternate","alternado"],

function ptNameOf(en, equipment){
  const s = " " + norm(en) + " ";
  let move = null;
  for(const [k,v] of EN2PT_MOVE){ if(s.includes(norm(k))){ move = v; break; } }
  if(!move) return en;                                   // sem tradução conhecida: mantém o inglês
  const mods = [];
  MOD_PT.forEach(([k,v]) => { if(s.includes(norm(k)) && !norm(move).includes(norm(v))) mods.push(v); });
  let eq = EQUIP_PT[norm(equipment)] !== undefined ? EQUIP_PT[norm(equipment)] : "";
  if(eq && norm(move).includes(norm(eq.replace(/^(com|na|no)\s+/,"")))) eq = "";
  return [move, mods.join(" "), eq].filter(Boolean).join(" ").replace(/\s+/g," ").trim();
}

const ExDb = {
  list: null, loading: false,
  async load(){
    if(this.list) return this.list;
    try{ const c = localStorage.getItem(EXDB_LS); if(c){ this.list = JSON.parse(c); return this.list; } }catch(e){}
    this.loading = true;
    const r = await fetch(EXDB_URL, {cache:"force-cache"});
    const raw = await r.json();
    /* i2 = a segunda foto, o FIM do movimento. E ela que tira a duvida quando a
       primeira (posicao inicial) parece outro exercicio. */
    this.list = raw.map(x => ({n:x.name, e:x.equipment||"", m:(x.primaryMuscles||[])[0]||"",
      i:(x.images||[])[0]||"", i2:(x.images||[])[1]||""}));
    this.loading = false;
    try{ localStorage.setItem(EXDB_LS, JSON.stringify(this.list)); }catch(e){}   // cache (~90 KB)
    return this.list;
  },
  /* devolve {x, sc} ordenado — quem chama precisa da NOTA para comparar resultados de
     buscas diferentes (os vários termos que a IA sugere) */
  scored(q){
    if(!this.list) return [];
    const query = norm(q);
    let en = " " + query + " ";
    Object.keys(PT2EN).sort((a,b) => b.length - a.length).forEach(k => {
      if(en.includes(" " + k + " ") || en.includes(k)) en = en.split(k).join(" " + PT2EN[k] + " ");
    });
    const toks = [...new Set((en + " " + query).split(/\s+/).filter(t => t.length > 2))];
    if(!toks.length) return [];
    return this.list.map(x => {
      const nome = norm(x.n), hay = norm(nome + " " + x.e + " " + x.m);
      let sc = 0;
      toks.forEach(t => { if(hay.includes(t)) sc += t.length + (nome.includes(t) ? 3 : 0); });
      /* nome idêntico tem que ganhar de nome que só CONTÉM o termo: "leg press" estava
         trazendo "Calf Press On The Leg Press Machine", que é outro exercício */
      if(sc > 0){
        if(nome === query || norm(ptNameOf(x.n, x.e)) === query) sc += 60;
        else if(nome.startsWith(query + " ") || nome.endsWith(" " + query)) sc += 20;
        sc -= nome.split(/\s+/).length * 0.6;        // desempata pelo nome mais curto
      }
      return {x, sc};
    }).filter(r => r.sc > 0).sort((a,b) => b.sc - a.sc);
  },
  search(q){ return this.scored(q).slice(0, 12).map(r => r.x); },
  img(path){ return path ? EXDB_IMG + path : ""; }
};

/* ---- foto própria ----
   A foto viaja junto no pacote da sincronização, e o documento da nuvem tem limite de
   tamanho. Por isso a imagem é reduzida para 400px no maior lado e salva em JPEG: uma
   foto de celular de 3 MB vira uns 25 KB. */
const PHOTO_MAX = 400, PHOTO_Q = 0.72, PHOTO_BUDGET_KB = 600;
function photoFromFile(file, maxPx){
  const MAX = maxPx || PHOTO_MAX;
  return new Promise((ok, fail)=>{
    if(!file || !/^image\//.test(file.type||"")) return fail(new Error("Isso não é uma imagem."));
    const fr = new FileReader();
    fr.onerror = () => fail(new Error("Não deu para ler o arquivo."));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => fail(new Error("Não deu para abrir essa imagem."));
      img.onload = () => {
        try{
          const k = Math.min(1, MAX / Math.max(img.width, img.height));
          const c = document.createElement("canvas");
          c.width = Math.max(1, Math.round(img.width * k));
          c.height = Math.max(1, Math.round(img.height * k));
          const ctx = c.getContext("2d");
          ctx.fillStyle = "#1E1A18"; ctx.fillRect(0, 0, c.width, c.height);  // PNG transparente não vira preto
          ctx.drawImage(img, 0, 0, c.width, c.height);
          ok(c.toDataURL("image/jpeg", PHOTO_Q));
        }catch(e){ fail(new Error("Não deu para reduzir a imagem.")); }
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
/* ---- guardar as fotos do catálogo DENTRO do app ----
   A foto do catálogo é só um link para o GitHub: sem internet na academia, o exercício
   aparece sem imagem. Aqui a gente baixa e converte para a mesma foto reduzida que as
   fotos próprias usam, aí fica offline de vez. */
async function photoFromUrl(url){
  const r = await fetch(url, {mode:"cors"});
  if(!r.ok) throw new Error("HTTP " + r.status);
  const blob = await r.blob();
  /* 300px no lote: são só miniaturas de referência, e assim cabem os 25 exercícios de
     um plano inteiro dentro do orçamento da sincronização */
  return photoFromFile(new File([blob], "cat.jpg", {type: blob.type || "image/jpeg"}), 300);
}
async function downloadPhotos(lista, onStep){
  let ok = 0, falhou = 0, pulou = 0;
  for(let i = 0; i < lista.length; i++){
    const e = lista[i];
    if(onStep) onStep(i + 1, lista.length, exName(e));
    if(!e.photo || e.photo.slice(0,5) === "data:"){ pulou++; continue; }
    try{
      const url = await photoFromUrl(e.photo);
      if(photoKb(url.length) > PHOTO_BUDGET_KB){ falhou++; break; }   // estourou o orçamento
      e.photo = url; ok++;
    }catch(err){ falhou++; }
  }
  if(ok) save();
  return {ok, falhou, pulou};
}
/* quanto as fotos próprias já ocupam (as do catálogo são só link, não pesam) */
function photoKb(extra){
  const n = db.exercises.reduce((s,e)=> s + ((e.photo && e.photo.slice(0,5) === "data:") ? e.photo.length : 0), 0);
  return Math.round((n + (extra || 0)) / 1024);
}

/* respostas da IA guardadas: procurar o mesmo termo de novo é instantâneo e não gasta
   cota. Fica no aparelho (não sincroniza — é cache, não dado seu). */
const AI_EX_LS = "fitglobal.aiex.v1";
function aiExCache(){
  try{ return JSON.parse(localStorage.getItem(AI_EX_LS) || "{}"); }catch(e){ return {}; }
}
function aiExCacheSet(q, r){
  try{
    const c = aiExCache();
    c[norm(q)] = r;
    const ks = Object.keys(c);
    if(ks.length > 200) delete c[ks[0]];                 // não deixa crescer sem fim
    localStorage.setItem(AI_EX_LS, JSON.stringify(c));
  }catch(e){}
}
async function aiSuggest(auto){
  const q = suggState.query;
  const guardado = aiExCache()[norm(q)];
  if(guardado){ suggState.buscando = false; aplicaAi(guardado); renderSuggest(); return; }
  suggState.buscando = true; suggState.aiErro = "";
  if(!auto) renderSuggest();                             // mostra o "pensando" no lugar do botão
  try{
    await ExDb.load();
    /* se a IA demorar demais, a busca local já está na tela e continua valendo */
    const r = await Promise.race([
      aiBest(q),
      new Promise((_, rej) => setTimeout(() => rej(new Error("A IA demorou demais — ficou o resultado da busca normal.")), 15000))
    ]);
    aiExCacheSet(q, r);
    aplicaAi(r);
  }catch(e){
    suggState.aiErro = (e && e.message) || String(e);
    if(!auto) toast(suggState.aiErro);
  }
  suggState.buscando = false;
  /* só redesenha se o modal ainda for o da sugestão desta busca */
  if(suggState.query === q && modal.classList.contains("on")) renderSuggest();
}
function aplicaAi(r){
  suggState.ai = r;
  if(r.pick && r.pick.length){
    const porNome = {}; (ExDb.list || []).forEach(x => { porNome[x.n] = x; });
    const escolhidos = r.pick.map(nm => porNome[nm]).filter(Boolean);
    const vistos = new Set(escolhidos.map(x => x.n));
    const resto = ExDb.search(suggState.query).filter(x => !vistos.has(x.n));
    suggState.results = escolhidos.concat(resto).slice(0, 12);
    return;
  }
  const achou = mergeSearch((r.en || []).concat([suggState.query]));
  if(achou.length) suggState.results = achou;
}

function tsFor(date,hm){ const [y,m,dd]=date.split("-").map(Number); const [h,mi]=(hm||"12:00").split(":").map(Number); return new Date(y,m-1,dd,h,mi).getTime(); }
function shiftDay(date,n){ const [y,m,d]=date.split("-").map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return dt.getFullYear()+"-"+pad2(dt.getMonth()+1)+"-"+pad2(dt.getDate()); }
function dayLabel(date){ if(date===todayStr())return "Hoje · "+fmtDate(date); if(date===shiftDay(todayStr(),-1))return "Ontem · "+fmtDate(date); const wd=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"][new Date(date+"T00:00").getDay()]; return wd+" · "+fmtDate(date); }
