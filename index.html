function bodySorted(){ return db.body.filter(b=>typeof b.kg==="number").sort((a,b)=>a.date<b.date?-1:1); }
function weekKeyOf(date){ const d=new Date(date+"T00:00"); const off=(d.getDay()+6)%7; d.setDate(d.getDate()-off); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function weeklyWeight(){
  const map={}; bodySorted().forEach(b=>{ const k=weekKeyOf(b.date); (map[k]=map[k]||[]).push(b.kg); });
  return Object.keys(map).sort().map(k=>({week:k, avg:map[k].reduce((a,b)=>a+b,0)/map[k].length, n:map[k].length}));
}
/* tabela tipo planilha: uma linha por semana, um peso por dia e a média no fim */
const DOW = ["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
function dowIndex(date){ const d=new Date(date+"T00:00").getDay(); return (d+6)%7; }   // 0 = segunda
function weightTable(nWeeks){
  const rows = {};
  bodySorted().forEach(b=>{ const k=weekKeyOf(b.date); (rows[k]=rows[k]||{})[dowIndex(b.date)] = b.kg; });
  const keys = Object.keys(rows).sort().slice(-nWeeks).reverse();
  if(!keys.length) return `<div class="empty">Registre seu peso para ver a tabela da semana.</div>`;
  const avgOf = k => { const v=Object.values(rows[k]); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; };
  const body = keys.map((k,i)=>{
    const avg = avgOf(k);
    const prevK = keys[i+1];                       // semana anterior (a lista está do mais novo p/ o mais antigo)
    const diff = prevK ? avg - avgOf(prevK) : null;
    const cells = DOW.map((_,j)=>{ const v=rows[k][j];
      return `<td>${typeof v==="number"?fmtW(v):"<span class='nil'>–</span>"}</td>`; }).join("");
    return `<tr><th>${fmtDate(k)}</th>${cells}<td class="avg">${fmtW(avg)}</td>
      <td class="dl ${diff==null?"":diff<-0.005?"down":diff>0.005?"up":""}">${diff==null?"–":(diff>0?"+":"")+fmtW(diff)}</td></tr>`;
  }).join("");
  return `<div class="tblwrap"><table class="xls">
    <thead><tr><th>Semana de</th>${DOW.map(d=>`<th>${d}</th>`).join("")}<th class="avg">Média</th><th>Δ</th></tr></thead>
    <tbody>${body}</tbody></table></div>
    <div class="sub" style="margin-top:8px">Δ = diferença da média desta semana em relação à semana anterior.</div>`;
}

function measDelta(k,cur){
  const prev=[...db.body].filter(b=>b.date<cur.date && b.m && typeof b.m[k]==="number").sort((a,b)=>a.date<b.date?-1:1).pop();
  if(!prev) return "";
  const d=cur.m[k]-prev.m[k]; if(Math.abs(d)<0.05) return "";
  return ` <span class="${d>0?"up":"down"}" style="font-size:.72rem">${d>0?"+":""}${fmtW(d)}</span>`;
}
function drawWeightChart(series){
  const wrap=document.getElementById("wchart"); if(!wrap) return;
  const pts=series.map(b=>({d:b.date, v:b.kg}));
  if(pts.length<2){ wrap.innerHTML=""; return; }
  const W=360,H=170,L=42,R=14,T=14,B=24;
  let min=Math.min(...pts.map(p=>p.v)), max=Math.max(...pts.map(p=>p.v));
  if(min===max){min-=1;max+=1;} const pad=(max-min)*0.15; min-=pad; max+=pad;
  const X=i=>L+(W-L-R)*(i/(pts.length-1)), Y=v=>T+(H-T-B)*(1-(v-min)/(max-min));
  let grid=""; for(let k=0;k<=3;k++){ const v=min+(max-min)*k/3,y=Y(v); grid+=`<line class="gridline" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text class="axislbl" x="${L-6}" y="${y+3}" text-anchor="end">${fmtW(v)}</text>`; }
  const line=pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
  const area=`M${X(0).toFixed(1)} ${(H-B).toFixed(1)} `+pts.map((p,i)=>"L"+X(i).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ")+` L${X(pts.length-1).toFixed(1)} ${(H-B).toFixed(1)} Z`;
  let dots=""; pts.forEach((p,i)=>{ const last=i===pts.length-1; dots+=`<circle class="dot${last?" last":""}" cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${last?4:2.5}"/>`; if(last) dots+=`<text class="lastlbl" x="${Math.min(X(i),W-R-14)}" y="${Math.max(Y(p.v)-9,11)}" text-anchor="middle">${fmtW(p.v)}</text>`; });
  wrap.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução do peso">
    <defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--line)" stop-opacity="0.22"/><stop offset="1" stop-color="var(--line)" stop-opacity="0"/></linearGradient></defs>
    ${grid}<text class="axislbl" x="${L}" y="${H-7}">${fmtDate(pts[0].d)}</text><text class="axislbl" x="${W-R}" y="${H-7}" text-anchor="end">${fmtDate(pts[pts.length-1].d)}</text>
    <path d="${area}" fill="url(#wg)"/><path class="serie" d="${line}"/>${dots}</svg>`;
}

  HIGH_INTENSITY_INTERVAL_TRAINING:{l:"HIIT",e:"🔥",k:"cardio"}, BOOT_CAMP:{l:"Funcional",e:"🔥",k:"cardio"},
  BOXING:{l:"Boxe",e:"🥊",k:"cardio"}, MARTIAL_ARTS:{l:"Artes marciais",e:"🥋",k:"cardio"},
  SOCCER:{l:"Futebol",e:"⚽",k:"cardio"}, BASKETBALL:{l:"Basquete",e:"🏀",k:"cardio"},
  TENNIS:{l:"Tênis",e:"🎾",k:"cardio"}, VOLLEYBALL:{l:"Vôlei",e:"🏐",k:"cardio"},
  DANCING:{l:"Dança",e:"💃",k:"cardio"}, EXERCISE_CLASS:{l:"Aula",e:"🏫",k:"cardio"},
  GYMNASTICS:{l:"Ginástica",e:"🤸",k:"cardio"}, ROCK_CLIMBING:{l:"Escalada",e:"🧗",k:"cardio"},
  YOGA:{l:"Yoga",e:"🧘",k:"skip"}, PILATES:{l:"Pilates",e:"🧘",k:"skip"}, STRETCHING:{l:"Alongamento",e:"🤸",k:"skip"},
  GOLF:{l:"Golfe",e:"⛳",k:"skip"}, OTHER:{l:"Outro treino",e:"❓",k:"ask"}
};
function actInfo(t){ return ACT_TYPES[t] || {l:String(t||"Treino").replace(/_/g," ").toLowerCase(), e:"❓", k:"ask"}; }
/* recordingMethod do Health Connect: 2 = o relógio detectou sozinho (automático) */
function isAuto(a){ return !!a && a.rec === 2; }
/* a escolha do usuário é guardada por tipo; atividades automáticas têm chave própria,
   assim "caminhada automática" pode não contar sem afetar uma caminhada que você iniciou */
function actKey(a){ return isAuto(a) ? a.t + "#auto" : a.t; }
/* "ask" = o app não sabe se é musculação ou cardio; você decide tocando na etiqueta */
/* quando o Samsung manda o tipo genérico ("Outro exercício"), tenta adivinhar pelo nome do treino */
function guessByName(nome){
  const n = norm(nome);
  if(!n) return null;
  if(/muscula|aparelho|weight|strength|forca|halter|academia/.test(n)) return "musc";
  if(/bicicl|bike|cycl|spinning|corrida|running|caminhad|walk|eliptic|remo|rowing|nata|swim|escada|stair|hiit|funcional|esteira/.test(n)) return "cardio";
  return null;
}
function actKind(a){
  const m = db.settings.actMap || {};
  const key = typeof a === "string" ? a : actKey(a);
  if(m[key]) return m[key];
  if(typeof a === "object" && isAuto(a) && db.settings.ignoreAuto !== false) return "skip";
  const base = actInfo(typeof a === "string" ? a : a.t).k;
  if(base === "ask" && typeof a === "object"){
    const g = guessByName(a.nome); if(g) return g;
    /* O Samsung manda "Aparelhos musculação" como tipo genérico e muitas vezes SEM nome.
       Se foi VOCÊ que iniciou, conta como musculação — bike/corrida chegam com o tipo
       certo, então o genérico manual é a sua musculação. Toque na etiqueta p/ mudar. */
    if(!isAuto(a)) return "musc";
  }
  return base;
}
function deriveActs(e){
  if(!e) return;
  const acts = e.acts || [];
  if(!acts.length && !e.muscM && !e.cardioM && typeof e.cardioMinM !== "number") return;  // nada importado: preserva o registro manual
  let musc = !!e.muscM, cardio = !!e.cardioM, cmin = 0;
  acts.forEach(a => { const k = actKind(a);
    if(k === "musc") musc = true;
    else if(k === "cardio"){ cardio = true; cmin += a.min || 0; } });
  e.musc = musc; e.cardio = cardio;
  e.cardioMin = (typeof e.cardioMinM === "number") ? e.cardioMinM : (cmin || undefined);
}
function deriveAllActs(){ db.body.forEach(deriveActs); }
/* migração v11: o que já estava marcado à mão passa a ser "manual" e não é mais
   sobrescrito pela importação do Samsung Health */
function migrateManualActs(){
  if(db.settings.migAct11) return;
  db.body.forEach(b => {
    if(!b.acts || !b.acts.length){
      if(b.musc) b.muscM = true;

    }
    if(typeof b.kg === "number" && !b.kgSrc) b.kgSrc = "manual";   // peso digitado nunca é sobrescrito
  });
  db.settings.migAct11 = true;
  save(false);
}

async function importHealth(silent){

  if(!native.isNative || !H){ if(!silent) toast("Disponível só no app do celular 📱"); return; }

    const av = await H.isHealthAvailable();

    await H.requestHealthPermissions({permissions:["READ_STEPS","READ_WORKOUTS","READ_WEIGHT"]});
    db.settings.lastErr = null;                       // erro antigo não fica pendurado no 🔎
    /* se a permissão de PESO ficou de fora, avisa na lata — era o que estava travando */
    let wperm = null;
    try{ wperm = permMap(await H.checkHealthPermissions({permissions:["READ_WEIGHT"]})).READ_WEIGHT; }catch(e){}
    /* fica visível na tela de Evolução até ser resolvido — toast some rápido demais */
    db.settings.wDenied = (wperm === false && !!H.queryWeight);
    const start = new Date(); start.setDate(start.getDate()-59); start.setHours(0,0,0,0);   // 60 dias
    const end = new Date();
    let days=0, kgs=0;

      const sr = await H.queryAggregated({startDate:start.toISOString(), endDate:end.toISOString(), dataType:"steps", bucket:"day"});
      (sr.aggregatedData||[]).forEach(s=>{ if(s.value>0){ const e=bodyEntry(localDateOf(s.startDate)); e.steps=Math.round(s.value); days++; } });
    }catch(e){ console.warn("steps", e); }
    try{
      const wr = await H.queryWorkouts({startDate:start.toISOString(), endDate:end.toISOString(), includeHeartRate:false, includeRoute:false, includeSteps:false});
      const byDay = {};   // idempotente: cada importação REESCREVE as atividades do dia
      (wr.workouts||[]).forEach(w=>{
        const d = localDateOf(w.startDate);
        const t = String(w.workoutType || "OTHER").toUpperCase();
        let min = Math.round((Number(w.duration)||0)/60);
        if(!min && w.startDate && w.endDate) min = Math.round((new Date(w.endDate)-new Date(w.startDate))/60000);
        (byDay[d] = byDay[d] || []).push({t, min, src:(w.sourceName||w.deviceModel||""),
          rec:(typeof w.recordingMethod==="number"?w.recordingMethod:0),
          raw:(typeof w.exerciseTypeRaw==="number"?w.exerciseTypeRaw:null),
          nome:String(w.title||"")});
      });
      Object.keys(byDay).forEach(d => {
        const e = bodyEntry(d);
        e.acts = byDay[d];
        deriveActs(e);
      });
      const all = (wr.workouts || []);
      db.settings.lastImport = { when: Date.now(), workouts: all.length,
        types: [...new Set(all.map(w => String(w.workoutType || "OTHER")))].slice(0, 8),
        dias: Object.keys(byDay).length,
        det: all.slice(-16).map(w => ({d:localDateOf(w.startDate), t:String(w.workoutType||"OTHER"),
          min:Math.round((Number(w.duration)||0)/60), src:String(w.sourceName||w.deviceModel||""),
          rec:(typeof w.recordingMethod==="number"?w.recordingMethod:0),
          raw:(typeof w.exerciseTypeRaw==="number"?w.exerciseTypeRaw:null),
          nome:String(w.title||"")})) };
    }catch(e){ console.warn("workouts", e); db.settings.lastErr = "treinos: " + ((e&&e.message)||e); }
    kgs = await importWeights(H, start, end);
    save();
    /* não redesenha por cima de um campo que você está preenchendo (a sync roda sozinha) */
    const busy = document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if(!silent || (!busy && !modal.classList.contains("on"))) render();
    if(!silent){
      const lwx = db.settings.lastWeights || {};
      if(!H.queryWeight) toast("Passos e treinos ok — mas este APK ainda não lê peso. Instale a versão nova pelo botão Atualizar.");
      else if(wperm === false) toast("Falta permitir PESO no Health Connect — toque em 🔎 → Abrir Health Connect.");
      else if(!lwx.n) toast("Passos e treinos ok — mas o Health Connect não tem nenhuma pesagem. Toque em 🔎 → 🧪 Testar leitura de peso.");
      else toast(days||kgs ? `Importado do Samsung Health ✓ (${days} dia(s)${kgs?`, ${kgs} peso(s)`:""})` : "Sincronizado — nada novo por enquanto.");
    }
  }catch(err){ console.warn("health", err); db.settings.lastErr = "geral: " + ((err&&err.message)||err); save(false);
    if(!silent) toast("Não deu para importar. Verifique as permissões no Health Connect."); }
}
/* peso da balança (Yunmai -> Samsung Health -> Health Connect).
   Fica com a última pesagem de cada dia e guarda o que fez com CADA uma (res[]), para o
   🔎 conseguir dizer por que um peso que está no Health Connect não apareceu no app. */
async function importWeights(H, start, end){
  if(!H) return 0;
  /* o APK antigo não tem esse método nativo — sem isso não há como ler a balança */
  if(!H.queryWeight){ db.settings.lastWeights = {when:Date.now(), n:0, noMethod:true, det:[], res:[]}; return 0; }
  try{
    const r = await H.queryWeight({startDate:start.toISOString(), endDate:end.toISOString()});
    const list = r.weights || [];
    const from = db.settings.weightFrom || null;
    const byDay = {};
    list.forEach(w=>{ const d = localDateOf(w.time); if(!byDay[d] || byDay[d].time < w.time) byDay[d] = w; });
    const res = []; let n = 0;
    Object.keys(byDay).sort().forEach(d=>{
      const kg = Math.round(Number(byDay[d].kg)*100)/100;
      const src = String(byDay[d].deviceModel || byDay[d].sourceBundleId || "");
      const put = (act, antes) => res.push({d, kg, src, act, antes});
      if(from && d < from){ put("antes-da-data"); return; }         // só a partir da data escolhida
      if(!kg || kg < 20 || kg > 400){ put("fora-da-faixa"); return; }
      const e = bodyEntry(d);
      const manual = typeof e.kg === "number" && e.kgSrc !== "health";
      /* "a balança manda" ligado: o valor da balança substitui o digitado (o antigo fica
         registrado aqui no diagnóstico). Desligado: o que você digitou é preservado. */
      if(manual && db.settings.scaleWins === false){ put("bloqueado", e.kg); return; }
      if(e.kg === kg){ put("ja-estava"); return; }
      const antes = typeof e.kg === "number" ? e.kg : null;
      e.kg = kg; e.kgSrc = "health"; n++;
      put(manual ? "substituiu" : antes != null ? "atualizou" : "novo", antes);
    });
    db.settings.lastWeights = { when:Date.now(), n:list.length, aplicados:n,
      dias:Object.keys(byDay).length, res:res.slice(-14),
      det:list.slice(-10).map(w=>({d:localDateOf(w.time), kg:Math.round(Number(w.kg)*100)/100, src:String(w.deviceModel||w.sourceBundleId||"")})) };
    return n;
  }catch(e){ console.warn("weight", e); db.settings.lastErr = "peso: " + ((e&&e.message)||e);
    db.settings.lastWeights = {when:Date.now(), n:0, erro:((e&&e.message)||String(e)), det:[], res:[]}; return 0; }
}
/* teste ao vivo, sem filtro nenhum: lê 365 dias e mostra tudo que o Health Connect entrega.
   Serve para separar "não tem pesagem lá" de "tem, mas o app descartou". */

}
/* a resposta de permissões vem em formatos diferentes conforme a versão do plugin —
   normaliza tudo para {READ_STEPS:true/false, READ_WORKOUTS:true/false} */
function permMap(res){
  const out = {};
  const put = o => { if(o && typeof o === "object") Object.keys(o).forEach(k => {
    if(typeof o[k] === "boolean") out[k] = (out[k] === true) ? true : o[k]; }); };
  if(!res) return out;
  if(Array.isArray(res.permissions)) res.permissions.forEach(put);
  else put(res.permissions);
  put(res);
  return out;
}

}

async function autoHealthSync(force){

  if(!force && Date.now() - _lastAutoSync < 60000) return;    // no máximo 1x por minuto

    if(!st.available) return;
    // se qualquer permissão já está concedida, importa ao abrir o app
    if(Object.values(st.perms).some(v => v === true)){ _lastAutoSync = Date.now(); importHealth(true); }
  }catch(e){}
}

    if(!name){ toast("Escreva o alimento."); return; }
    const ts=tsFor(foodDay,time);
    if(el.dataset.id){ const f=db.food.find(x=>x.id===el.dataset.id); Object.assign(f,{name,meal,ts,kind,binge,planned,note}); }
    else db.food.push({id:uid(), date:foodDay, ts, name, meal, kind, binge, planned, note});
    save(); closeModal(); render();
  }
  else if(a === "del-food"){ db.food=db.food.filter(f=>f.id!==el.dataset.id); save(); render(); }
  else if(a === "plan-tick"){
    const m=db.plan.find(x=>x.id===el.dataset.m); if(!m) return;
    const it=m.items.find(x=>x.id===el.dataset.i); if(!it) return;
    it.done=it.done||{};
    const st=itemState(it,foodDay);
    if(st==="open"){ it.done[foodDay]=true; }                              // 1º toque: comi
    else if(st==="done"){ it.done[foodDay]="skip"; toast("Riscado — não vou comer"); }  // 2º toque: risca
    else { delete it.done[foodDay]; }                                       // 3º toque: volta pro aberto
    save(); render();
  }
  else if(a === "plan-all"){
    const m=db.plan.find(x=>x.id===el.dataset.m); if(!m) return;
    const marcar = el.dataset.v === "1";
    m.items.forEach(it=>{ it.done=it.done||{};
      if(marcar) it.done[foodDay]=true; else delete it.done[foodDay]; });
    save(); render();
    toast(marcar?`${m.name}: refeição inteira marcada ✓`:`${m.name}: desmarcada`);
  }
  else if(a === "plan-note"){
    const m=db.plan.find(x=>x.id===el.dataset.m); if(!m) return;
    const v=prompt(`Comentário para a refeição "${m.name}":`, m.note||"");
    if(v===null) return;
    m.note=v.trim()||undefined; save(); render();
  }
  else if(a === "meal-note"){
    const k=mealNoteKey(foodDay, el.dataset.n);
    db.mealNotes = db.mealNotes || {};
    const v=prompt(`Comentário para "${el.dataset.n}" em ${fmtDate(foodDay)}:`, db.mealNotes[k]||"");
    if(v===null) return;
    if(v.trim()) db.mealNotes[k]=v.trim(); else delete db.mealNotes[k];
    save(); render();
  }
  else if(a === "plan-item-note"){
    const m=db.plan.find(x=>x.id===el.dataset.m); if(!m) return;
    const it=m.items.find(x=>x.id===el.dataset.i); if(!it) return;
    const v=prompt(`Comentário para "${it.name}":`, it.note||"");
    if(v===null) return;
    it.note=v.trim()||undefined; save(); render();
  }
  else if(a === "food-fill"){ foodDay = el.dataset.d; location.hash = "#/food"; render(); }
  else if(a === "diet-dismiss"){
    db.settings.dietDismiss = Object.assign({}, db.settings.dietDismiss, {[el.dataset.d]:true});
    save(false); render();
  }
  else if(a === "add-urge"){ urgeForm(); }
  else if(a === "save-urge"){
    const intensity=+document.getElementById("u-int").value;
    const time=document.getElementById("u-time").value||nowHM();
    const gaveIn=document.getElementById("u-gave").checked;
    db.urges.push({id:uid(), date:foodDay, ts:tsFor(foodDay,time), intensity, gaveIn});
    save(); closeModal(); render();
    if(gaveIn) toast("Registrado. Amanhã é um novo dia 💪"); else toast("Boa — urge registrado, você resistiu! 💪");
  }
  else if(a === "del-urge"){ db.urges=db.urges.filter(u=>u.id!==el.dataset.id); save(); render(); }

  else if(a === "add-plan"){ planForm(null); }
  else if(a === "edit-plan"){ planForm(db.plan.find(m=>m.id===el.dataset.id)); }
  else if(a === "save-plan"){
    const name=document.getElementById("pf-name").value.trim();
    const time=document.getElementById("pf-time").value||"";
    const kind=document.getElementById("pf-kind").value;
    const fixed=document.getElementById("pf-fixed").checked;
    const note=(document.getElementById("pf-note").value||"").trim()||undefined;
    const items=document.getElementById("pf-items").value.split("\n").map(s=>s.trim()).filter(Boolean);
    if(!name){ toast("Dê um nome à refeição."); return; }
    if(el.dataset.id){
      const m=db.plan.find(x=>x.id===el.dataset.id);
      const old={}, oldNote={}; m.items.forEach(it=>{ old[it.name]=it.done||{}; oldNote[it.name]=it.note; });
      m.name=name; m.time=time; m.kind=kind; m.fixed=fixed; m.date=fixed?null:foodDay; m.note=note;
      m.items=items.map(n=>({id:uid(), name:n, done:old[n]||{}, note:oldNote[n]}));
    } else {
      db.plan.push({id:uid(), name, time, kind, fixed, note, created:todayStr(), date:fixed?null:foodDay, items:items.map(n=>({id:uid(), name:n, done:{}}))});
    }
    save(); closeModal(); render();
  }
  else if(a === "del-plan"){ if(!confirm("Excluir esta refeição do plano?")) return; db.plan=db.plan.filter(m=>m.id!==el.dataset.id); save(); render(); }
  else if(a === "copy-plan"){
    const prev=shiftDay(foodDay,-1);
    const src=db.plan.filter(m=>!m.fixed && m.date===prev);
    if(!src.length){ toast("Nada para copiar de ontem."); return; }
    src.forEach(m=>db.plan.push({id:uid(), name:m.name, time:m.time, kind:m.kind, fixed:false, date:foodDay, items:m.items.map(i=>({id:uid(), name:i.name, done:{}}))}));
    save(); render(); toast(`${src.length} refeição(ões) copiada(s) de ontem ✓`);
  }

  else if(a === "health-sync"){ closeModal(); toast("Conectando ao Health Connect…"); importHealth(false); }
  else if(a === "health-diag"){ healthDiagForm(); }
  else if(a === "open-hc"){ const H = native.plugin("HealthPlugin"); if(H){ try{ H.openHealthConnectSettings(); }catch(e){ toast("Não deu para abrir."); } } }
  else if(a === "w-ask"){
    const H = native.plugin("HealthPlugin"); if(!H) return;
    /* pede SÓ o peso: se o Health Connect não mostrar a tela, é porque a permissão foi
       negada de vez e só dá para religar nas configurações dele */
    H.requestHealthPermissions({permissions:["READ_WEIGHT"]}).then(async () => {
      const ok = permMap(await H.checkHealthPermissions({permissions:["READ_WEIGHT"]})).READ_WEIGHT;
      db.settings.wDenied = (ok === false); save(false);
      if(ok){ toast("Permissão de peso concedida ✓ importando…"); importHealth(false); }
      else toast("Continua negada — abra o Health Connect e ligue Peso para o Fitness Global.");
    }).catch(e => toast("Não deu para pedir: " + ((e&&e.message)||e)));
  }
  else if(a === "w-probe"){
    const box = document.getElementById("wprobe"); if(!box) return;
    box.innerHTML = `<div class="empty">Lendo o Health Connect…</div>`;
    weightProbe().then(p=>{
      if(!p.ok){ box.innerHTML = `<div class="empty" style="color:var(--bad)">${esc(p.msg)}</div>`; return; }
      box.innerHTML = p.n
        ? `<div class="sub" style="margin:8px 0 4px"><b>${p.n}</b> pesagem(ns) no Health Connect nos últimos 365 dias:</div>`
          + p.list.map(w=>`<div class="wkrow"><span class="wd">${fmtDate(w.d)} ${w.hm}</span>
             <span class="wv">${fmtW(w.kg)} kg</span><span class="wdelta" style="color:var(--muted); font-size:.72rem">${esc(w.src||"—")}</span></div>`).join("")
        : `<div class="empty" style="color:var(--bad)">O Health Connect não tem <b>nenhuma</b> pesagem. Então o problema não é o app: a Yunmai/Samsung não está gravando peso lá.<br><br>
           Confira em <b>Health Connect → Dados e acesso → Peso → Ver todas as entradas</b>. Se estiver vazio, vá no <b>Samsung Health → Configurações → Health Connect</b> e ligue <b>Peso</b>; depois abra o Samsung Health e faça uma pesagem nova.</div>`;
    });
  }
  else if(a === "cycle-act"){
    const key = el.dataset.k;
    const order = ["musc","cardio","skip"];
    let curK = (db.settings.actMap||{})[key];
    if(!curK){
      if(key.endsWith("#auto") && db.settings.ignoreAuto!==false) curK = "skip";
      else { curK = actInfo(key.replace(/#auto$/,"")).k; if(curK==="ask") curK = key.endsWith("#auto") ? "skip" : "musc"; }
    }
    const next = order[(order.indexOf(curK) + 1) % order.length] || "musc";
    db.settings.actMap = Object.assign({}, db.settings.actMap, {[key]: next});
    deriveAllActs(); save(); render();
    toast(next === "musc" ? "Passa a contar como musculação 🏋️" : next === "cardio" ? "Passa a contar como cardio 🏃" : "Não vai mais contar");
  }
  else if(a === "act-day"){ const n=+el.dataset.d; const d=shiftDay(actDay,n); if(d<=todayStr()) actDay=d; render(); }
  else if(a === "act-day-set"){ actDay = el.dataset.d; render(); }
  else if(a === "quick-train"){
    const e=bodyEntry(actDay); const k=el.dataset.t;
    e[k+"M"] = !e[k];            // marca manual: a importação do Samsung não apaga mais
    e[k] = !!e[k+"M"];
    deriveActs(e); save(); render();
  }
  else if(a === "save-activity"){
    const e=bodyEntry(actDay);
    const v=parseInt(document.getElementById("steps-today").value,10); e.steps=isNaN(v)?undefined:v;
    const cm=document.getElementById("cardiomin-today");
    if(cm){ const c=parseInt(cm.value,10); e.cardioMinM=isNaN(c)?undefined:c; e.cardioMin=e.cardioMinM; }
    deriveActs(e); save(); render(); toast("Salvo ✓");
  }
  else if(a === "body-entry"){ bodyForm(el.dataset.d || todayStr()); }
  else if(a === "save-body"){
    const date=document.getElementById("bf-date").value || el.dataset.orig;
    const kg=parseFloat(String(document.getElementById("bf-kg").value).replace(",","."));
    const bf=parseFloat(String(document.getElementById("bf-bf").value).replace(",","."));
    const note=document.getElementById("bf-note").value.trim();
    const m={}; MEAS.forEach(x=>{ const v=parseFloat(String(document.getElementById("bf-"+x.k).value).replace(",",".")); if(!isNaN(v)) m[x.k]=v; });
    const musc=document.getElementById("bf-musc").checked, cardio=document.getElementById("bf-cardio").checked;
    const steps=parseInt(document.getElementById("bf-steps").value,10);
    const cardioMin=parseInt(document.getElementById("bf-cardiomin").value,10);
    if(isNaN(kg) && isNaN(bf) && !Object.keys(m).length && !musc && !cardio && isNaN(steps)){ toast("Preencha ao menos o peso."); return; }
    let e=db.body.find(b=>b.date===date);
    if(!e){ e={id:uid(), date}; db.body.push(e); }
    e.kg = isNaN(kg)?undefined:kg; e.bf = isNaN(bf)?undefined:bf; e.m = m; e.note = note;
    if(!isNaN(kg)) e.kgSrc = "manual";          // peso digitado: a importação não sobrescreve
    e.muscM = musc; e.cardioM = cardio; e.cardioMinM = isNaN(cardioMin)?undefined:cardioMin;
    e.musc = musc; e.cardio = cardio; e.steps = isNaN(steps)?undefined:steps; e.cardioMin = isNaN(cardioMin)?undefined:cardioMin;
    deriveActs(e);
    // se mudou a data de um registro existente, remove o antigo
    if(el.dataset.orig && el.dataset.orig!==date){ db.body=db.body.filter(b=>!(b.date===el.dataset.orig && b.id!==e.id)); }
    save(); closeModal(); render();
  }
  else if(a === "del-body"){ if(!confirm("Excluir o registro deste dia?")) return; db.body=db.body.filter(b=>b.date!==el.dataset.d); save(); closeModal(); render(); }

  else if(a === "do-update"){
    if(native.isNative){
      try{ window.open(APK_URL, "_system"); }catch(e){ location.href = APK_URL; }
      alert("Baixando a nova versão…\n\n1) Abra a notificação de download e toque no arquivo\n2) Confirme a instalação (é por cima, não perde dados)\n3) Feche e abra o app — a versão nova entra sozinha");
    }
    else { toast("Atualizando…"); setTimeout(()=>location.reload(), 400); }
  }
  else if(a === "dismiss-update"){ const s=document.getElementById("updslot"); if(s) s.innerHTML=""; }
});

native.init();
normalizeOrders();
migrateManualActs();
migratePlan12();
deriveAllActs();
applyWake();
render();
Sync.start();
checkUpdate();
autoHealthSync();
document.addEventListener("visibilitychange", () => {
  if(!document.hidden){ checkUpdate(); autoHealthSync(); Sync.check(); }   // ao voltar pro app, confere a nuvem
});
</script>
</body>
</html>
