:root{
  --bg:#0E1311; --surface:#161D1A; --surface2:#1F2824; --border:#2B3731;
  --ink:#EEF3EF; --muted:#9DAAA3; --faint:#8E9B94;
  --accent:#C8F560; --accent-press:#B5E04A; --on-accent:#0E1311;
  --disp:"Barlow Condensed","Arial Narrow",sans-serif;
  --line:#4A90E2; --good:#46C08A; --bad:#E5604C; --gold:#F2B84B;
  --radius:14px;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{background:var(--bg); color:var(--ink);
  font-family:"Instrument Sans",-apple-system,"Segoe UI Variable","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  font-size:16px; line-height:1.45; min-height:100%;}
body{-webkit-tap-highlight-color:transparent;}
#app{max-width:540px; margin:0 auto; padding:0 14px 130px; min-height:100vh;}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer;}
input,select,textarea{font:inherit; color:var(--ink); background:var(--surface2);
  border:1px solid var(--border); border-radius:10px; padding:10px 12px; width:100%;}
textarea{min-height:104px; resize:vertical; font-size:.85rem; font-family:ui-monospace,Consolas,monospace;}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
input[type=number]{font-variant-numeric:tabular-nums;}

.topbar{display:flex; align-items:center; gap:10px; padding:18px 0 14px; position:sticky; top:0;
  background:linear-gradient(var(--bg) 78%, transparent); z-index:5;}
.topbar h1{font-family:var(--disp); font-size:1.9rem; line-height:1.05; font-weight:700; letter-spacing:.005em; flex:1; min-width:0;
  overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; text-wrap:balance;}
.brand{color:var(--accent);}
.iconbtn{width:40px; height:40px; border-radius:12px; background:var(--surface); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-size:1.1rem; flex:none;}
.iconbtn:active{background:var(--surface2);}
.sub{color:var(--muted); font-size:.85rem;}
.section{margin-top:22px;}
.section>h2{font-size:.78rem; text-transform:uppercase; letter-spacing:.09em; color:var(--muted);
  font-weight:700; margin-bottom:10px; display:flex; align-items:center; gap:8px;}
.section>h2 .cloud{margin-left:auto; text-transform:none; letter-spacing:0; font-weight:600; font-size:.72rem;}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:14px 16px; margin-bottom:10px;}
.row{display:flex; align-items:center; gap:12px;}
.row .grow{flex:1; min-width:0;}
.card.tap{cursor:pointer; transition:border-color .12s;}
.card.tap:active{border-color:var(--accent);}
.card h3{font-size:1.02rem; font-weight:700; letter-spacing:-.01em;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.chev{color:var(--faint); font-size:1.2rem; flex:none;}
.trendmini{font-size:1.25rem; flex:none;}
.notecard{background:color-mix(in srgb, var(--gold) 11%, var(--surface)); border-color:color-mix(in srgb, var(--gold) 38%, var(--border)); white-space:pre-wrap; font-size:.94rem; line-height:1.5; margin-top:12px;}
.reord{display:flex; gap:6px; flex:none;}
.ordbtn{width:42px; height:42px; border-radius:10px; background:var(--surface2); border:1px solid var(--border); font-size:1.15rem; font-weight:800; color:var(--ink);}
.ordbtn:disabled{opacity:.3;}
.ordbtn:active:not(:disabled){background:var(--accent); color:var(--on-accent);}

.pill{display:inline-flex; align-items:center; gap:5px; background:var(--surface2); border:1px solid var(--border);
  color:var(--muted); border-radius:999px; padding:3px 10px; font-size:.76rem; font-weight:600; white-space:nowrap;}
.pill.glob{color:var(--accent); border-color:color-mix(in srgb, var(--accent) 45%, var(--border));}
.pill.pr{color:var(--gold); border-color:color-mix(in srgb, var(--gold) 40%, var(--border));}
.pills{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
/* contador de séries feitas hoje (lista de exercícios) */
.setcount{flex:none; font-variant-numeric:tabular-nums; font-weight:800; font-size:.8rem; color:var(--faint);
  border:1px solid var(--border); border-radius:999px; padding:3px 9px; background:var(--surface2);}
.setcount.part{color:var(--gold); border-color:color-mix(in srgb, var(--gold) 45%, var(--border));}
.setcount.full{color:var(--good); border-color:color-mix(in srgb, var(--good) 45%, var(--border));}
/* comentários em refeições/alimentos */
.fnote{color:var(--muted); font-size:.75rem; font-weight:400; line-height:1.35;}

.btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
  background:var(--accent); color:var(--on-accent); font-weight:800; letter-spacing:.01em;
  border-radius:var(--radius); padding:14px; font-size:1rem;}
.btn:active{background:var(--accent-press);}
.btn.ghost{background:var(--surface); color:var(--ink); border:1px solid var(--border); font-weight:700;}
.btn.ghost:active{background:var(--surface2);}
.btn.danger{background:none; border:1px solid color-mix(in srgb, var(--bad) 55%, var(--border)); color:var(--bad);}
.btn.sm{padding:10px 12px; font-size:.9rem; border-radius:11px;}
.btnrow{display:flex; gap:8px;}
.btnrow .btn{width:auto; flex:1;}
.empty{color:var(--muted); font-size:.92rem; padding:22px 8px; text-align:center;}

/* séries */
.setrow{display:grid; grid-template-columns:34px 1fr 1fr 52px; gap:8px; align-items:center; margin-bottom:8px;}
.setrow .num{color:var(--muted); font-weight:700; text-align:center; font-variant-numeric:tabular-nums;}
.setrow input{text-align:center; padding:9px 6px; font-family:var(--disp); font-size:1.6rem; font-weight:700; border-radius:14px;}
.setrow .num{font-family:var(--disp); font-size:1.4rem;}
.setrow .ok{height:56px; border-radius:14px; background:var(--surface2); border:1px solid var(--border); display:grid; place-items:center;
  font-size:1.1rem; color:var(--muted);}
.setrow.done .ok{background:none; border:1px solid var(--border); color:var(--faint);}
.setrow .num.feito{color:var(--good); display:grid; place-items:center;}
.setrow.done .val{background:none; border:1px solid transparent; text-align:center; padding:11px 6px;
  font-variant-numeric:tabular-nums; color:var(--ink); font-weight:700;}
.sethead{display:grid; grid-template-columns:34px 1fr 1fr 52px; gap:8px; color:var(--faint);
  font-size:.72rem; text-transform:uppercase; letter-spacing:.07em; font-weight:700; text-align:center; margin-bottom:6px;}

/* barra de descanso */
/* fica ACIMA das abas: some da frente da navegação e continua visível em qualquer tela */
#restbar{position:fixed; left:8px; right:8px; bottom:calc(58px + env(safe-area-inset-bottom));
  z-index:40; display:none; border-radius:14px; overflow:hidden;
  background:var(--ink); color:var(--bg); border:0;
  box-shadow:0 10px 28px -6px rgba(0,0,0,.6); padding:10px 12px; border-radius:18px;}
#restbar.on{display:block;}
.restin{max-width:540px; margin:0 auto; display:flex; align-items:center; gap:10px;}
#resttime{font-family:var(--disp); font-size:2rem; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:-.02em;
  min-width:64px; color:var(--bg);}
.restlabel{flex:1; min-width:0; color:color-mix(in srgb, var(--bg) 70%, var(--ink)); font-weight:600; font-size:.76rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; cursor:pointer;}
.restbtn{border:0; background:color-mix(in srgb, var(--bg) 14%, var(--ink)); color:var(--bg); border-radius:12px;
  min-width:44px; height:44px; padding:0 10px; font-weight:700; font-size:.82rem; flex:none;}
.restbtn.skip{color:#B3261E;}
#restprog{position:absolute; top:-1px; left:0; height:2px; background:var(--accent); transition:width .25s linear;}

/* progressão */
.statushead{display:flex; align-items:center; gap:12px; margin-bottom:4px;}
.statushead .em{font-size:2rem; flex:none;}
.statushead .t{font-size:1.12rem; font-weight:800; letter-spacing:-.01em;}
.statushead .t.up{color:var(--good);} .statushead .t.down{color:var(--bad);} .statushead .t.flat{color:var(--muted);}
.bignum{font-size:1.5rem; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.01em;}
.bignum small{font-size:.85rem; font-weight:600; color:var(--muted);}
.deltatag{font-size:.85rem; font-weight:700;}
.deltatag.up{color:var(--good);} .deltatag.down{color:var(--bad);} .deltatag.flat{color:var(--muted);}
.seg{display:flex; gap:4px; background:var(--surface2); border:1px solid var(--border); border-radius:11px; padding:3px; margin:14px 0 6px;}
.seg button{flex:1; padding:8px 4px; border-radius:8px; font-size:.82rem; font-weight:700; color:var(--muted);}
.seg button.on{background:var(--accent); color:var(--on-accent);}
.metrichint{color:var(--muted); font-size:.78rem; margin:6px 2px 0;}
.chartwrap{position:relative; margin-top:8px;}
.chartwrap svg{width:100%; height:auto; display:block;}
.gridline{stroke:var(--border); stroke-width:1;}
.axislbl{fill:var(--faint); font-size:9.5px; font-variant-numeric:tabular-nums;}
.serie{stroke:var(--line); stroke-width:2; fill:none; stroke-linejoin:round; stroke-linecap:round;}
.area{fill:url(#grad);}
.dot{fill:var(--line); stroke:var(--surface); stroke-width:2;}
.dot.last{stroke-width:2.5;}
.star{fill:var(--gold); stroke:var(--surface); stroke-width:1.5;}
.lastlbl{fill:var(--ink); font-size:11px; font-weight:700; font-variant-numeric:tabular-nums;}
#tip{position:absolute; pointer-events:none; background:var(--surface2); border:1px solid var(--border);
  border-radius:9px; padding:6px 9px; font-size:.78rem; display:none; white-space:nowrap; z-index:6;
  font-variant-numeric:tabular-nums; box-shadow:0 4px 14px rgba(0,0,0,.4);}

.hist{border-bottom:1px solid var(--border); padding:10px 2px;}
.hist:last-child{border-bottom:none;}
.hist .d{color:var(--muted); font-size:.78rem; font-weight:700; margin-bottom:3px; display:flex; gap:6px; align-items:center;}
.hist .s{font-variant-numeric:tabular-nums; font-size:.92rem; color:var(--ink);}

/* modal */
#modal{position:fixed; inset:0; z-index:50; display:none; align-items:flex-end; justify-content:center;
  background:rgba(10,8,7,.62);}
#modal.on{display:flex;}
.sheet{background:var(--surface); border:1px solid var(--border); border-bottom:none;
  border-radius:20px 20px 0 0; width:100%; max-width:540px; padding:20px 18px calc(22px + env(safe-area-inset-bottom));
  max-height:86vh; overflow-y:auto;}
.sheet h2{font-size:1.15rem; font-weight:800; margin-bottom:14px; letter-spacing:-.01em;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:.8rem; color:var(--muted); font-weight:700; margin-bottom:5px;}
.field .hint{font-size:.76rem; color:var(--faint); margin-top:4px; font-weight:400;}
.check{display:flex; align-items:center; gap:10px; padding:12px; background:var(--surface2); border:1px solid var(--border); border-radius:11px; margin-bottom:12px; cursor:pointer;}
.check input{width:20px; height:20px; flex:none;}
.check .grow{flex:1;} .check .t{font-weight:700; font-size:.92rem;} .check .d{color:var(--muted); font-size:.78rem;}
.menuitem{display:flex; align-items:center; gap:12px; width:100%; padding:13px 6px; text-align:left;
  border-bottom:1px solid var(--border); font-size:.98rem; font-weight:600;}
.menuitem:last-child{border-bottom:none;}
.menuitem .mi{width:26px; text-align:center; flex:none;}
.menuitem.bad{color:var(--bad);}

.setline{display:flex; align-items:center; gap:12px; padding:13px 2px; border-bottom:1px solid var(--border);}
.setline:last-child{border-bottom:none;}
.setline .grow{flex:1;}
.setline .t{font-weight:700; font-size:.95rem;}
.setline .d{color:var(--muted); font-size:.8rem;}
.switch{width:46px; height:27px; border-radius:999px; background:var(--surface2); border:1px solid var(--border);
  position:relative; flex:none; transition:background .15s;}
.switch::after{content:""; position:absolute; top:2px; left:2px; width:21px; height:21px; border-radius:50%;
  background:var(--muted); transition:transform .15s, background .15s;}
.switch.on{background:var(--accent); border-color:var(--accent);}
.switch.on::after{transform:translateX(19px); background:var(--on-accent);}

.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:110px; z-index:60;
  background:var(--surface2); border:1px solid var(--border); color:var(--ink);
  padding:10px 16px; border-radius:12px; font-size:.88rem; font-weight:600;
  box-shadow:0 6px 20px rgba(0,0,0,.45); opacity:0; transition:opacity .2s; pointer-events:none; max-width:88%; text-align:center;}
.toast.on{opacity:1;}

/* celebração de recorde */
#pr{position:fixed; inset:0; z-index:70; display:none; align-items:center; justify-content:center;
  background:rgba(10,8,7,.55); padding:24px;}
#pr.on{display:flex;}
.prcard{background:linear-gradient(160deg, var(--surface2), var(--surface)); border:1px solid var(--gold);
  border-radius:20px; padding:26px 22px; text-align:center; max-width:340px; width:100%;
  box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 18%, transparent), 0 20px 50px rgba(0,0,0,.5);
  animation:pop .32s cubic-bezier(.2,1.3,.5,1);}
@keyframes pop{from{transform:scale(.7); opacity:0;} to{transform:scale(1); opacity:1;}}
.prcard .big{font-size:3.2rem; line-height:1;}
.prcard h2{font-size:1.35rem; font-weight:800; color:var(--gold); margin:10px 0 4px;}
.prcard p{color:var(--ink); font-size:1rem; margin-bottom:4px;}
.prcard .val{font-size:1.8rem; font-weight:800; font-variant-numeric:tabular-nums; margin:6px 0 16px;}
.prcard button{background:var(--gold); color:#2a1c00; font-weight:800; border-radius:12px; padding:12px; width:100%;}

@media (prefers-reduced-motion: reduce){*{transition:none !important; animation:none !important;}}

/* ===== barra de abas ===== */
#tabbar{position:fixed; left:0; right:0; bottom:0; z-index:35; display:flex;
  background:color-mix(in srgb, var(--surface) 96%, black); border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);}
#tabbar button{flex:1; padding:8px 2px 7px; display:flex; flex-direction:column; align-items:center; gap:2px;
  color:var(--faint); font-size:.72rem; font-weight:700; line-height:1.1;}
#tabbar button .ic{display:block; width:24px; height:24px;}
#tabbar button .ic svg{width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round;}
#tabbar button{padding:10px 2px 9px; gap:4px;}
#tabbar button.on{color:var(--accent);}
#app{padding-bottom:150px;}
body:has(#restbar.on) #app{padding-bottom:260px;}
.setrow.cur input{border:2px solid var(--accent);}
.okmark{color:var(--good); width:1em; height:1em; vertical-align:-.12em; margin-right:4px;}
.setrow.skipd .skiptxt{grid-column:span 2; text-align:center; color:var(--faint); font-weight:600; text-decoration:line-through; padding:14px 6px; border:1px dashed var(--border); border-radius:14px;}
.linkbtn{color:var(--muted); text-decoration:underline; font-weight:600; font-size:inherit; padding:2px 0;}
.firstun{background:color-mix(in srgb, var(--gold) 14%, var(--surface)); border:1px solid color-mix(in srgb, var(--gold) 45%, var(--border)); border-radius:14px; padding:10px 12px; font-size:.86rem; margin:0 0 12px; line-height:1.4;}
.ustrip{display:flex; gap:12px; align-items:center; margin:0 0 12px;}
.ustrip img{width:56px; height:56px; border-radius:14px; object-fit:cover; flex:none;}
details.hunit{margin:0 0 8px;}
.setrow.cur .ok{background:var(--accent); border-color:var(--accent); color:var(--on-accent);}
.goalx{margin:4px 0 16px;}
.goalx .gk{font-size:.82rem; font-weight:600; color:var(--muted);}
.goalx .gn{font-family:var(--disp); font-size:4.2rem; line-height:1; font-weight:700; margin:2px 0 0;}
.goalx .gn small{font-family:"Instrument Sans",sans-serif; font-size:1rem; font-weight:600; color:var(--muted); margin-left:8px;}
.goalx .gs2{font-size:.9rem; color:var(--muted); font-weight:600;}
.goalx .gh{font-size:.84rem; color:var(--muted); margin-top:2px;}
.seg{display:flex; gap:4px; overflow-x:auto; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:4px; margin:0 0 14px; scrollbar-width:none;}
.seg::-webkit-scrollbar{display:none;}
.seg button{flex:1 0 auto; padding:10px 14px; border-radius:10px; font-size:.84rem; font-weight:600; color:var(--muted); white-space:nowrap;}
.seg button.on{background:var(--accent); color:var(--on-accent);}
.hx{background:var(--accent); color:var(--on-accent); border-radius:22px; padding:18px; margin-bottom:20px;}
.hx .k{font-size:.82rem; font-weight:600; opacity:.78;}
.hx h2{font-family:var(--disp); font-size:1.95rem; font-weight:700; line-height:1.05; margin:4px 0 10px;}
.hx .meta{display:flex; gap:14px; font-size:.9rem; font-weight:600; margin-bottom:12px; flex-wrap:wrap;}
.hx .bar{height:6px; background:rgba(0,0,0,.16); border-radius:6px; margin-bottom:14px; overflow:hidden;}
.hx .bar i{display:block; height:100%; background:var(--on-accent); border-radius:6px;}
.hx .go{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; height:54px; border-radius:16px;
  background:var(--on-accent); color:var(--accent); font-weight:700; font-size:1rem; padding:0 14px; text-align:center;}
.hx .go svg{width:18px; height:18px; flex:none;}
.hx.calm{background:var(--surface); color:var(--ink); border:1px solid var(--border);}
.hx.calm .go{background:var(--accent); color:var(--on-accent);}
.ico{width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; flex:none; vertical-align:middle;}
.lr{display:flex; align-items:center; gap:12px; padding:14px 2px; border-top:1px solid var(--border); cursor:pointer;}
.lr:first-of-type{border-top:0;}
.lr .t{flex:1; min-width:0;}
.lr .t b{display:block; font-size:1.02rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.lr .t span{font-size:.83rem; color:var(--muted);}
.lr .t span b{display:inline; font-size:.83rem; color:var(--ink); font-weight:600; white-space:normal;}
.lr:active{background:var(--surface);}
.gt{font-family:var(--disp); font-size:1.3rem; font-weight:700; margin:18px 0 2px;}
.chipbar{display:flex; gap:8px; overflow-x:auto; padding:2px 0 12px; scrollbar-width:none;}
.chipbar::-webkit-scrollbar{display:none;}
.chipb{flex:none; padding:9px 14px; border-radius:999px; background:var(--surface2); font-size:.85rem; font-weight:600; color:var(--ink);}
.chipb.on{background:var(--accent); color:var(--on-accent);}
.chipb.sec{background:none; border:1px solid var(--border); color:var(--muted); padding:7px 12px; font-size:.8rem;}
.chipb.sec.on{background:var(--accent); border-color:var(--accent); color:var(--on-accent);}
.sbox{display:flex; align-items:center; gap:10px; height:50px; border-radius:14px; background:var(--surface); border:1px solid var(--border); padding:0 14px; margin-bottom:12px; color:var(--muted);}
.sbox input{background:none; border:none; padding:0; height:100%; font-size:1rem;}
.sbox input:focus{outline:none;}
.sbox:focus-within{border-color:var(--accent);}
.exline{display:flex; flex-wrap:wrap; gap:2px 6px; align-items:center; margin:-2px 0 10px; font-size:.82rem; color:var(--muted);}
.exline b{font-size:.9rem;}
details.evo{margin-top:6px;}
details.evo>summary{cursor:pointer; list-style:none; padding:12px 14px; border:1px solid var(--border); border-radius:14px; font-weight:700; color:var(--ink); background:var(--surface);}
details.evo>summary::-webkit-details-marker{display:none;}
details.evo[open]>summary{margin-bottom:8px;}

/* ===== alimentação ===== */
.daynav{display:flex; align-items:center; gap:8px; margin:2px 0 4px;}
.daynav .d{flex:1; text-align:center; font-weight:800; font-size:1.02rem;}
.daynav .navb{width:38px; height:38px; border-radius:11px; background:var(--surface); border:1px solid var(--border); font-size:1.1rem; flex:none;}
.mealcard{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:10px; overflow:hidden;}
.mealhead{display:flex; align-items:center; gap:8px; padding:11px 14px; border-bottom:1px solid var(--border);}
.mealhead .mt{font-weight:800; font-size:1rem; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.mealhead .tm{color:var(--muted); font-size:.82rem; font-variant-numeric:tabular-nums; flex:none;}
.kindtag{font-size:.68rem; font-weight:800; padding:2px 8px; border-radius:999px; flex:none;}
.kindtag.refeicao{background:color-mix(in srgb, var(--line) 22%, var(--surface)); color:var(--line);}
.kindtag.lanche{background:color-mix(in srgb, var(--gold) 20%, var(--surface)); color:var(--gold);}
.fooditem{display:flex; align-items:center; gap:10px; padding:9px 14px; border-bottom:1px solid var(--border); font-size:.94rem;}
.fooditem:last-child{border-bottom:none;}
.fooditem .fn{flex:1; min-width:0;}
.fooditem.eaten .fn{color:var(--ink);}
.fooditem.pending .fn{color:var(--muted);}
.fchip{font-size:.64rem; font-weight:800; padding:2px 7px; border-radius:999px; flex:none;}
.fchip.binge{background:color-mix(in srgb, var(--bad) 24%, var(--surface)); color:var(--bad);}
.fchip.outside{background:color-mix(in srgb, var(--gold) 22%, var(--surface)); color:var(--gold);}
.fchip.skip{background:var(--surface2); color:var(--faint);}
.fchip.qty{background:var(--surface2); color:var(--muted); cursor:pointer;}
.fchip.qtydiff{background:color-mix(in srgb, var(--gold) 22%, var(--surface)); color:var(--gold); cursor:pointer;}
.fchip.pend{background:var(--surface2); color:var(--muted);}
.fooditem.skipped .fn{color:var(--faint); text-decoration:line-through;}
/* refeição livre: dourada e fora da conta da dieta */
.fchip.free{background:color-mix(in srgb, var(--gold) 26%, var(--surface)); color:var(--gold);}
.fooditem.freeitem{background:color-mix(in srgb, var(--gold) 7%, transparent);}
.fooditem.freeitem .fn{color:var(--ink);}
.mealcard.freemeal{border-color:color-mix(in srgb, var(--gold) 50%, var(--border));}
.xbtn.free{color:var(--gold); border-color:color-mix(in srgb, var(--gold) 45%, var(--border));
  background:color-mix(in srgb, var(--gold) 12%, transparent);}
/* calorias e macros */
.fchip.nutri-ok{background:var(--surface2); color:var(--muted); cursor:pointer;}
.fchip.nutri-pend{background:color-mix(in srgb, var(--gold) 22%, var(--surface)); color:var(--gold); cursor:pointer;}
.fchip.nutri-tot{background:var(--surface2); color:var(--ink);}
.nutri{font-size:.7rem; color:var(--faint); margin-top:2px;}
.macrobar{display:flex; height:9px; border-radius:999px; overflow:hidden; background:var(--surface2);}
.macrobar span{display:block; height:100%;}
.macrobar .p{background:var(--good);} .macrobar .c{background:var(--gold);} .macrobar .g{background:var(--bad);}
.ftick{width:34px; height:34px; border-radius:9px; background:var(--surface2); border:1px solid var(--border); flex:none; font-size:1rem; color:var(--muted);}
.ftick.on{background:color-mix(in srgb, var(--good) 22%, var(--surface)); border-color:var(--good); color:var(--good);}
.ftick.no{background:var(--surface2); border-color:var(--faint); color:var(--faint);}

/* tabela de peso semana a semana (tipo planilha) */
.tblwrap{overflow-x:auto; -webkit-overflow-scrolling:touch;}
table.xls{border-collapse:collapse; width:100%; min-width:430px; font-size:.82rem; font-variant-numeric:tabular-nums;}
table.xls th, table.xls td{border:1px solid var(--border); padding:6px 4px; text-align:center; white-space:nowrap;}
table.xls thead th{background:var(--surface2); color:var(--muted); font-size:.7rem; font-weight:800;}
table.xls tbody th{background:var(--surface2); color:var(--faint); font-weight:700; font-size:.74rem; text-align:left; padding-left:8px;}
table.xls td.avg, table.xls th.avg{background:color-mix(in srgb, var(--accent) 12%, var(--surface)); font-weight:800;}
table.xls td .nil{color:var(--faint);}
table.xls td.dl{color:var(--muted); font-weight:700;}
table.xls td.dl.up{color:var(--good);} table.xls td.dl.down{color:var(--bad);}   /* média subiu = verde, caiu = vermelho */
.xbtn{width:32px;height:32px;border-radius:9px;background:none;border:1px solid var(--border);color:var(--bad);flex:none;font-size:.95rem;}
.xbtn.wide{width:auto; padding:0 10px; color:var(--muted); font-size:.74rem; font-weight:800;}
.xbtn.wide.on{color:var(--good); border-color:color-mix(in srgb, var(--good) 45%, var(--border)); background:color-mix(in srgb, var(--good) 10%, transparent);}
/* estado do exercício HOJE: o que falta fica normal, o feito some um pouco e o pulado
   fica claramente de lado — todos vão para o fim da lista */
.card.ex-done{border-color:color-mix(in srgb, var(--good) 40%, var(--border)); opacity:.72;}
.card.ex-done h3{color:var(--good);}
.card.ex-skip{opacity:.5; border-style:dashed;}
.card.ex-skip h3{color:var(--faint); text-decoration:line-through;}
.card.ex-doing{border-color:var(--accent); box-shadow:0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent);}
/* meta do dia (progressão de carga) */
.goalcard{background:var(--surface); border:1px solid color-mix(in srgb, var(--accent) 40%, var(--border));
  border-radius:var(--radius); padding:12px 14px; margin-bottom:10px;}
.goalcard.up{border-color:color-mix(in srgb, var(--good) 50%, var(--border));}
.goalcard .gh{font-size:.95rem; font-weight:800; color:var(--ink);}
.goalcard .gm{font-size:.84rem; color:var(--muted); margin-top:4px;}
.goalcard .gs{font-size:.76rem; color:var(--faint); margin-top:6px; line-height:1.35;}
.goalcard.up .gh{color:var(--good);}
.card.gymfocus{border-color:var(--accent); box-shadow:0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent);}
.focusline{font-size:.72rem; font-weight:800; color:var(--accent); margin-top:2px;}
.wkdone{border-color:color-mix(in srgb, var(--good) 45%, var(--border)) !important;}
.dpbar{position:relative; height:20px; border-radius:999px; background:var(--surface2); overflow:hidden; margin:8px 0 6px;}
.dpfill{height:100%; background:color-mix(in srgb, var(--accent) 55%, transparent); transition:width .25s;}
.dpfill.full{background:color-mix(in srgb, var(--good) 62%, transparent);}
.dptxt{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-size:.68rem; font-weight:800; color:var(--text); letter-spacing:.02em;}
/* dica da serie pendente: fica FORA do grid .setrow (e irma dele), entao e bloco normal
   com recuo igual a coluna do numero */
.setlast{font-size:.68rem; color:var(--faint); padding:0 0 8px 42px; margin-top:-5px;}
.setlast b{color:var(--muted);}

<script>
"use strict";
/* ===================== config ===================== */
/* Preenchido automaticamente ao configurar a sincronização (Firebase).
   Se estiver aqui, o app já conecta na nuvem e você só define um "código". */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAsgfVOSegGbYD559_mq_9ubdDcLOUBp08",
  authDomain: "fitness-global.firebaseapp.com",
  projectId: "fitness-global",
  storageBucket: "fitness-global.firebasestorage.app",
  messagingSenderId: "882333150773",
  appId: "1:882333150773:web:79880305549b1975bc8b7c"
};

/* Versão que VOCÊ vê (1.0, 1.1, 2.0…) e o número de build usado só para comparar se há
   atualização. São dois porque o Android exige um inteiro crescente (versionCode) e
   porque o app instalado compara com Number() — trocar por "2.1" faria a versão antiga
   achar que 2.1 < 21 e nunca mais oferecer atualização. Mesma ideia do
   versionName/versionCode do Android. Regra: mudança grande sobe o primeiro número. */
const APP_NAME_VERSION = "6.0";
const APP_VERSION = 60;
const VERSION_URL = "https://pedrohsml31.github.io/fitness-global/version.json";
const APK_URL = "https://pedrohsml31.github.io/fitness-global/dist/fitness-global.apk";
/* mesmo app pelo navegador do PC — instalavel como aplicativo (PWA) */
const WEB_URL = "https://pedrohsml31.github.io/fitness-global/";
/* ===================== atualização sozinha =====================
   Quase toda versão só muda o conteúdo web. Nesse caso o app baixa os arquivos novos,
   grava numa pasta dele e passa a servir de lá — sem você baixar nem instalar nada.
   A ORIGEM do WebView continua https://localhost, então o localStorage NÃO é apagado
   (é por isso que nunca se aponta o server.url para outro domínio).

   Quando a versão nova mexe em código nativo (permissão, plugin), OTA não resolve: aí
   o app baixa o APK sozinho e abre o instalador, restando um toque em "Instalar".
   O version.json diz qual é o caso pelo campo minNative: o menor build NATIVO capaz de
   rodar aquele conteúdo web. */
const updater = () => native.plugin("Updater");
let nativeBuildCache = null;
async function nativeBuild(){
  if(nativeBuildCache !== null) return nativeBuildCache;
  const U = updater();
  if(U){ try{ const i = await U.info(); nativeBuildCache = Number(i.nativeBuild) || 0; return nativeBuildCache; }catch(e){} }
  /* sem o plugin (versão antiga do APK), o build nativo é o do próprio index.html */
  nativeBuildCache = native.isNative ? APP_VERSION : 0;
  return nativeBuildCache;
}
let updating = false;
async function checkUpdate(){
  try{
    const r = await fetch(VERSION_URL + "?cb=" + Date.now(), {cache:"no-store"});
    if(!r.ok) return;
    const j = await r.json();
    if(!j || !(Number(j.version) > APP_VERSION)) return;
    if(updating) return;
    const nb = await nativeBuild();
    /* dá para atualizar só o web? então faz agora, sozinho */
    if(native.isNative && updater() && Number(j.minNative || 0) <= nb){ otaUpdate(j); return; }
    showUpdate(j);
  }catch(e){}
}
const OTA_FLAG = "fitglobal.ota.aplicando";
async function otaUpdate(j){
  const U = updater(); if(!U){ showUpdate(j); return; }
  updating = true;
  try{
    const base = WEB_URL;
    const files = (Array.isArray(j.files) && j.files.length) ? j.files : ["index.html"];
    const txt = {};
    for(const f of files){
      const r = await fetch(base + f + "?cb=" + Date.now(), {cache:"no-store"});
      if(!r.ok) throw new Error(f + ": HTTP " + r.status);
      txt[f] = await r.text();
    }
    /* o index novo precisa ser mesmo o novo — senão o cache do CDN nos faria aplicar a
       mesma versão de novo, em loop */
    const m = /APP_VERSION\s*=\s*(\d+)/.exec(txt["index.html"] || "");
    if(txt["index.html"] && (!m || Number(m[1]) !== Number(j.version))){
      /* o version.json já virou mas o arquivo no CDN ainda é o velho. Não é erro nem é
         caso de APK: no próximo boot o arquivo certo estará lá. */
      updating = false;
      return;
    }
    toast(`Atualizando para a v${j.name || j.version}…`);
    const st = await U.stage();
    if(!st || !st.ok) throw new Error((st && st.erro) || "não preparou a pasta");
    for(const f of files){
      const w = await U.write({name:f, data:txt[f]});
      if(!w || !w.ok) throw new Error(f + ": " + ((w && w.erro) || "não gravou"));
    }
    try{ localStorage.setItem(OTA_FLAG, j.name || String(j.version)); }catch(e){}
    const a = await U.activate({version: Number(j.version)});
    if(!a || !a.ok) throw new Error((a && a.erro) || "não trocou a versão");
    /* daqui o app recarrega sozinho na versão nova */
  }catch(e){
    updating = false;
    try{ localStorage.removeItem(OTA_FLAG); }catch(e2){}
    toast("Não deu para atualizar sozinho: " + (e.message || e));
    showUpdate(j);
  }
}
/* logo depois de abrir: confirma que a versão nova subiu de pé. Sem esta confirmação,
   o próximo boot desfaz a atualização e volta para a que veio no APK — é a rede de
   segurança contra uma versão que abre em branco. */
function otaConfirm(){
  const U = updater(); if(!U) return;
  try{ U.confirm(); }catch(e){}
  let veio = null;
  try{ veio = localStorage.getItem(OTA_FLAG); localStorage.removeItem(OTA_FLAG); }catch(e){}
  if(veio) setTimeout(()=>toast(`Atualizado para a v${APP_NAME_VERSION} ✓`), 800);
}
/* baixa o APK dentro do próprio app e abre o instalador do Android */
let apkOff = null;
async function apkUpdate(){
  const U = updater();
  if(!U){ toast("Abra o link do APK nos Ajustes."); return; }
  const perm = await U.canInstall();
  if(!perm || !perm.ok){
    openModal(`<h2>⬆️ Falta uma permissão do Android</h2>
      <p class="sub" style="margin-bottom:12px">Para o app se instalar sozinho, o Android pede que você
      autorize o <b>Fitness Global</b> a instalar aplicativos. É uma vez só.</p>
      <p class="sub" style="margin-bottom:14px; font-size:.78rem">Na tela que vai abrir, ligue
      <b>"Permitir desta fonte"</b> e volte para cá.</p>
      <button class="btn" data-action="apk-perm">Abrir a tela da permissão</button>
      <button class="btn ghost" data-action="apk-link" style="margin-top:8px">Prefiro baixar pelo navegador</button>`);
    return;
  }
  openModal(`<h2>⬆️ Baixando a versão nova</h2>
    <div class="sub" id="apk-msg" style="margin-bottom:10px">Começando…</div>
    <div style="height:8px; background:var(--surface2); border-radius:999px; overflow:hidden">
      <div id="apk-bar" style="height:100%; width:0%; background:var(--accent); transition:width .2s"></div>
    </div>`);
  try{ if(apkOff && apkOff.remove) apkOff.remove(); }catch(e){}
  apkOff = await U.addListener("apkProgress", ev => {
    const b = document.getElementById("apk-bar"), m = document.getElementById("apk-msg");
    if(b) b.style.width = (ev.pct || 0) + "%";
    if(m) m.textContent = `${ev.pct || 0}% — ${((ev.bytes||0)/1048576).toFixed(1)} MB de ${((ev.total||0)/1048576).toFixed(1)} MB`;
  });
  const r = await U.downloadApk({url: APK_URL + "?cb=" + Date.now()});
  try{ if(apkOff && apkOff.remove) apkOff.remove(); }catch(e){}
  apkOff = null;
  if(!r || !r.ok){
    const m = document.getElementById("apk-msg");
    if(m) m.innerHTML = `Não deu para baixar: ${esc(String((r&&r.erro)||"erro"))}.<br>
      <button class="btn ghost sm" data-action="apk-link" style="width:auto; margin-top:10px">Baixar pelo navegador</button>`;
    return;
  }
  const m = document.getElementById("apk-msg");
  if(m) m.innerHTML = `Baixado ✓ — agora toque em <b>Instalar</b> na tela do Android.
    <div class="sub" style="margin-top:6px; font-size:.76rem">Instala por cima, sem perder dados.</div>`;
  await U.installApk();
}
function showUpdate(j){
  const slot = document.getElementById("updslot"); if(!slot) return;
  /* no APK o botão é um LINK de verdade: o WebView entrega .apk ao navegador do sistema
     sozinho. O window.open("_system") que havia aqui às vezes não abria nada e o toque
     parecia não fazer efeito — daí o link visível e o "copiar link" logo abaixo. */
  slot.innerHTML = `<div class="updbanner">
    <span style="font-size:1.3rem">⬆️</span>
    <div class="grow"><b>Atualização disponível — v${APP_NAME_VERSION} → v${esc(j.name || j.version)}</b>
      <div class="sub">${j.notes ? esc(j.notes) : "Nova versão do app."}</div>
      ${native.isNative ? `<div class="sub" style="margin-top:6px">${updater()
        ? "Esta versão mexe no app por dentro, então o Android pede um toque em <b>Instalar</b>."
        : `Não abriu o download? <span data-action="upd-copy" style="color:var(--accent); font-weight:700; text-decoration:underline; cursor:pointer">copie o link</span> e cole no Chrome.`}</div>` : ""}</div>
    ${native.isNative
      ? (updater()
          ? `<button class="btn sm" style="width:auto" data-action="apk-go">Atualizar</button>`
          : `<a class="btn sm" href="${APK_URL}" target="_blank" rel="noopener" data-action="upd-tip"
               style="width:auto; text-decoration:none">Atualizar</a>`)
      : `<button class="btn sm" style="width:auto" data-action="do-update">Atualizar</button>`}
    <button class="xbtn" data-action="dismiss-update" aria-label="Dispensar">✕</button></div>`;
}
/* copiar para a área de transferência funcionando também em WebView sem permissão */
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){}
  try{
    const ta = document.createElement("textarea");
    ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy"); ta.remove(); return ok;
  }catch(e){ return false; }
}

/* padrões de vibração (duração/pulsos em ms) */
const VIBE = { suave:[230], media:[400,140,400], forte:[600,130,600,130,600] };
function vibePattern(){ return VIBE[db.settings.vibe] || VIBE.media; }

/* ===================== dados ===================== */
const LS = "fitglobal.v1";
function seed(){ return {gyms:[], exercises:[], routines:[], logs:[], food:[], urges:[], plan:[], body:[], sessions:[], ideas:[], ach:{}, mealNotes:{}, free:{}, foodMap:{}, settings:{sound:false, soundLen:"medio", autoRest:true, wake:false, vibe:"media", sync:null, weightFrom:"2026-07-20", actFrom:null, ignoreAuto:true, scaleWins:true, freeWeek:0, macros:false, mealNotif:false, restOverlay:false, soundSpk:false, unitOf:{}, oneGroup:true, groupView:false, goals:{}, achInit:false, focus:null, doneDay:{}, kgFrom:null, exLang:"pt"}, updatedAt:0}; }
/* duração do bipe de fim de série (mesmo som, só mais longo) */
const SOUNDLEN = { curto:0.45, medio:1.1, longo:2.4 };
let db;
try{ db = Object.assign(seed(), JSON.parse(localStorage.getItem(LS)) || {}); }
catch(e){ db = seed(); }
db.settings = Object.assign(seed().settings, db.settings || {});

let _saveT = null;
function save(touch){
  if(touch !== false) db.updatedAt = Date.now();
  localStorage.setItem(LS, JSON.stringify(db));
  clearTimeout(_saveT);
  _saveT = setTimeout(() => Sync.push(), 700);
  /* toda gravação pode ter destravado medalha: confere 1,5 s depois (uma vez só,
     mesmo que várias gravações aconteçam juntas) e avisa na hora */
  clearTimeout(_achT);
  _achT = setTimeout(() => { try{ checkAch(); }catch(e){} }, 1500);
}
let _achT = null;
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36);
function todayStr(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function fmtDate(iso){ const [y,m,d] = iso.split("-"); return d + "/" + m + "/" + y.slice(2); }
function daysBetween(a,b){ return Math.abs((new Date(b) - new Date(a)) / 86400000); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtNum(n){ return (Math.round(n*10)/10).toLocaleString("pt-BR"); }
/* peso registrado: mostra exatamente o que foi digitado, sem arredondar */
function fmtW(n){ return Number(n).toLocaleString("pt-BR", {maximumFractionDigits: 3}); }

const gymById = id => db.gyms.find(g => g.id === id);
const exById  = id => db.exercises.find(e => e.id === id);
/* ---- nome do exercício em português ou inglês ----
   Quando o exercício vem do catálogo, o app guarda os DOIS nomes (namePt e nameEn) junto.
   O botão PT/EN não renomeia nada: só troca qual dos dois aparece, em todo lugar de uma
   vez. Exercício que você criou na mão e não está no catálogo continua com o seu nome. */
function exLang(){ return db.settings.exLang === "en" ? "en" : "pt"; }
function exName(e){
  if(!e) return "";
  const l = exLang();
  if(l === "en" && e.nameEn) return e.nameEn;
  if(l === "pt" && e.namePt) return e.namePt;
  return e.name || "";
}
/* o outro nome, para mostrar embaixo em letra miúda */
function exNameAlt(e){
  if(!e || !e.namePt || !e.nameEn) return "";
  const outro = exLang() === "en" ? e.namePt : e.nameEn;
  return outro === exName(e) ? "" : outro;
}
function exLangPill(){
  return `<button class="pill" data-action="ex-lang" style="cursor:pointer" title="Trocar os nomes dos exercícios entre português e inglês">🌐 ${exLang() === "en" ? "EN" : "PT"}</button>`;
}

function gymExercises(gymId){
  return db.exercises.filter(e => e.gymId === gymId || e.gymId === null)
    .sort((a,b) => (a.order ?? 1e9) - (b.order ?? 1e9) || a.name.localeCompare(b.name, "pt-BR"));
}
function nextOrder(){ return db.exercises.reduce((m,e) => (typeof e.order === "number" && e.order > m) ? e.order : m, 0) + 10; }
function normalizeOrders(){
  const missing = db.exercises.filter(e => typeof e.order !== "number");
  if(!missing.length) return;
  let base = db.exercises.reduce((m,e) => (typeof e.order === "number" && e.order > m) ? e.order : m, 0);
  missing.sort((a,b) => a.name.localeCompare(b.name, "pt-BR")).forEach((e,i) => e.order = base + (i+1)*10);
  save();
}
function exLogs(exId){
  return db.logs.filter(l => l.exerciseId === exId && l.sets.length)
    .sort((a,b) => a.date < b.date ? -1 : 1);
}
/* ---------- unidades (filiais) da mesma academia ----------
   Você treina na Smart Fit, mas em 4-5 unidades, e a MESMA máquina pega carga diferente
   em cada uma. Criar uma academia por unidade obrigaria a recriar todo exercício em
   cada uma e partiria o histórico.

   Aqui a academia tem unidades por dentro. O exercício continua UM só; quem muda é de
   onde o app lê a carga: o exercício marcado como "a carga muda de unidade para
   unidade" passa a enxergar só as sessões da unidade onde você está. Halteres não
   mudam de academia para academia — esses ficam sem a marca e seguem com um histórico
   só, como sempre foi.

   Cada série registrada carimba a unidade (l.u), então o histórico antigo continua
   valendo: sem carimbo, entra em qualquer leitura. */
/* ---------- grupo muscular do exercício ----------
   Base de três coisas: ver o treino agrupado, a regra "1 exercício por grupo por treino"
   do full body, e as medalhas. A lista é a mesma dos treinos prontos. */
const GRUPOS = ["Peito","Costas","Ombro","Bíceps","Tríceps","Quadríceps","Posterior","Glúteo","Panturrilha","Antebraço","Abdômen"];
/* músculo do catálogo free-exercise-db -> grupo. Só o que bate sem dúvida: adutor,
   abdutor, lombar, trapézio e pescoço ficam sem grupo para você escolher. */
const MUS2GRP = {chest:"Peito", lats:"Costas", "middle back":"Costas", shoulders:"Ombro",
  biceps:"Bíceps", triceps:"Tríceps", quadriceps:"Quadríceps", hamstrings:"Posterior",
  glutes:"Glúteo", calves:"Panturrilha", forearms:"Antebraço", abdominals:"Abdômen"};
function grpOf(e){ return (e && e.grp) || ""; }
/* os treinos prontos guardavam o grupo só no texto da observação ("Peito · ChatGPT").
   Isto tira de lá, uma vez — é dado seu, não chute. */
function migrateGroups40(){
  if(db.settings.migGrp40) return;
  db.exercises.forEach(e => {
    if(e.grp || !e.notes) return;
    const m = String(e.notes).match(/^([^·]+)\s·\s/);
    if(m && GRUPOS.includes(m[1].trim())) e.grp = m[1].trim();
  });
  /* treino C do "Shape estético": você definiu 3 séries de ombro, então o Reverse fly
     (2º exercício de ombro) sai do TREINO. O exercício e o histórico dele ficam. */
  (db.routines || []).forEach(r => {
    if(!/^C — V-taper \+ braços/.test(r.name || "")) return;
    r.exIds = (r.exIds || []).filter(id => { const x = exById(id); return !(x && norm(x.name) === norm("Reverse fly")); });
  });
  db.settings.migGrp40 = true;
  save(false);
}
/* exercício global (🌐) que você JÁ COMEÇOU hoje em outra academia: some das demais */
function globalBusyElsewhere(e, gymId){
  if(!e || e.gymId !== null) return false;
  return db.logs.some(l => l.exerciseId === e.id && l.date === todayStr() && l.sets.length && l.gymId && l.gymId !== gymId);
}

function gymUnits(gymId){ const g = gymById(gymId); return (g && g.units) || []; }
function unitNow(gymId){
  const us = gymUnits(gymId);
  if(!us.length) return "";
  const sel = (db.settings.unitOf || {})[gymId];
  return us.some(u => u.id === sel) ? sel : us[0].id;      // sem escolha, a primeira
}
function unitName(gymId, uid){
  const u = gymUnits(gymId).find(x => x.id === uid);
  return u ? u.name : "";
}
/* o exercício separa carga por unidade? só se ele estiver marcado E a academia tiver unidades */
function exPerUnit(e){
  if(!e || !e.perUnit) return false;
  const gid = e.gymId || route().gymId;
  return gymUnits(gid).length > 1;
}
/* sessões que valem para a ANÁLISE deste exercício (progressão, gráfico, recordes).
   Sessão sem carimbo de unidade entra sempre: é histórico de antes das unidades. */
function logsOf(exId){
  const e = exById(exId);
  const all = exLogs(exId);
  if(!exPerUnit(e)) return all;
  const u = unitNow(e.gymId || route().gymId);
  return all.filter(l => !l.u || l.u === u);
}
/* ---------- modo simulação ----------
   Para testar pesos sem sujar o histórico: as séries vão para uma lista à parte, só na
   memória. Não entram no histórico, na progressão, nos recordes, no foco do dia, no
   "treino concluído" nem na nuvem. Fica só neste aparelho e some ao sair do modo. */
let simLogs = [];
let simMode = (() => { try{ return localStorage.getItem("fitglobal.sim") === "1"; }catch(e){ return false; } })();
function setSim(v){
  simMode = !!v;
  try{ localStorage.setItem("fitglobal.sim", simMode ? "1" : "0"); }catch(e){}
  if(!simMode) simLogs = [];
}
function simBannerHtml(){
  return simMode ? `<div class="updbanner" style="margin-bottom:10px">
    <span style="font-size:1.2rem">🧪</span>
    <div class="grow"><b>Modo simulação</b><div class="sub">Nada do que você registrar fica salvo nem conta no treino.</div></div>
    <button class="btn ghost sm" style="width:auto" data-action="sim-off">Sair</button></div>` : "";
}
function todayLog(exId){
  if(simMode) return simLogs.find(l => l.exerciseId === exId);
  const e = exById(exId);
  const hoje = db.logs.filter(l => l.exerciseId === exId && l.date === todayStr());
  if(!hoje.length) return undefined;
  if(!exPerUnit(e)) return hoje[0];
  const u = unitNow(e.gymId || route().gymId);
  return hoje.find(l => (l.u || "") === u) || hoje.find(l => !l.u);
}
function e1rm(w, r){ return r >= 1 ? w * (1 + r/30) : 0; }
function bestE1rmOfSets(sets){ return Math.max(...sets.map(s => e1rm(s.weight, s.reps))); }

/* ---------- progressão de carga ----------
   "Fiquei mais forte?" não pode sair de UMA série. A série boa de sorte sobe o número
   sozinha, e a série do fim — que é justamente a que trava a subida de carga na
   progressão dupla — sumia da conta quando o placar pegava só as 3 melhores.

   Placar da sessão = MÉDIA do 1RM estimado de TODAS as séries de trabalho do dia.
   Séries de trabalho = as feitas no peso mais alto daquele dia: aquecimento leve fica
   de fora sozinho, e a série extra no mesmo peso entra, porque ela também é trabalho.
   Média, e não soma, para o placar não subir só por fazer mais séries.

   A fórmula do 1RM estimado é a de Epley (1985): 1RM ≈ peso × (1 + reps/30). É ela que
   deixa comparar 60 kg × 12 com 70 kg × 8 num número só. */
function workSetsOf(sets){
  const list = (sets || []).filter(s => s && s.reps > 0);
  if(!list.length) return [];
  const w = Math.max(...list.map(s => s.weight));
  return list.filter(s => s.weight === w);
}
function sessionLoad(sets){
  const v = workSetsOf(sets).map(s => e1rm(s.weight, s.reps)).filter(x => x > 0);
  return v.length ? v.reduce((a,b) => a+b, 0) / v.length : 0;
}
function sessionVolume(sets){ return (sets || []).reduce((a,s) => a + s.weight*s.reps, 0); }
/* melhor sessão já feita (fora de uma data, para comparar a de hoje com o passado) */
function bestSession(exId, exceto){
  let v = 0, d = "";
  logsOf(exId).forEach(l => {
    if(l.date === exceto) return;
    const x = sessionLoad(l.sets);
    if(x > v){ v = x; d = l.date; }
  });
  return {v, d};
}
function loadSeries(exId){
  return logsOf(exId).map(l => ({d:l.date, v:sessionLoad(l.sets), n:l.sets.length}));
}
function median(v){
  const a = v.slice().sort((x,y) => x-y), n = a.length;
  if(!n) return 0;
  return n % 2 ? a[(n-1)/2] : (a[n/2-1] + a[n/2]) / 2;
}
/* Tendência por regressão de THEIL-SEN: calcula a inclinação entre CADA PAR de sessões
   e fica com a MEDIANA delas. Não é mínimos quadrados de propósito — com mínimos
   quadrados uma única sessão muito fora (um dia péssimo, ou um peso digitado errado)
   na ponta da série inverte o veredito inteiro, porque erro ao quadrado dá poder demais
   a um ponto só. Na mediana das inclinações, um ponto esquisito é voto vencido.
   O R² é calculado em cima dessa reta e serve de medida de consistência: alto =
   evolução firme, baixo = está oscilando muito para cravar uma direção. */
function loadTrend(exId, janela){
  const all = loadSeries(exId);
  if(all.length < 2) return null;
  const fim = all[all.length-1].d;
  let s = all.filter(p => daysBetween(p.d, fim) <= (janela || 56));
  if(s.length < 2) s = all.slice(-3);              // treinou pouco na janela: usa as últimas
  const x0 = s[0].d, n = s.length;
  const xs = s.map(p => daysBetween(x0, p.d)), ys = s.map(p => p.v);
  const pares = [];
  for(let i = 0; i < n; i++) for(let j = i+1; j < n; j++)
    if(xs[j] !== xs[i]) pares.push((ys[j]-ys[i]) / (xs[j]-xs[i]));
  const slope = pares.length ? median(pares) : 0;   // kg de e1RM por dia
  const b = median(ys.map((y,i) => y - slope*xs[i]));
  const my = ys.reduce((a,c) => a+c, 0)/n;
  let ssRes = 0, ssTot = 0;
  for(let i = 0; i < n; i++){ ssRes += Math.pow(ys[i] - (slope*xs[i] + b), 2); ssTot += Math.pow(ys[i] - my, 2); }
  const r2 = ssTot ? Math.max(0, 1 - ssRes/ssTot) : 0;
  const pctMes = my ? (slope*30)/my*100 : 0;
  const dir = pctMes > 1.5 ? "up" : pctMes < -1.5 ? "down" : "flat";
  /* com 2 ou 3 sessões a reta passa quase em cima dos pontos por construção — o R² daria
     100% e o app diria "evolução firme" sem ter base nenhuma. Abaixo de 4 sessões ele
     mostra a direção, mas admite que ainda é pouco. */
  return {dir, kgSem:slope*7, pctMes, r2, n, span:xs[n-1]-xs[0],
          poucas:n < 4, firme:n >= 4 && r2 >= 0.5,
          atual:ys[n-1], media:my, de:s[0].d, ate:s[n-1].d};
}
/* Comparação SÉRIE A SÉRIE na mesma posição: a 1ª série de agora contra a 1ª da última
   vez, a 2ª contra a 2ª, e assim por diante. É o que responde "progredi de verdade?" —
   comparar a 1ª série (descansado) com a 3ª (cansado) não diz nada. */
function setBySet(exId){
  const logs = logsOf(exId);
  if(logs.length < 2) return null;
  const cur = logs[logs.length-1], prev = logs[logs.length-2];
  const n = Math.min(cur.sets.length, prev.sets.length);
  const rows = [];
  for(let i = 0; i < n; i++){
    const a = prev.sets[i], b = cur.sets[i];
    const ea = e1rm(a.weight, a.reps), eb = e1rm(b.weight, b.reps);
    rows.push({i:i+1, a, b, pct: ea ? (eb-ea)/ea*100 : null});
  }
  const vals = rows.map(r => r.pct).filter(v => typeof v === "number");
  return {cur, prev, rows, maisCur:cur.sets.length-n, maisPrev:prev.sets.length-n,
          media: vals.length ? vals.reduce((a,b) => a+b, 0)/vals.length : null,
          dias: daysBetween(prev.date, cur.date)};
}
function records(exId){
  const logs = logsOf(exId);
  if(!logs.length) return null;
  let rm = {v:0,d:""}, wt = {v:0,d:""};
  logs.forEach(l => l.sets.forEach(s => {
    const v = e1rm(s.weight, s.reps);
    if(v > rm.v) rm = {v, d:l.date};
    if(s.weight > wt.v) wt = {v:s.weight, d:l.date};
  }));
  return {rm, wt};
}

function summaryLine(exId){
  const logs = logsOf(exId);
  const e = exById(exId), gid = e && (e.gymId || (route() || {}).gymId);
  const un = (e && exPerUnit(e) && gid) ? unitName(gid, unitNow(gid)) : "";
  if(!logs.length) return un ? `${esc(un)}: sem registros ainda` : "Sem registros ainda";
  const l = logs[logs.length-1];
  const best = l.sets.reduce((a,s) => s.weight > a.weight ? s : a, l.sets[0]);
  return `${un ? `<b>${esc(un)}</b> · ` : ""}${fmtDate(l.date)} · ${fmtW(best.weight)} kg × ${best.reps}`;
}

function templateById(id){ return TEMPLATES.find(t=>t.id===id); }
/* quantos exercícios DIFERENTES o modelo tem (o mesmo nome repete entre treinos) */
function templateExCount(t){
  const s = new Set(); t.treinos.forEach(tr=>tr.itens.forEach(i=>s.add(norm(i.n)))); return s.size;
}
/* aplica o modelo na academia: reaproveita exercício que já existe pelo nome, cria o que
   falta e monta as rotinas. Tenta pegar foto do catálogo, mas é chute — dá para trocar. */
async function applyTemplate(tplId, gymId){
  const tpl = templateById(tplId); if(!tpl) return null;
  let cat = null;
  try{ cat = await ExDb.load(); }catch(e){}                    // sem internet: segue sem foto
  const jaTem = gymExercises(gymId);
  const achaEx = n => jaTem.find(e => norm(e.name) === norm(n)) || db.exercises.find(e => norm(e.name) === norm(n) && (e.gymId === gymId || e.gymId === null));
  const criados = [], reusados = [], porNome = {};
  let ordem = nextOrder();
  tpl.treinos.forEach(tr=>tr.itens.forEach(i=>{
    const k = norm(i.n);
    if(porNome[k]) return;
    const ex = achaEx(i.n);
    if(ex){ porNome[k] = ex; reusados.push(ex.name); return; }
    let foto = "";
    if(cat){ const hit = ExDb.search(i.n)[0]; if(hit) foto = ExDb.img(hit.i); }
    const novo = {id:uid(), gymId, name:i.n, grp: GRUPOS.includes(i.g) ? i.g : undefined, targetSets:i.s, restSec:90, reps:i.r,
      notes:`${i.g} · ${tpl.autor}`, photo:foto, order: ordem++};
    db.exercises.push(novo); porNome[k] = novo; criados.push(novo.name);
  }));
  db.routines = db.routines || [];
  const rotinas = [];
  tpl.treinos.forEach((tr, idx)=>{
    /* nome livre se já existir um treino com o mesmo nome nesta academia */
    let nome = tr.nome, i = 2;
    while(gymRoutines(gymId).some(r=>r.name === nome)) nome = `${tr.nome} (${i++})`;
    const r = {id:uid(), gymId, name:nome, src:tpl.autor,
      exIds: tr.itens.map(it=>porNome[norm(it.n)].id), order: gymRoutines(gymId).length + idx};
    db.routines.push(r); rotinas.push(r);
  });
  save();
  return {criados, reusados, rotinas, comFoto: criados.length && cat};
}

/* ===================== PROGRESSÃO DE CARGA (dupla progressão) =====================
   A regra é a que você descreveu: fica no MESMO peso até fechar o topo da faixa em
   todas as séries. Fechou (12/12/12 numa faixa 8–12)? Sobe a carga e recomeça no piso
   (8/8/8). Não fechou? Mesmo peso, e a meta é justamente a série que ficou para trás.
   O degrau de carga sai do SEU histórico — o menor salto que você já deu nesse
   exercício. Sem isso o app não chuta: ele diz que não sabe e pergunta. */
/* os dois campos viram o mesmo texto "8–12" de sempre: o resto do app (parseReps,
   treinos prontos, sincronização) continua lendo igual */
function joinReps(a, b){
  const x = parseInt(a, 10), y = parseInt(b, 10);
  if(x > 0 && y > 0) return x === y ? String(x) : Math.min(x,y) + "–" + Math.max(x,y);
  if(x > 0) return String(x);
  if(y > 0) return String(y);
  return "";
}
function parseReps(s){
  const t = String(s||"").replace(/\s/g,"");
  const m = t.match(/(\d+)[–\-—a](\d+)/);
  if(m){ const a=+m[1], b=+m[2]; return {min:Math.min(a,b), max:Math.max(a,b)}; }
  const n = t.match(/(\d+)/);
  return n ? {min:+n[1], max:+n[1]} : null;
}
function loadStep(exId){
  /* o degrau que VOCÊ definiu no exercício manda: é a anilha/pino que a máquina tem.
     Sem ele, o app continua deduzindo do histórico o menor salto já dado. */
  const ex = exById(exId);
  if(ex && typeof ex.step === "number" && ex.step > 0) return ex.step;
  const ws = [...new Set(logsOf(exId).flatMap(l => l.sets.map(s => s.weight)))].sort((a,b)=>a-b);
  let step = null;
  for(let i=1;i<ws.length;i++){
    const d = Math.round((ws[i]-ws[i-1])*100)/100;
    if(d > 0 && (step === null || d < step)) step = d;
  }
  return step;
}
/* séries de trabalho da última sessão = as feitas no peso mais alto do dia
   (assim um aquecimento leve não estraga a leitura) */
function workSets(log){
  if(!log || !log.sets.length) return {w:0, reps:[]};
  const ws = workSetsOf(log.sets);
  return {w: ws.length ? ws[0].weight : 0, reps: ws.map(s => s.reps)};
}
/* ---- onde você está no ciclo da progressão dupla ----
   Sua regra: meta 8–12 em 3 séries. A carga só sobe quando as TRÊS chegam a 12 — ou
   seja, quando a soma bate 3 × 12 = 36 reps no topo. Aí o peso sobe um degrau e você
   recomeça em 8 nas três, e sobe rep a rep até fechar 36 de novo.
   Isto mede exatamente esse ciclo: quantas reps faltam para a carga subir. É a conta
   que decide a progressão — e ela olha TODAS as séries, não uma. */
function dpState(e, log){
  const range = parseReps(e.reps);
  if(!range || !log || !log.sets.length) return null;
  const ws = workSetsOf(log.sets);
  if(!ws.length) return null;
  const alvo = Math.max(e.targetSets || 1, 1);
  const reps = ws.map(s => s.reps).slice(0, alvo);
  const teto = alvo * range.max;
  /* rep acima do topo da faixa não vale ponto extra: 14 numa série não paga a que ficou
     em 10, senão dava para "subir de carga" sem ter fechado todas */
  const feito = reps.reduce((a,r) => a + Math.min(r, range.max), 0);
  return {range, peso: ws[0].weight, reps, alvo, teto, feito,
    faltam: Math.max(0, teto - feito),
    seriesFaltando: Math.max(0, alvo - reps.length),
    pct: teto ? Math.min(100, feito / teto * 100) : 0,
    fechou: reps.length >= alvo && reps.every(r => r >= range.max)};
}
function nextTarget(e){
  const range = parseReps(e.reps);
  if(!range) return {falta:"reps"};
  const logs = logsOf(e.id);
  if(!logs.length) return {falta:"historico", range};
  /* o plano de hoje sai da última sessão FECHADA. Usando o log de hoje, a meta mudava
     no meio do treino: bastava a 1ª série boa para ele já mandar subir a carga. */
  const base = logs.filter(l => l.date !== todayStr()).pop() || logs[logs.length-1];
  const {w, reps} = workSets(base);
  const alvo = e.targetSets;
  const fechou = reps.length >= alvo && reps.slice(0, alvo).every(r => r >= range.max);
  const step = loadStep(e.id);
  if(fechou){
    return {tipo:"subir", range, step, de:w, base,
      peso: step != null ? Math.round((w + step)*100)/100 : null,
      metaReps: range.min, sets: alvo, ultima: reps.slice(0, alvo)};
  }
  /* quanto falta para fechar: por série, o que ainda não bateu o topo */
  const faltas = [];
  for(let i=0;i<alvo;i++){
    const feito = reps[i] != null ? reps[i] : 0;
    if(feito < range.max) faltas.push({serie:i+1, feito, falta: range.max - feito});
  }
  return {tipo:"manter", range, peso:w, metaReps:range.max, sets:alvo, base,
    ultima: reps.slice(0, alvo), faltas,
    faltamReps: faltas.reduce((a,x) => a + x.falta, 0)};
}
/* "a, b e c" — o join(" e ") simples virava "a e b e c" com tres series */
function listaPt(arr){
  if(arr.length <= 1) return arr.join("");
  return arr.slice(0, -1).join(", ") + " e " + arr[arr.length - 1];
}
function targetHtml(e){
  const t = nextTarget(e);
  if(t.falta === "reps") return `<div class="sub" style="margin-bottom:8px">Defina a <b>faixa de reps</b> deste exercício (ex.: 8–12) para o app sugerir a progressão.</div>`;
  if(t.falta === "historico") return `<div class="sub" style="margin-bottom:8px">🎯 Primeira vez: escolha um peso que você feche <b>${t.range.min} reps</b> com folga e vá subindo até <b>${t.range.max}</b>.</div>`;
  const serie = n => n===1?"1ª":n===2?"2ª":n===3?"3ª":n+"ª";
  if(t.tipo === "subir"){
    return `<div class="goalcard up">
      <div class="gh">✅ Fechou ${t.ultima.join(" · ")} com ${fmtW(t.de)} kg — hora de subir</div>
      ${t.peso != null
        ? `<div class="gm">🎯 Hoje: <b>${fmtW(t.peso)} kg</b> · ${Array(t.sets).fill(t.metaReps).join(" · ")} reps</div>
           <div class="gs">Subiu ${fmtW(t.step)} kg, que é o menor degrau que você já usou aqui. Recomeça no piso da faixa e sobe de novo até ${t.range.max}.</div>`
        : `<div class="gm">🎯 Hoje: <b>suba a carga</b> · ${Array(t.sets).fill(t.metaReps).join(" · ")} reps</div>
           <div class="gs">Ainda não sei de quanto em quanto essa máquina sobe — use o próximo pino/anilha. Da próxima vez eu já sugiro o valor sozinho.</div>`}
    </div>`;
  }
  const f = t.faltas;
  const dp = dpState(e, t.base);
  return `<div class="goalcard">
    <div class="gh">🎯 Hoje: <b>${fmtW(t.peso)} kg</b> · ${Array(t.sets).fill(t.metaReps).join(" · ")} reps</div>
    <div class="gm">Última vez: ${t.ultima.length ? t.ultima.join(" · ") : "—"}</div>
    ${dp ? dpBarHtml(dp) : ""}
    <div class="gs">${f.length
      ? "Falta " + listaPt(f.map(x=>`<b>${x.falta}</b> rep${x.falta>1?"s":""} na ${serie(x.serie)}`)) + `. Fechando ${t.range.max} em todas, a carga sobe.`
      : `Feche ${t.sets} séries de ${t.range.max} para subir a carga.`}</div>
  </div>`;
}
/* barra do ciclo da progressão dupla: quanto do caminho até subir a carga já foi feito */
function dpBarHtml(dp){
  return `<div class="dpbar" title="Soma das reps das séries de trabalho, com teto na faixa">
    <div class="dpfill${dp.fechou ? " full" : ""}" style="width:${dp.pct.toFixed(1)}%"></div>
    <span class="dptxt">${dp.feito}/${dp.teto} reps${dp.fechou ? " — fechou ✓" : ` · faltam ${dp.faltam}`}</span>
  </div>`;
}

/* ---------- grupo muscular dos exercícios antigos ----------
   Exercícios cadastrados antes do campo "grupo" ficaram sem grupo e não aparecem na visão
   por grupo. Aqui o app deduz pelo NOME (português ou inglês) só quando bate sem dúvida;
   o que não reconhecer fica "sem grupo" para você escolher. Nunca troca um grupo já definido. */
const GRP_REGRAS = [
  ["Antebraço", /antebraco|punho|wrist|forearm|reverse curl|rosca inversa|rosca reversa|farmer/],
  ["Ombro", /reverse|inverso|invertid|rear delt|ombro|deltoid|lateral|face pull|reverse fly|voador inverso|crucifixo inverso|desenvolvimento|shoulder|militar|arnold|elevacao frontal|front raise|upright|delt/],
  ["Panturrilha", /panturrilha|calf|gemeos|soleo/],
  ["Abdômen", /abdom|crunch|prancha|plank|sit up|situp|leg raise|infra|core|obliquo|oblique|ab wheel|roda abdominal/],
  ["Posterior", /flexora|leg curl|stiff|romanian|romeno|hamstring|good morning|bom dia/],
  ["Glúteo", /glute|gluteo|hip thrust|pelvica|coice|kickback|abdutora/],
  ["Tríceps", /triceps|pushdown|frances|skull|tricep|mergulho|\bdip\b/],
  ["Bíceps", /biceps|rosca|curl|martelo|hammer|scott/],
  ["Quadríceps", /extensora|leg press|hack|agachamento|squat|pendulum|afundo|lunge|passada|sissy|quadriceps|leg extension|knee extension|cadeira extensora|step up|smith squat/],
  ["Costas", /puxada|pulldown|pull down|remada|\brow\b|barra fixa|pull up|pullup|chin up|serrote|costas|\blat\b/],
  ["Peito", /supino|bench|chest|peito|crucifixo|\bfly\b|pec deck|peck|flexao|push up|pushup|cross ?over|voador/]
];
function inferGrp(e){
  const t = [e.name, e.namePt, e.nameEn].filter(Boolean).map(norm).join(" | ");
  for(const [g, re] of GRP_REGRAS) if(re.test(t)) return g;
  return "";
}
/* Versão das regras. Exercícios cujo grupo foi DEDUZIDO pelo app (e.grpAuto) são reavaliados
   sozinhos quando as regras melhoram; o que você escolheu na mão nunca é tocado. */
const GRP_REGRAS_V = 3;
function autoGroups(){
  let n = 0;
  db.exercises.forEach(e => {
    if(e.grp && !e.grpAuto) return;                       // escolha sua: intocável
    const g = inferGrp(e);
    if(g && g !== e.grp){ e.grp = g; e.grpAuto = true; n++; }
    else if(g && !e.grpAuto){ e.grpAuto = true; }
  });
  if(n) save();
  return n;
}
/* IA (Gemini, se houver chave): só para o que as regras não reconheceram */
async function aiGrupo(nome){
  if(!geminiKey()) return "";
  const model = db.settings.aiModel || (await aiConnect()).modelo;
  const j = await geminiFetch("/models/" + encodeURIComponent(model) + ":generateContent", {
    method:"POST",
    body: JSON.stringify({
      contents:[{parts:[{text:`Exercício de musculação: "${nome}". Qual é o grupo muscular PRINCIPAL trabalhado? Responda com um dos valores permitidos, ou "" se não for possível saber.`}]}],
      generationConfig:{temperature:0, responseMimeType:"application/json",
        responseSchema:{type:"OBJECT", properties:{grupo:{type:"STRING", enum:GRUPOS.concat([""])}}, required:["grupo"]}}
    })
  });
  const parts = (((j.candidates||[])[0]||{}).content||{}).parts;
  try{ const d = JSON.parse(parts[0].text); return GRUPOS.includes(d.grupo) ? d.grupo : ""; }catch(e){ return ""; }
}
let _grpBusy = false;
async function classifyPending(){
  if(_grpBusy || !geminiKey()) return;
  const sem = db.exercises.filter(e => !e.grp && !e.grpTried);
  if(!sem.length) return;
  _grpBusy = true;
  try{
    let n = 0;
    for(const e of sem.slice(0, 15)){
      try{
        const g = await aiGrupo([e.nameEn, e.namePt, e.name].filter(Boolean)[0]);
        e.grpTried = true;
        if(g){ e.grp = g; e.grpAuto = true; n++; }
      }catch(x){ break; }
    }
    if(n){ save(); render(); }
  } finally { _grpBusy = false; }
}
function migrateGroups42(){
  if(db.settings.migGrp42 && db.settings.grpRulesV === GRP_REGRAS_V) return;
  if(db.settings.grpRulesV === undefined){
    /* o que já tem grupo e bate com as regras foi (muito provavelmente) deduzido: passa a ser reavaliável */
    db.exercises.forEach(e => { if(e.grp && inferGrp(e) === e.grp) e.grpAuto = true; });
  }
  autoGroups();
  db.settings.migGrp42 = true; db.settings.grpRulesV = GRP_REGRAS_V; save(false);
}

/* ---------- juntar academias numa rede com unidades ----------
   Antes das unidades (v3.8), cada filial era uma academia, com os mesmos exercícios
   cadastrados de novo em cada uma. Aqui as academias escolhidas viram unidades de UMA só:
   exercícios com o mesmo nome viram um só (o histórico de cada filial vai junto, carimbado
   com a unidade), treinos com o mesmo nome se unem. Nada é apagado; antes de mexer o app
   guarda uma cópia e dá para desfazer. */
const LS_ANTES = "fitglobal.antes-juntar";
const PALAVRAS_VAZIAS = new Set(["na","no","nas","nos","de","da","do","das","dos","em","a","o","as","os","com","para","e"]);
function exKeys(e){
  return [e.name, e.namePt, e.nameEn].filter(Boolean).map(n => norm(n).split(" ").filter(w => w && !PALAVRAS_VAZIAS.has(w)).join(" "));
}
/* "Smart Fit Centro" dentro de "Smart Fit" -> "Centro" */
function sugereUnidade(mainName, nome){
  const m = norm(mainName).replace(/\s/g, ""), b = nome.trim().split(/\s+/);
  let acc = "", i = 0;
  while(i < b.length - 1 && m.startsWith(acc + norm(b[i]).replace(/\s/g, "")) && acc.length < m.length){ acc += norm(b[i]).replace(/\s/g, ""); i++; }
  return (acc === m ? b.slice(i).join(" ") : "") || nome;
}
/* Redes: academias cujo nome começa igual ("Smart Fit", "Smart Fit Centro", "Smartfit Shopping")
   são juntas sozinhas, uma vez, ao abrir a v4.2. A cópia de antes fica guardada para desfazer. */
function redesDeAcademias(){
  const compacto = g => norm(g.name).replace(/\s/g, "");
  const grupos = [];
  db.gyms.forEach(g => {
    const k = compacto(g);
    const gr = grupos.find(x => x.some(o => { const c = compacto(o); const n = Math.min(c.length, k.length);
      let i = 0; while(i < n && c[i] === k[i]) i++; return i >= 5 && (i === c.length || i === k.length); }));
    if(gr) gr.push(g); else grupos.push([g]);
  });
  return grupos.filter(x => x.length > 1);
}
function migrateRedes42(){
  if(db.settings.migRede42) return;
  db.settings.migRede42 = true;
  const redes = redesDeAcademias();
  if(!redes.length){ save(false); return; }
  let total = 0, nomes = [];
  redes.forEach(gr => {
    gr = gr.slice().sort((a, b) => norm(a.name).length - norm(b.name).length);
    const main = gr[0];                                   // o nome mais curto é a rede ("Smart Fit")
    const itens = gr.slice(1).map(g => ({id:g.id, nome:sugereUnidade(main.name, g.name)}));
    const vistos = new Set();
    itens.forEach((it, i) => { let n = it.nome, k = 2; while(vistos.has(norm(n))) n = it.nome + " " + k++; vistos.add(norm(n)); it.nome = n; });
    mergeGyms(main.id, "Principal", itens);
    total += itens.length; nomes.push(main.name);
  });
  save();
  setTimeout(() => toast(`🔀 Juntei ${total} academia${total===1?"":"s"} em ${nomes.join(", ")} como unidades (desfazer: menu ⋮ da academia)`), 1200);
}
function mergeForm(mainId){

    <p class="sub" style="margin-bottom:12px">As academias marcadas viram <b>unidades</b> de "${esc(main.name)}".
      Exercícios com o mesmo nome viram um só (cada unidade mantém o seu histórico de carga) e treinos com o mesmo nome se unem.
      Nada é apagado e dá para desfazer logo depois.</p>
    ${temUn ? "" : `<div class="field"><label for="m-main">Nome da unidade que "${esc(main.name)}" já era</label>
      <input id="m-main" value="Principal" maxlength="40"></div>`}

      <input type="checkbox" class="m-on" data-g="${g.id}" checked style="flex:none">

      <input class="m-un" data-g="${g.id}" value="${esc(sugereUnidade(main.name, g.name))}" maxlength="40" aria-label="Nome da unidade"></div></div>`).join("")}
    <button class="btn" data-action="merge-go" data-gym="${mainId}" style="margin-top:12px">🔀 Juntar</button>
    ${localStorage.getItem(LS_ANTES) ? `<button class="btn ghost" data-action="merge-undo" style="margin-top:8px">↩ Desfazer a última junção</button>` : ""}
    <button class="btn ghost" data-action="close-modal" style="margin-top:8px">Cancelar</button>`);
}
function mergeGyms(mainId, mainUnitName, itens){
  const main = gymById(mainId);
  try{ localStorage.setItem(LS_ANTES, JSON.stringify(db)); }catch(e){}
  main.units = main.units || [];
  let uMain = main.units[0];
  const mainVazia = !db.exercises.some(e => e.gymId === mainId) && !db.logs.some(l => l.gymId === mainId);
  if(!main.units.length && !mainVazia){ uMain = {id:uid(), name:mainUnitName || "Principal"}; main.units.push(uMain); }
  /* o que já foi feito na academia principal fica na unidade dela */
  if(uMain) db.logs.forEach(l => { if(l.gymId === mainId && !l.u) l.u = uMain.id; });
  db.settings.unitOf = db.settings.unitOf || {};
  if(uMain && !db.settings.unitOf[mainId]) db.settings.unitOf[mainId] = uMain.id;
  const rtMap = {}, exMap = {};
  let juntos = 0, movidos = 0;
  itens.forEach(({id, nome}) => {
    const g = gymById(id); if(!g) return;
    let un = main.units.find(u => norm(u.name) === norm(nome));
    if(!un){ un = {id:uid(), name:nome}; main.units.push(un); }
    db.logs.forEach(l => { if(l.gymId === id){ l.gymId = mainId; l.u = un.id; } });
    db.exercises.filter(e => e.gymId === id).forEach(e => {
      const ks = exKeys(e);
      const gemeo = db.exercises.find(x => x.id !== e.id && x.gymId === mainId && exKeys(x).some(k => ks.includes(k)));
      if(gemeo){
        db.logs.forEach(l => { if(l.exerciseId === e.id) l.exerciseId = gemeo.id; });
        gemeo.perUnit = true;
        ["grp","photo","step","reps","namePt","nameEn"].forEach(k => { if(!gemeo[k] && e[k]) gemeo[k] = e[k]; });
        if(!gemeo.notes && e.notes) gemeo.notes = e.notes;
        exMap[e.id] = gemeo.id; juntos++;
      } else { e.gymId = mainId; movidos++; }
    });
    db.exercises = db.exercises.filter(e => !exMap[e.id]);
    (db.routines || []).filter(r => r.gymId === id).forEach(r => {
      const igual = db.routines.find(x => x.id !== r.id && x.gymId === mainId && norm(x.name) === norm(r.name));
      if(igual){
        const ids = (igual.exIds || []).concat(r.exIds || []).map(x => exMap[x] || x);
        igual.exIds = ids.filter((x, i) => ids.indexOf(x) === i);
        rtMap[r.id] = igual.id;
        db.routines = db.routines.filter(x => x.id !== r.id);
      } else { r.gymId = mainId; r.order = gymRoutines(mainId).length; }
    });
    (db.sessions || []).forEach(x => { if(x.gym === id){ x.gym = mainId; x.gymName = main.name; if(x.rt && rtMap[x.rt]) x.rt = rtMap[x.rt]; } });
    if(db.settings.focus && db.settings.focus.gym === id){ db.settings.focus.gym = mainId; if(rtMap[db.settings.focus.rt]) db.settings.focus.rt = rtMap[db.settings.focus.rt]; }
    delete db.settings.unitOf[id];
    db.gyms = db.gyms.filter(x => x.id !== id);
  });

/* Exportar no celular: o download por link não funciona dentro do APK (o arquivo some).
   Tenta o compartilhar do Android com o arquivo; se não der, copia o texto. */
async function exportBackup(semFotos){
  const o = JSON.parse(JSON.stringify(db));
  const compartilhaArquivo = !semFotos && navigator.canShare && navigator.canShare({files:[new File(["{}"], "a.json", {type:"application/json"})]});
  if(semFotos || !compartilhaArquivo){ (o.exercises || []).forEach(e => { if(e.photo && String(e.photo).slice(0,5) === "data:") e.photo = ""; }); delete o.settings.sync; }
  const txt = JSON.stringify(o, null, (semFotos || !compartilhaArquivo) ? 0 : 1);
  const nome = "fitness-global-" + todayStr() + ".json";
  if(!semFotos){
    try{
      const f = new File([txt], nome, {type:"application/json"});
      if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], title:nome}); toast("Backup enviado ✓"); return; }
    }catch(e){ if(e && e.name === "AbortError") return; }
  }
  if(!semFotos && compartilhaArquivo){
    try{
      const u = URL.createObjectURL(new Blob([txt], {type:"application/json"}));
      const aEl = document.createElement("a"); aEl.href = u; aEl.download = nome; aEl.click(); URL.revokeObjectURL(u);
    }catch(e){}
  }
  const ok = await copyText(txt);
  toast(ok ? `📋 Dados copiados (${Math.round(txt.length/1024)} KB) — cole numa conversa ou nota` : "Não consegui copiar nem salvar.");
}

function routineById(id){ return (db.routines||[]).find(r=>r.id===id); }
/* exercícios de uma rotina, na ordem em que ela guarda; ignora id que não existe mais */
function routineExercises(r, gymId){

   Guardado com a DATA junto, então vira o dia e some sozinho: nada de limpar na mão. */
function skipKey(e, rid){ return e.id + (rid ? "|" + rid : ""); }
function isSkipped(e, rid){
  const s = (db.settings.skipToday || {})[skipKey(e, rid)];
  return s === todayStr();
}
/* séries feitas hoje. Num treino, só contam as séries que VOCÊ registrou dentro daquele
   treino — antes um exercício global aparecia como "1/3 feito" em todas as rotinas. */
function setsListToday(exId, rid){
  const l = todayLog(exId);
  if(!l) return [];
  /* série sem treino marcado (feita na aba "Todos") vale em qualquer treino que tenha o
     exercício; só a série carimbada com OUTRO treino fica de fora */
  return rid ? l.sets.filter(s => !s.rt || s.rt === rid) : l.sets;
}
function setsToday(exId, rid){ return setsListToday(exId, rid).length; }
/* séries que você marcou "essa eu não vou fazer" hoje. Guardado com a data junto: vira o dia e some.
   Não entram no histórico, no volume nem na progressão; só fecham o exercício do dia. */
function skipSetsN(exId){
  const s = (db.settings.skipSet || {})[exId];
  return (s && s.d === todayStr()) ? s.n : 0;
}
function exStateToday(e, rid){
  if(isSkipped(e, rid)) return "skip";
  const n = setsToday(e.id, rid), sk = skipSetsN(e.id);
  if(n >= e.targetSets) return "done";
  if(sk && n + sk >= e.targetSets) return n > 0 ? "done" : "skip";
  return n > 0 ? "doing" : "todo";
}
/* primeira vez deste exercício NESTA unidade (e já existe registro em outra): vira aviso */
function primeiraNaUnidade(e, gymId){
  if(!exPerUnit(e)) return null;
  const u = unitNow(gymId);
  const todos = exLogs(e.id);
  if(!todos.length || todos.some(l => l.u === u)) return null;
  const ult = todos[todos.length - 1];
  return {u, ult};
}

/* ===================== academia em foco =====================
   Assim que voce registra a primeira serie do dia, o app passa a saber ONDE voce esta
   treinando: a academia (e o treino A/B/C) viram o foco do dia. Isso e o que deixa ele
   dizer "treino concluido" na hora certa, em vez de olhar para todas as academias.
   Guardado com a data junto, entao vira o dia e some sozinho. */
function focusToday(){
  const f = db.settings.focus;
  return (f && f.d === todayStr()) ? f : null;
}
function setFocus(gymId, rid){
  if(!gymId) return;
  const f = focusToday();
  if(f && f.gym === gymId && (f.rt || "") === (rid || "")) return;
  db.settings.focus = {d: todayStr(), gym: gymId, rt: rid || ""};
  save(false);
}
/* o que o foco de hoje abrange, com o estado de cada exercicio */
function focusList(f){
  if(!f) return null;
  const g = db.gyms.find(x => x.id === f.gym); if(!g) return null;
  const r = f.rt ? routineById(f.rt) : null;
  if(f.rt && !r) return null;                       // treino apagado depois
  const exs = (r ? routineExercises(r, g.id) : gymExercises(g.id)).filter(e => !globalBusyElsewhere(e, g.id));
  return {g, r, exs, st: exs.map(e => exStateToday(e, f.rt || ""))};
}
function workoutStats(f){
  const L = focusList(f);
  if(!L || !L.exs.length) return null;
  const feitos = L.st.filter(x => x === "done").length;
  const pulados = L.st.filter(x => x === "skip").length;
  let series = 0, volume = 0;
  L.exs.forEach(e => setsListToday(e.id, f.rt || "").forEach(x => { series++; volume += x.weight * x.reps; }));
  return Object.assign({}, L, {feitos, pulados, faltam: L.exs.length - feitos - pulados,
    series, volume, total: L.exs.length});
}
/* chamado depois de registrar serie e depois de marcar/desmarcar um exercicio como
   "hoje nao": o treino acaba tanto fechando a ultima serie quanto riscando o ultimo
   exercicio que faltava */
function checkWorkoutDone(){
  const f = focusToday(); if(!f) return;
  const st = workoutStats(f); if(!st) return;
  if(st.faltam > 0) return;
  if(st.feitos === 0) return;                       // riscar tudo nao e treino concluido
  const k = f.gym + "|" + (f.rt || "");
  db.settings.doneDay = db.settings.doneDay || {};
  if(db.settings.doneDay[k] === todayStr()) return; // uma vez por dia
  db.settings.doneDay[k] = todayStr();
  /* histórico de treinos: onde você treinou e em que dia, gravado só quando o treino
     foi realmente concluído (tudo feito ou riscado) */
  db.sessions = db.sessions || [];
  if(!db.sessions.some(x => x.date === todayStr() && x.gym === f.gym && (x.rt || "") === (f.rt || ""))){
    db.sessions.push({id:uid(), date:todayStr(), at:nowHM(), gym:f.gym, gymName:st.g.name,
      rt:f.rt || "", rtName:st.r ? st.r.name : "",
      feitos:st.feitos, pulados:st.pulados, total:st.total, series:st.series,
      volume:Math.round(st.volume)});
  }
  save(false);
  doVibrate([90, 60, 90, 60, 320]);
  /* espera a vez: se a festa de recorde ou o aviso do relogio estiverem na tela, o
     "treino concluido" entra depois, em vez de engolir o que ja estava aberto */
  const abrir = () => {
    if(modal.classList.contains("on") || prBox.classList.contains("on")){ setTimeout(abrir, 900); return; }
    workoutDoneForm(st);
  };
  setTimeout(abrir, 600);
}
